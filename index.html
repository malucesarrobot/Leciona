    if(!porTema[r.temaId]) porTema[r.temaId]={nome:t.nome, objs:new Set()};
    (r.objetos||[]).forEach(o=>porTema[r.temaId].objs.add(o));
  });
  const rotObj={quadro:'Texto',estudo:'Texto',slides:'Slide',mapaMental:'Mapa',avaliacao:'Avaliação'};
  let linhas=Object.values(porTema).map(info=>{
    const tags=[...info.objs].map(o=>{

      return '<span class="apl-tag" style="background:'+c.bg+';color:'+c.cor+'">'+esc(rotObj[o]||o)+'</span>';
    }).join('');
    return '<div class="apl-row"><span class="apl-tema">'+esc(info.nome)+'</span>'+tags+'</div>';
  }).join('');
  return '<details class="apl-faixa"><summary>📌 Conteúdo aplicado nesta turma ('+Object.keys(porTema).length+' tema(s))</summary>'+linhas+'</details>';
}
/* ---------- Nota qualitativa (comportamento) ----------
   Começa em 10 por turma/disciplina e é desabonada em décimos por
   ocorrência (celular, atraso de atividade, comportamento, recusa,
   dormindo em sala etc.) — cada desconto fica registrado com motivo e
   data, nunca só um número solto. NÃO entra em mediaAluno()/mediaAtividade()
   de propósito — é uma nota à parte, só pra lançar no SIAP quando ela
   mandar (aqui: gerar o CSV pronto pra digitar lá, já que o SIAP não tem
   API — não existe um jeito de preencher ele automaticamente). */
const QUALITATIVA_MOTIVOS=[
  {k:'celular', label:'Uso de celular', valor:-0.1},
  {k:'atraso', label:'Atividade atrasada', valor:-0.1},
  {k:'comportamento', label:'Comportamento inadequado', valor:-0.1},
  {k:'recusa', label:'Recusa em realizar atividade', valor:-0.1},
  {k:'dormindo', label:'Dormindo em sala', valor:-0.1},
  {k:'outro', label:'Outro', valor:-0.1},
];
function persistQualitativa(q){ q._ts=Date.now(); qualitativa[q.id]=q; lsSet(LS_QUALITATIVA,JSON.stringify(qualitativa)); if(DB) DB.ref('leciona/qualitativa/'+q.id).set(q).catch(e=>toast('⚠ Falha ao gravar (mantido localmente). '+e.message,'err')); }
function removerQualitativa(id){
  delete qualitativa[id];

  if(DB) DB.ref('leciona/qualitativa/'+id).remove().catch(e=>toast('⚠ Removido localmente, mas falhou ao remover no Firebase: '+e.message,'err'));
}
function qualitativaDoAluno(alunoId, turmaId){ return Object.values(qualitativa).filter(q=>q&&q.alunoId===alunoId&&q.turmaId===turmaId).sort((a,b)=>(b._ts||0)-(a._ts||0)); }
function notaQualitativa(alunoId, turmaId){
  const total=10+qualitativaDoAluno(alunoId,turmaId).reduce((s,q)=>s+(q.valor||0),0);
  return Math.max(0, Math.min(10, total));
}

/* CSV pronta pra digitar no SIAP (sem API — o SIAP não integra automaticamente) */
function exportarQualitativaCSV(){
  const turmaId=scope.turma; if(!turmaId){ toast('Selecione uma turma.','err'); return; }
  const tu=turmas[turmaId]||{}; const als=alunosDaTurma(turmaId);
  if(!als.length){ toast('Nenhum aluno nesta turma.','err'); return; }
  let csv='Matrícula;Nome;Nota Qualitativa;Descontos\n';
  als.forEach(al=>{

    csv+=[al.matricula||'', al.nome, notaQualitativa(al.id,turmaId).toFixed(1), resumo].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')+'\n';
  });

  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='Qualitativa_'+esc(turmaNome(tu))+'_'+isoLocal(new Date())+'.csv'; a.click();
  toast('CSV pronta — confira e digite no SIAP.','ok');
}
let mediaModo = {}; // { turmaId: 'ponderada'|'aritmetica' }
function getMediaModo(turmaId){ return mediaModo[turmaId]||'ponderada'; }
function setMediaModo(turmaId,modo){
  mediaModo[turmaId]=modo;
  try{ lsSet('leciona_media_modo', JSON.stringify(mediaModo)); }catch(e){}
  if(DB) DB.ref('leciona/media_modo/'+turmaId).set(modo).catch(()=>{});
  renderNotas();
}
function mediaAluno(alunoId,atvs,turmaId){
  const modo = getMediaModo(turmaId || (atvs[0]&&atvs[0].turmaIds&&atvs[0].turmaIds[0]));
  // Atividade extra/bônus (tipo "extra" ou marcada com a estrela ⭐ no
  // modal, igual à casinha 🏠 do dever de casa) NÃO entra no cálculo da
  // média — em vez disso soma décimos direto no resultado final, depois
  // do cálculo das obrigatórias. Feito = av.peso décimos (checklist) ou
  // o valor digitado (nota) somado como está, sem normalizar pra 0–10.
  const normais=atvs.filter(av=>!(av.tipo==='extra'||av.extra===true));
  const extras=atvs.filter(av=>av.tipo==='extra'||av.extra===true);
  const pares=normais.map(av=>{
    const n=notaDoAluno(alunoId,av.id);
    let notaEm10;
    if(av.checklist===true){
      // checkbox = atividade por execução: a atividade foi dada a todos.
      // marcado = fez (10); desmarcado OU sem registro = não fez (0).
      notaEm10 = (n && n.valor>0) ? 10 : 0;
    } else {
      // nota digitada: a atividade foi cobrada de todos. Sem nota lançada = não
      // entregou = 0. Assim quem fez menos atividades tem média proporcionalmente menor.
      if(!n || n.valor==null){ notaEm10 = 0; }
      else { const max=av.valorMax||10; notaEm10 = max>0 ? (n.valor/max)*10 : n.valor; }
    }
    const peso = modo==='aritmetica' ? 1 : (av.peso||1);
    return {v:notaEm10, p:peso};
  });
  if(!pares.length && !extras.length) return null; // turma sem nenhuma atividade ainda
  let base=null;
  if(pares.length){
    const total=pares.reduce((s,x)=>s+x.v*x.p,0);
    const pesos=pares.reduce((s,x)=>s+x.p,0);
    base = pesos>0?total/pesos:null;
  }
  const bonusDecimos=extras.reduce((s,av)=>{
    const n=notaDoAluno(alunoId,av.id);
    if(av.checklist===true) return s+((n&&n.valor>0)?(av.peso||1):0);
    return s+((n&&n.valor!=null)?n.valor:0);
  },0);
  if(base==null && !bonusDecimos) return null;
  return Math.min(10, (base||0)+bonusDecimos);
}
function mediaGeralTurma(turmaId){
  const als=alunosDaTurma(turmaId), atvs=atividadesDaTurma(turmaId);
  if(!als.length || !atvs.length) return null;
  const medias=als.map(a=>mediaAluno(a.id,atvs,turmaId)).filter(m=>m!=null);
  if(!medias.length) return null;
  return medias.reduce((s,m)=>s+m,0)/medias.length;
}

/* ── Ranking — pra projetar no fim da aula: quem está na frente na turma,
   e como cada turma está colocada em cada disciplina.
   Pedido explícito da Malu — era a função mais esperada no Cepi Marajó.

   Empate: não é competição oficial, é brincadeira — mas resolvido com "1224"
   (quem empata divide a posição; a próxima já pula, ex.: 3 empatados em 1º,
   o próximo é 4º, não 2º). Desempate por pontualidade: como o Leciona não
   tem portal do aluno com data de entrega própria, uso a data/hora que a
   professora marcou a nota/check como aproximação de "entregou no prazo" —
   quem foi marcado mais cedo, em média, fica na frente de quem empatou na
   nota mas foi marcado depois. */
function medalha(pos){ return pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':pos+'º'; }
let _rankingModoTurmas='geral'; // 'geral' | 'disciplina'
function pontualidadeAluno(alunoId, atvs, turmaId){
  const tss=atvs.map(av=>{ const n=notaDoAluno(alunoId,av.id); return (n&&n.valor!=null)?n._ts:null; }).filter(Boolean);
  return tss.length ? tss.reduce((s,t)=>s+t,0)/tss.length : Infinity; // sem nenhuma nota lançada = "mais atrasado" possível
}
/* Recebe uma lista já ordenada do melhor pro pior; "mesmaChave" diz se dois
   itens vizinhos são realmente empatados em tudo que importa pro critério. */
function calcularPosicoes(lista, mesmaChave){
  let pos=1;
  return lista.map((item,i)=>{
    if(i>0 && !mesmaChave(lista[i-1],item)) pos=i+1;
    return {...item, pos};
  });
}
function abrirRanking(){
  const turmaId=scope.turma;
  if(!turmaId){ toast('Selecione uma turma.','err'); return; }
  if(!alunosDaTurma(turmaId).length){ toast('Essa turma ainda não tem alunos cadastrados.','err'); return; }
  document.getElementById('viewRanking').classList.remove('hidden');
  renderRanking();
}
function fecharRanking(){ document.getElementById('viewRanking').classList.add('hidden'); }
function renderRanking(){
  _broadcastProjState();
  const turmaId=scope.turma; const tu=turmas[turmaId]||{};
  document.getElementById('rankingTitulo').textContent='🏆 '+turmaNome(tu)+' · '+(tu.disciplina||'');
  const atvs=atividadesDaTurma(turmaId);
  const als=alunosDaTurma(turmaId);

  let ranking=als.map(a=>({aluno:a, media:mediaAluno(a.id,atvs,turmaId), pont:pontualidadeAluno(a.id,atvs,turmaId)}))
    .filter(r=>r.media!=null)
    .sort((a,b)=>b.media-a.media || a.pont-b.pont);
  ranking=calcularPosicoes(ranking, (a,b)=>a.media===b.media && a.pont===b.pont);
  const alunosHtml = ranking.length ? ranking.map(r=>
    '<div class="rk-row'+(r.pos<=3?' rk-top':'')+'"><span class="rk-pos">'+medalha(r.pos)+'</span><span class="rk-nome">'+esc(r.aluno.nome)+'</span><span class="rk-nota">'+r.media.toFixed(1)+'</span></div>'
  ).join('') : '<p style="opacity:.6">Ainda sem notas suficientes pra ranquear.</p>';

  // Turmas comparadas: alterna entre visão Geral (todas juntas, qualquer
  // disciplina) e Por disciplina (uma classificação própria pra cada
  // matéria — a mesma turma pode ser 1ª numa e última noutra, de propósito).
  const linha=(r,destacar)=>'<div class="rk-row'+(r.pos<=3?' rk-top':'')+(r.turma.id===turmaId?' rk-atual':'')+'"><span class="rk-pos">'+medalha(r.pos)+'</span><span class="rk-nome">'+esc(turmaNome(r.turma))+(destacar?'':' <small style="opacity:.6">· '+esc(r.turma.disciplina||'')+'</small>')+(r.turma.id===turmaId?' — vocês!':'')+'</span><span class="rk-nota">'+r.media.toFixed(1)+'</span></div>';
  const comMedia=turmasAtivas().map(t=>({turma:t, media:mediaGeralTurma(t.id)})).filter(r=>r.media!=null);

  const toggle='<div class="aval-tabs" style="justify-content:center">'+
    '<button class="aval-tab'+(_rankingModoTurmas==='geral'?' active':'')+'" onclick="_rankingModoTurmas=\'geral\';renderRanking()">Geral</button>'+
    '<button class="aval-tab'+(_rankingModoTurmas==='disciplina'?' active':'')+'" onclick="_rankingModoTurmas=\'disciplina\';renderRanking()">Por disciplina</button>'+
  '</div>';

  let turmasHtml;
  if(!comMedia.length){
    turmasHtml='<p style="opacity:.6">Sem dados suficientes pra comparar turmas ainda.</p>';
  } else if(_rankingModoTurmas==='disciplina'){
    const discs=[...new Set(comMedia.map(r=>r.turma.disciplina).filter(Boolean))].sort();
    turmasHtml=discs.map(disc=>{
      let lista=comMedia.filter(r=>r.turma.disciplina===disc).sort((a,b)=>b.media-a.media);
      lista=calcularPosicoes(lista,(a,b)=>a.media===b.media);
      return '<h4 style="color:var(--ochre);opacity:.85;font-size:14px;margin:14px 0 6px">'+esc(disc)+'</h4>'+lista.map(r=>linha(r,true)).join('');
    }).join('');
  } else {
    let lista=comMedia.slice().sort((a,b)=>b.media-a.media);
    lista=calcularPosicoes(lista,(a,b)=>a.media===b.media);
    turmasHtml=lista.map(r=>linha(r,false)).join('');
  }

  // Ranking geral da escola: pool de todo aluno de toda turma, por média
  // individual — pra ela premiar os melhores desempenhos, não pra projetar
  // pros alunos (por isso fica separado, no fim, sem destaque de medalha
  // gigante). Cada aluno aparece uma vez por turma/disciplina em que estuda
  // com ela (não tenta unificar a mesma pessoa entre disciplinas).
  let geralEscola=[];
  turmasAtivas().forEach(t=>{
    const atvsT=atividadesDaTurma(t.id);
    if(!atvsT.length) return;
    alunosDaTurma(t.id).forEach(a=>{
      const m=mediaAluno(a.id,atvsT,t.id);
      if(m!=null) geralEscola.push({aluno:a, turma:t, media:m});
    });
  });
  geralEscola.sort((a,b)=>b.media-a.media);
  function top30Html(pool){
    let lista=calcularPosicoes(pool.slice().sort((a,b)=>b.media-a.media),(a,b)=>a.media===b.media).slice(0,30);
    return lista.length ? lista.map(r=>
      '<div class="rk-row'+(r.pos<=3?' rk-top':'')+'"><span class="rk-pos">'+medalha(r.pos)+'</span><span class="rk-nome">'+esc(r.aluno.nome)+' <small style="opacity:.6">· '+esc(turmaNomeCompleto(r.turma))+'</small></span><span class="rk-nota">'+r.media.toFixed(1)+'</span></div>'
    ).join('') : '<p style="opacity:.6">Sem dados suficientes ainda.</p>';
  }
  const unidadesEscola=[...new Set(Object.values(turmas).filter(Boolean).map(t=>t.unidade).filter(Boolean))];

  document.getElementById('rankingBody').innerHTML =
    '<div class="rk-section"><h3>Ranking da turma</h3>'+alunosHtml+'</div>'+
    '<div class="rk-section"><h3>Turmas</h3>'+toggle+turmasHtml+'</div>'+
    '<div class="rk-section"><h3>🏆 Ranking geral — top 30</h3><p style="opacity:.6;font-size:12px;margin-bottom:8px">Todos os alunos de todas as turmas, por média — pra você premiar os melhores desempenhos.</p>'+top30Html(geralEscola)+'</div>'+
    unidadesEscola.map(u=>'<div class="rk-section"><h3>🏆 '+esc(u)+' — top 30</h3>'+top30Html(geralEscola.filter(r=>r.turma.unidade===u))+'</div>').join('');
}

// ── Render principal ──────────────────────────────────────────────────────
/* Troca de turma direto na aba Notas (sem passar por Gestão). Atualiza o
   scope inteiro (disciplina/série/unidade) pra ficar consistente se ela for
   pra outra aba depois, e recarrega a tabela de notas na hora. */
/* Mantém os 4 <select> antigos (escondidos, mas ainda lidos por
   refreshTurmas()/onScopeChange() por baixo dos panos) alinhados com o
   scope atual. Bug real encontrado: sem isso, o listener do Firebase em
   "leciona/turmas" chama renderThemes()→refreshTurmas() toda vez que
   qualquer turma muda em qualquer lugar (o que acontece o tempo todo) —
   e refreshTurmas() RESCREVE scope.turma com base nesses 4 selects. Se eles
   ficarem desatualizados (ex.: turma trocada só por aqui, não por Gestão),
   a turma escolhida em Notas "volta sozinha" pra outra pouco depois. */
function _syncSelectsOcultosComScope(){
  const t=turmas[scope.turma]; if(!t) return;
  const selDisc=document.getElementById('selDisc'); if(selDisc) selDisc.value=t.disciplina;
  refreshSeries();
  const selUnidade=document.getElementById('selUnidade'); if(selUnidade) selUnidade.value=t.unidade||scope.unidade;
  const selSerie=document.getElementById('selSerie'); if(selSerie) selSerie.value=t.serie;
  const selTurma=document.getElementById('selTurma'); if(selTurma) selTurma.value=scope.turma;
}
function trocarTurmaNotas(turmaId){
  const t=turmas[turmaId]; if(!t) return;
  scope.turma=turmaId; scope.disc=t.disciplina; scope.serie=t.serie; scope.unidade=t.unidade||scope.unidade;
  _syncSelectsOcultosComScope();
  saveScope();
  window.__configurarHorario=false;
  renderNotas();
}
/* ---------- Chamada (presença) ----------
   Objetivo: o mínimo de cliques possível pra registrar quem faltou hoje.
   As datas de aula são calculadas sozinhas (calendário oficial 2026 ∩ dia
   da semana em que a turma tem aula, ver datasDeAula/gradeDe) — ela só
   configura o horário da turma UMA vez; depois disso, abrir "Chamada" já
   cai direto no dia de aula certo, com todo mundo presente por padrão
   (só toca no nome de quem faltou). Esses mesmos dados (calendário +
   horário por turma) servem de base pras automações no SIAP no futuro. */
function renderChamadaBody(tu, als){
  const grade=gradeDe(tu);
  if(!Object.keys(grade).length || window.__configurarHorario) return renderConfigurarHorario(tu);
  const datas=datasDeAula(tu, scope.bim);
  if(!datas.length){
    const r=BIM_RANGES[scope.bim];
    const aindaNaoComecou = r && isoLocal(new Date())<r[0];
    const msg = aindaNaoComecou
      ? 'O '+esc(scope.bim)+' ainda não começou (começa em '+r[0].split('-').reverse().join('/')+') — a chamada aparece aqui assim que a primeira aula acontecer. O horário está configurado certo.'
      : 'Nenhum dia de aula ainda neste bimestre pra essa turma (segundo o horário configurado).';
    return '<div class="acervo-vazio"><p>'+msg+'</p>'+botaoReconfigurarHorario(tu)+'</div>';
  }
  const dataFoco = window.__chamadaData && datas.includes(window.__chamadaData) ? window.__chamadaData : datas[datas.length-1];
  window.__chamadaData = dataFoco;
  const existente = chamadaDoDia(tu.id, dataFoco);
  if(!window.__chamadaPresencas || window.__chamadaPresencasData!==dataFoco){
    window.__chamadaPresencas = existente ? Object.assign({}, existente.presencas) : {};
    window.__chamadaPresencasData = dataFoco;
  }
  const pres=window.__chamadaPresencas;
  const faltas=als.filter(a=>pres[a.id]===false).length;
  const ultimasDatas=datas.slice(-10).reverse();
  const pills=ultimasDatas.map(d=>{
    const [y,m,dd]=d.split('-');
    const tem=chamadaDoDia(tu.id,d);
    return '<button class="btn'+(d===dataFoco?' primary':' ghost')+' sm" style="padding:4px 9px" onclick="selecionarDataChamada(\''+d+'\')" title="'+(tem?'Já tem chamada salva':'Sem chamada ainda')+'">'+dd+'/'+m+(tem?' ✓':'')+'</button>';
  }).join('');
  let h='<div class="chamada-wrap">';
  h+='<div class="chamada-datas"><span style="font-size:12px;color:var(--muted);margin-right:6px">Dia:</span>'+pills+
     '<input type="date" value="'+dataFoco+'" min="'+datas[0]+'" max="'+datas[datas.length-1]+'" onchange="selecionarDataChamada(this.value)" style="margin-left:8px;padding:4px 8px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:12px">'+
     botaoReconfigurarHorario(tu)+
  '</div>';
  h+='<div class="chamada-resumo">'+als.length+' aluno(s) · <span style="color:'+(faltas?'var(--err)':'var(--green)')+'">'+faltas+' falta(s)</span></div>';
  h+='<div class="chamada-lista">'+als.map(a=>{
    const falta=pres[a.id]===false;
    return '<div class="chamada-row'+(falta?' falta':'')+'" onclick="toggleFaltaChamada(\''+a.id+'\')">'+
      '<span class="chamada-nome">'+esc(a.nome)+'</span>'+
      '<span class="chamada-status">'+(falta?'✕ falta':'✓ presente')+'</span>'+
    '</div>';
  }).join('')+'</div>';
  h+='<div class="chamada-salvar"><button class="btn primary" onclick="salvarChamada()">Salvar chamada de '+dataFoco.split('-').reverse().join('/')+'</button></div>';
  h+='</div>';
  return h;
}
function botaoReconfigurarHorario(tu){
  return '<button class="btn ghost sm" style="margin-left:8px" onclick="window.__configurarHorario=true;_refreshChamadaModalOuNotas()" title="Mudar os dias de aula desta turma">⚙ horário</button>';
}
function renderConfigurarHorario(tu){
  window.__configurarHorario=false;
  const grade=gradeDe(tu)||{};
  const dias=[[1,'Segunda'],[2,'Terça'],[3,'Quarta'],[4,'Quinta'],[5,'Sexta']];
  return '<div class="acervo-vazio"><div style="max-width:420px;margin:0 auto;text-align:left">'+
    '<p style="text-align:center">Antes da primeira chamada, configure em quais dias da semana essa turma tem aula (só precisa fazer isso uma vez — depois a Chamada já cai direto no dia certo sozinha).</p>'+
    dias.map(([wd,nome])=>{
      const n=grade[wd]||0;
      return '<label class="check" style="display:flex;align-items:center;gap:8px;margin:6px 0"><input type="checkbox" id="hd'+wd+'" '+(n?'checked':'')+'> '+nome+
        ' <input type="number" id="hn'+wd+'" min="1" max="4" value="'+(n||1)+'" style="width:50px;margin-left:auto;padding:3px 6px" title="Quantas aulas nesse dia"> aula(s)</label>';
    }).join('')+
    '<button class="btn primary full" style="margin-top:12px" onclick="salvarHorarioTurma(\''+tu.id+'\')">Salvar horário</button>'+
  '</div></div>';
}
/* renderChamadaBody() é usado dentro do modal "Todas as chamadas" — suas
   próprias interações (trocar dia, marcar falta, salvar horário) precisam
   re-renderizar o CONTEÚDO DO MODAL, não a tela de baixo. */
function _refreshChamadaModalOuNotas(){
  const modalBody=document.getElementById('todasChamadasBody');
  if(modalBody){
    const tu=turmas[scope.turma]; const als=alunosDaTurma(scope.turma);
    if(tu) modalBody.innerHTML=renderChamadaBody(tu, als);
  } else {
    renderNotas();
  }
}
function salvarHorarioTurma(turmaId){
  const tu=turmas[turmaId]; if(!tu) return;
  const grade={};
  [1,2,3,4,5].forEach(wd=>{
    const chk=document.getElementById('hd'+wd);
    if(chk && chk.checked){ const n=parseInt(document.getElementById('hn'+wd).value,10)||1; grade[wd]=n; }
  });
  if(!Object.keys(grade).length){ toast('Marque pelo menos um dia da semana.','err'); return; }
  tu.grade=grade;
  persistTurma(tu);
  toast('Horário salvo. Agora a Chamada já cai direto no dia certo.','ok');
  window.__chamadaPresencas=null; window.__chamadaData=null;
  _refreshChamadaModalOuNotas();
}
function selecionarDataChamada(d){
  window.__chamadaData=d;
  window.__chamadaPresencas=null;
  _refreshChamadaModalOuNotas();
}
function toggleFaltaChamada(alunoId){
  const pres=window.__chamadaPresencas||(window.__chamadaPresencas={});
  pres[alunoId] = pres[alunoId]===false ? true : false;
  _refreshChamadaModalOuNotas();
}
function salvarChamada(){
  const turmaId=scope.turma, data=window.__chamadaData;
  if(!turmaId||!data) return;
  const existente=chamadaDoDia(turmaId,data);
  const c=existente || {id:uid(), turmaId, data};
  c.presencas=Object.assign({}, window.__chamadaPresencas);
  persistChamada(c);
  const faltas=Object.values(c.presencas).filter(v=>v===false).length;
  toast('Chamada de '+data.split('-').reverse().join('/')+' salva — '+faltas+' falta(s).','ok');
}
/* Coluna de chamada embutida direto na tabela de Notas — marca presença/
   falta de um dia sem precisar sair da tela nem clicar em "salvar" (cada
   toque já grava na hora). window.__chamadaColData guarda o dia escolhido
   pra essa coluna (separado do estado usado no modal "Todas as chamadas"). */
function toggleFaltaChamadaInline(alunoId){
  const turmaId=scope.turma, data=window.__chamadaColData;
  if(!turmaId||!data) return;
  const existente=chamadaDoDia(turmaId,data);
  const c=existente || {id:uid(), turmaId, data, presencas:{}};
  const atual=c.presencas[alunoId];
  c.presencas[alunoId] = atual===false ? true : false;
  persistChamada(c);
  renderNotas();
}
function mudarDataColunaChamada(d){ window.__chamadaColData=d; renderNotas(); }
function abrirTodasChamadas(){
  const tu=turmas[scope.turma]; const als=alunosDaTurma(scope.turma);
  if(!tu) return;
  window.__chamadaData=null; window.__chamadaPresencas=null; // força recalcular do zero
  const html='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:640px">'+
    '<div class="modal-h"><h3>📋 Chamada — '+esc(turmaNome(tu))+'</h3></div>'+
    '<div class="modal-b" id="todasChamadasBody">'+renderChamadaBody(tu, als)+'</div>'+
    '<div class="modal-f"><button class="btn ghost" onclick="closeModal();renderNotas()">Fechar</button></div></div></div>';
  const w=document.createElement('div'); w.id='modalWrap'; w.innerHTML=html; document.body.appendChild(w);
}
function renderNotas(){
  const box=document.getElementById('notasBody'); if(!box) return;
  const turmaId=scope.turma;
  const todasTurmasInit=Object.values(turmas).sort((a,b)=>turmaNome(a).localeCompare(turmaNome(b)));
  if(!turmaId||!todasTurmasInit.length){
    box.innerHTML='<div class="notas-toolbar"><h3>📊 Notas</h3></div>'+
      '<div class="acervo-vazio"><p>'+(!todasTurmasInit.length?'Nenhuma turma cadastrada. Crie turmas na Gestão.':'Selecione uma turma acima para começar.')+'</p></div>';
    if(todasTurmasInit.length){
      const sel='<div class="notas-toolbar" style="margin-top:0"><select onchange="trocarTurmaNotas(this.value)" style="padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)"><option value="">— Selecionar turma —</option>'+turmaOptionsHtml('')+'</select></div>';
      box.innerHTML=sel+box.innerHTML;
    }
    return;
  }
  const tu=turmas[turmaId]||{};
  const als=alunosDaTurma(turmaId);
  const atvs=atividadesDaTurma(turmaId);

  // Stats
  const medias=als.map(a=>mediaAluno(a.id,atvs,turmaId)).filter(m=>m!=null);
  const mediaGeral=medias.length?(medias.reduce((s,m)=>s+m,0)/medias.length).toFixed(1):'-';
  const aprovados=medias.filter(m=>m>=6).length;
  const reprovados=medias.filter(m=>m<6).length;

  const trocaTurmaSel='<select onchange="trocarTurmaNotas(this.value)" title="Trocar de turma sem sair de Notas" style="font-weight:700;font-size:15px;padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);min-width:220px;max-width:300px;flex:0 0 auto">'+
    turmaOptionsHtml(turmaId)+
  '</select>';
  let h='<div class="notas-toolbar">'+
    '<span style="font-size:18px">📊</span>'+trocaTurmaSel+
    '<button class="btn ghost sm" onclick="abrirAddAluno()">+ Aluno</button>'+
    '<button class="btn ghost sm" onclick="abrirAddAtividade()">+ Atividade</button>'+
    '<button class="btn ghost sm" onclick="abrirTodasChamadas()" title="Ver e editar a chamada de qualquer dia do bimestre">📋 Todas as chamadas</button>'+
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">Média: </span>'+
    '<select onchange="setMediaModo(scope.turma,this.value)" style="padding:4px 8px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:12px">'+
      '<option value="ponderada"'+(getMediaModo(turmaId)==='ponderada'?' selected':'')+'>ponderada (usa pesos)</option>'+
      '<option value="aritmetica"'+(getMediaModo(turmaId)==='aritmetica'?' selected':'')+'>aritmética (todos iguais)</option>'+
    '</select>'+
    '<button class="btn ghost sm" onclick="abrirExportarCSV()">↓ CSV</button>'+
    '<button class="btn sm" style="border-color:var(--ochre);color:var(--ochre)" onclick="abrirRanking()">🏆 Ranking</button>'+
    '<button class="btn ghost sm" onclick="_painelOrigin=\'notas\';_painelBim=scope.bim;setView(\'painel\')" title="Painel de progresso de todas as turmas">📈 Painel geral</button>'+
    '<button class="btn ghost sm" onclick="_agendaOrigin=\'notas\';setView(\'agenda\')" title="Agenda — aulas, cronograma e compromissos por dia">📅 Agenda</button>'+
  '</div>';

  // Stats boxes
  h+='<div class="notas-stats">'+
    '<div class="stat-box"><strong>'+als.length+'</strong><span>alunos</span></div>'+
    '<div class="stat-box"><strong>'+atvs.length+'</strong><span>atividades</span></div>'+
    '<div class="stat-box"><strong>'+mediaGeral+'</strong><span>média geral</span></div>'+
    '<div class="stat-box"><strong style="color:var(--green)">'+aprovados+'</strong><span>aprovados ≥6</span></div>'+
    '<div class="stat-box"><strong style="color:var(--err)">'+reprovados+'</strong><span>abaixo de 6</span></div>'+
  '</div>';

  // Faixa indicadora (c): objetos de aula aplicados nesta turma/bimestre
  h+=renderFaixaAplicados(turmaId);

  if(!als.length){ h+='<div class="acervo-vazio"><p>Nenhum aluno cadastrado. Clique em "+ Aluno" ou "+ Lista".</p></div>'; box.innerHTML=h; return; }

  // Coluna de chamada — dia mais recente de aula por padrão (calendário ∩
  // horário da turma), com um seletor compacto pra trocar de dia.
  const gradeTurma=gradeDe(tu);
  const datasChamada = Object.keys(gradeTurma).length ? datasDeAula(tu, scope.bim) : [];
  const temHorarioChamada = datasChamada.length>0;
  if(temHorarioChamada){
    const colData = (window.__chamadaColData && datasChamada.includes(window.__chamadaColData)) ? window.__chamadaColData : datasChamada[datasChamada.length-1];
    window.__chamadaColData = colData;
  }
  const chamadaHoje = temHorarioChamada ? chamadaDoDia(turmaId, window.__chamadaColData) : null;

  // Tabela — table-layout:fixed com só as colunas "fixas" (aluno/chamada/
  // média/remover) com largura definida; as colunas de atividade ficam sem
  // largura própria, então o navegador já divide o espaço que sobra entre
  // elas igualmente sozinho — cresce a lista, cada uma encolhe na hora,
  // sem eu precisar recalcular nada. Só o nome do aluno encolhe (mostra só
  // o último sobrenome) quando tem muita atividade e o espaço aperta.
  const nAtv=atvs.length;
  const alunoColPct = nAtv<=3?22 : nAtv<=6?17 : nAtv<=10?13 : 10;
  const nomesCurtos = nAtv>6;
  const tabelaMinWidth = Math.max(640, 330+nAtv*66);
  h+='<div class="notas-table-wrap"><table class="notas-table" style="min-width:'+tabelaMinWidth+'px"><thead><tr>'+
    '<th class="aluno-col" style="width:'+alunoColPct+'%">Aluno</th>'+
    (temHorarioChamada
      ? '<th style="width:90px"><select onchange="mudarDataColunaChamada(this.value)" style="font-size:11px;font-weight:600;border:0;background:transparent;color:inherit;width:100%">'+
          datasChamada.slice(-12).reverse().map(d=>'<option value="'+d+'"'+(d===window.__chamadaColData?' selected':'')+'>'+d.split('-').reverse().join('/')+'</option>').join('')+
        '</select></th>'
      : '<th style="width:90px"><button class="btn ghost sm" style="font-size:10px;padding:2px 6px" onclick="window.__configurarHorario=true;abrirTodasChamadas()" title="Configurar dias de aula pra habilitar a chamada aqui">📋 configurar</button></th>')+
    atvs.map(av=>{
      const tp=ATIV_TIPOS[av.tipo]||{label:av.tipo,cor:'#888',bg:'#f5f5f5'};
      const isCheck=av.checklist===true; // respeita só o que foi salvo explicitamente
      const ehCasa=av.tipo==='casa'||av.casa===true;
      const ehExtra=av.tipo==='extra'||av.extra===true;
      return '<th style="background:'+tp.bg+';border-bottom:3px solid '+tp.cor+'" title="'+esc(av.nome)+' — '+esc(tp.label||av.tipo)+(isCheck?' (checklist)':' (nota)')+(ehCasa?' · também dever de casa':'')+(ehExtra?' · extra/bônus, soma décimos e não entra na média':'')+'" data-avid="'+av.id+'">'+
        (ehCasa?'<span title="Também atribuída como dever de casa">🏠</span> ':'')+
        (ehExtra?'<span title="Extra/bônus — soma décimos na média final, não entra no cálculo">⭐</span> ':'')+
        '<span class="atv-col-header" onclick="event.stopPropagation();editarNomeAtividade(\''+av.id+'\')" title="Toque pra renomear" style="cursor:text">'+esc(av.nome)+'</span>'+
        (av.recorrente?'<button class="atv-dup-btn" onclick="event.stopPropagation();abrirDuplicarAtividade(\''+av.id+'\')" title="Duplicar pra outra turma/data, sem redigitar">⧉</button>':'')+
        '<button class="atv-del-btn" onclick="event.stopPropagation();removerAtividade(\''+av.id+'\')" title="Remover esta atividade (e as notas lançadas)">✕</button>'+
        '<span class="atv-tipo">peso '+av.peso+(isCheck?' &middot; &check;':'')+'</span>'+
      '</th>';
    }).join('')+
    '<th style="width:56px">Média</th>'+
    '<th style="width:56px;color:var(--muted);font-weight:400" title="Nota qualitativa (comportamento) — começa em 10, não entra na média das atividades. Aparece só pra você, discretamente.">qualit.</th>'+
    '<th style="width:36px"></th>'+
  '</tr></thead><tbody>';

  als.forEach(al=>{
    const med=mediaAluno(al.id,atvs,turmaId);
    const medStr=med!=null?med.toFixed(1):'-';
    const medCls=med==null?'':(med>=6?'aprovado':'reprovado');
    h+='<tr><td class="aluno-nome" style="cursor:pointer" onclick="abrirBoletimAluno(\''+al.id+'\')" title="'+esc(al.nome)+' — clique para ver o boletim (turmas, notas, editar dados)">'+
      (al.numero?'<span style="color:var(--muted);font-size:11px;margin-right:4px">'+al.numero+'</span>':'')+
      esc(nomesCurtos ? nomeSobrenome(al.nome) : al.nome)+
    '</td>'+
    (temHorarioChamada
      ? (()=>{ const falta=chamadaHoje && chamadaHoje.presencas[al.id]===false;
          return '<td style="text-align:center;cursor:pointer;background:'+(falta?'rgba(200,60,60,.1)':'rgba(60,150,90,.08)')+'" onclick="toggleFaltaChamadaInline(\''+al.id+'\')" title="Clique pra marcar '+(falta?'presença':'falta')+' em '+window.__chamadaColData.split('-').reverse().join('/')+'">'+
            (falta?'<span style="color:var(--err)">✕ falta</span>':'<span style="color:var(--green)">✓</span>')+
          '</td>'; })()
      : '<td></td>')+
    atvs.map(av=>{
      const tp=ATIV_TIPOS[av.tipo]||{bg:'#fff',checklist:false};
      const isCheck=av.checklist===true; // respeita só o que foi salvo explicitamente
      const n=notaDoAluno(al.id,av.id);
      if(isCheck){
        const checked=n&&n.valor===1;
        return '<td style="text-align:center;background:'+tp.bg+'20">'+
          '<input class="nota-check" type="checkbox" '+(checked?'checked':'')+' '+
          'data-al="'+al.id+'" data-av="'+av.id+'" data-tu="'+turmaId+'" '+
          'onchange="salvarNotaCheck(this)"></td>';
      }
      const val=n&&n.valor!=null?n.valor:'';
      const cls=val===''?'':(val>=7?'alta':val<5?'baixa':'');
      return '<td style="background:'+tp.bg+'20"><input class="nota-input '+cls+'" type="number" min="0" max="10" step="0.5" value="'+esc(String(val))+'" '+
        'data-al="'+al.id+'" data-av="'+av.id+'" data-tu="'+turmaId+'" '+
        'onchange="salvarNota(this)" onblur="salvarNota(this)"></td>';
    }).join('')+
    '<td><span class="nota-media '+medCls+'">'+medStr+'</span></td>'+
    (()=>{ const nq=notaQualitativa(al.id,turmaId);
      return '<td style="text-align:center;cursor:pointer;color:var(--muted);font-size:12px;opacity:.75" onclick="abrirQualitativaAluno(\''+al.id+'\')" title="Nota qualitativa — clique pra ver histórico e lançar desconto">'+nq.toFixed(1)+'</td>'; })()+
    '<td><button class="btn ghost sm danger" data-aid="'+al.id+'" onclick="removerAluno(this.dataset.aid)" title="Remover aluno">✕</button></td>'+
    '</tr>';
  });

  // Linha de médias por atividade
  h+='<tr style="background:var(--surface);font-weight:600">'+
    '<td class="aluno-nome">Média turma</td>'+
    '<td></td>'+
    atvs.map(av=>{ const m=mediaAtividade(av.id,turmaId); return '<td style="text-align:center">'+(m!=null?m.toFixed(1):'-')+'</td>'; }).join('')+
    '<td></td><td></td><td></td></tr>';

  h+='</tbody></table></div>';
  box.innerHTML=h;
}

function salvarNota(input){
  const alunoId=input.dataset.al, atividadeId=input.dataset.av, turmaId=input.dataset.tu;
  const val=input.value.trim();
  // Encontrar ou criar nota
  let n=notaDoAluno(alunoId,atividadeId);
  if(!n) n={id:uid(),alunoId,atividadeId,turmaId};
  n.valor=val===''?null:Math.min(10,Math.max(0,parseFloat(val)||0));
  persistNota(n);
  // Atualizar cor
  input.className='nota-input '+(n.valor==null?'':(n.valor>=7?'alta':n.valor<5?'baixa':''));
  // Recalcular médias sem re-render completo
  const al=alunos[alunoId], atvs=atividadesDaTurma(turmaId);
  const med=mediaAluno(alunoId,atvs,turmaId);
  const row=input.closest('tr');
  if(row){ const medCell=row.querySelector('.nota-media'); if(medCell){ medCell.textContent=med!=null?med.toFixed(1):'-'; medCell.className='nota-media '+(med==null?'':(med>=6?'aprovado':'reprovado')); } }
}

// ── Modais ────────────────────────────────────────────────────────────────
function abrirAddAluno(){
  const h='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:380px">'+
    '<div class="modal-h"><h3>+ Aluno</h3></div>'+
    '<div class="modal-b">'+
      '<div class="field"><label>Nome completo</label><input id="alunoNome" autofocus placeholder="Nome do aluno"></div>'+
      '<div class="field"><label>Número (opcional)</label><input id="alunoNum" type="number" placeholder="ex.: 1"></div>'+
      '<button class="btn ghost sm" onclick="abrirAddAlunoLista()" title="Colar a lista inteira da turma de uma vez">+ colar lista inteira da turma</button>'+
    '</div>'+
    '<div class="modal-f"><button class="btn ghost" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn primary" onclick="salvarAluno()">Adicionar</button></div></div></div>';
  const w=document.createElement('div'); w.id='modalWrap'; w.innerHTML=h; document.body.appendChild(w);
  setTimeout(()=>document.getElementById('alunoNome')?.focus(),50);
}

function salvarAluno(){
  const nome=(document.getElementById('alunoNome')?.value||'').trim();
  const num=parseInt(document.getElementById('alunoNum')?.value)||null;
  if(!nome){ toast('Digite o nome do aluno.','err'); return; }
  const a={id:uid(),nome,numero:num,turmaId:scope.turma,ativo:true};
  persistAluno(a);
  closeModal();
  renderNotas();
  toast(nome+' adicionado.','ok');
}

function abrirAddAlunoLista(){
  const h='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:500px">'+
    '<div class="modal-h"><h3>+ Lista de alunos</h3></div>'+
    '<div class="modal-b">'+
      '<p style="font-size:13px;color:var(--muted);margin-bottom:10px">Um nome por linha. Numeração no início é removida automaticamente.</p>'+
      '<textarea id="alunoLista" style="height:180px" placeholder="1. Maria Silva&#10;2. João Oliveira&#10;Ana Paula"></textarea>'+
      '<div id="alunoPreview" style="font-size:12px;color:var(--muted);margin-top:6px"></div>'+
    '</div>'+

function salvarAtividade(){
  const nome=(document.getElementById('atvNome')?.value||'').trim();
  const tipo=document.getElementById('atvTipo')?.value||'atividade';
  const data=document.getElementById('atvData')?.value||isoLocal(new Date());
  const peso=parseFloat(document.getElementById('atvPeso')?.value)||1;
  const max=parseFloat(document.getElementById('atvMax')?.value)||10;
  const turmaIds=[...document.querySelectorAll('#atvTurmasWrap input[type=checkbox]:checked')].map(c=>c.value);
  if(!nome){ toast('Digite o nome da atividade.','err'); return; }
  if(!turmaIds.length){ toast('Selecione pelo menos uma turma.','err'); return; }
  const modoEl=document.querySelector('input[name=atvModo]:checked'); const checklist=modoEl?.value==='check';
  const casa=(document.getElementById('atvCasa')||{}).checked||false;
  const extra=(document.getElementById('atvExtra')||{}).checked||false;
  const recorrente=(document.getElementById('atvRecorrente')||{}).checked||false;
  const passoDias=parseInt((document.getElementById('atvPeriodicidade')||{}).value,10)||0;
  const av={id:uid(),nome,tipo,data,peso,valorMax:max,checklist,turmaIds,disciplina:scope.disc,bimestre:scope.bim,recorrente,casa,extra};
  persistAtivCtrl(av);
  let geradas=0;
  if(recorrente&&passoDias){
    const r=BIM_RANGES[scope.bim];
    const fimBim=r?r[1]:data;

    for(;;){
      cur.setDate(cur.getDate()+passoDias);

   turma continua com suas próprias colunas de atividade (elas variam de
   turma pra turma), separadas por um cabeçalho "TURMA: ..." dentro do mesmo

function exportarNotasTodasTurmasCSV(){
  const disc=scope.disc;
  if(!disc){ toast('Selecione uma disciplina.','err'); return; }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let _lsCheioAte=0, _lsAvisou=false;
function lsSet(k,v){
  if(Date.now()<_lsCheioAte) return; // cota estourou recentemente — confia no Firebase por ora
  try{ localStorage.setItem(k,v); }
  catch(e){
    if(e&&(e.name==='QuotaExceededError'||/quota/i.test(e.message))){
      // tenta liberar espaço: remove caches não-essenciais (o Firebase é a fonte da verdade)
      try{
        ['leciona_chat_hist','leciona_img_cache','leciona_undo'].forEach(kk=>localStorage.removeItem(kk));
        localStorage.setItem(k,v); // tenta de novo depois de limpar
        return;
      }catch(e2){}
      _lsCheioAte=Date.now()+300000; // espera 5 min antes de tentar de novo
      if(!_lsAvisou){ // avisa só UMA vez por sessão, pra não incomodar
        _lsAvisou=true;
        toast('Este navegador atingiu o limite de armazenamento local. Seus dados continuam salvos no Firebase normalmente — só a cópia local deste aparelho parou de crescer. Nada foi perdido.','');
      }
    }
  }
}
function mdInline(s){
  let h=esc(s);
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/__([^_\n]+)__/g,'<strong>$1</strong>');
  h=h.replace(/==([^=\n]+)==/g,'<mark class="grifo">$1</mark>');
  h=h.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
  return h;
}
function mdCells(line){ let s=line.trim(); if(s.startsWith('|'))s=s.slice(1); if(s.endsWith('|'))s=s.slice(0,-1); return s.split('|').map(c=>c.trim()); }
function mdIsSep(line){ const t=line.trim(); return /^[\s|:\-]+$/.test(t) && t.indexOf('-')>=0; }
function renderMd(s, mode){
  const HB = mode==='print' ? '<p class="mh">' : '<h2>';
  const HE = mode==='print' ? '</p>' : '</h2>';
  const SB = mode==='print' ? '<p class="msh">' : '<h3 class="proj-sub">';
  const SE = mode==='print' ? '</p>' : '</h3>';
  const lines=String(s||'').split('\n'); let out='',inList=false,i=0,tituloFeito=false;
  const closeL=()=>{ if(inList){out+='</ul>';inList=false;} };
  const ehCaixaAlta=(txt)=>{ const letras=txt.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g,''); return letras.length>=3 && letras===letras.toUpperCase(); };
  while(i<lines.length){
    const t=lines[i].trim();
    if(t.startsWith('|') && i+1<lines.length && mdIsSep(lines[i+1])){
      closeL(); const head=mdCells(lines[i]); i+=2; const rows=[];
      while(i<lines.length && lines[i].trim().startsWith('|')){ rows.push(mdCells(lines[i])); i++; }
      out+='<table class="md"><thead><tr>'+head.map(c=>'<th>'+mdInline(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+head.map((_,ci)=>'<td>'+mdInline(r[ci]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      continue;
    }
    if(/^([-*_])\1{2,}$/.test(t)){ closeL(); out+='<hr style="border:none;border-top:1px solid currentColor;opacity:.3;margin:.8em 0">'; i++; continue; }
    if(t.startsWith('>')){ closeL(); const ql=[]; while(i<lines.length && lines[i].trim().startsWith('>')){ ql.push(lines[i].trim().replace(/^>\s?/,'')); i++; } out+='<blockquote style="border-left:4px solid #c9762f;background:rgba(127,127,127,.12);padding:.3em .8em;margin:.6em 0;border-radius:4px">'+ql.map(q=>mdInline(q)).join('<br>')+'</blockquote>'; continue; }
    if(/^#{1,6}\s/.test(t)){ closeL(); out+=HB+mdInline(t.replace(/^#+\s/,''))+HE; tituloFeito=true; }
    else if(t!=='' && !tituloFeito && !/^[-*•]\s/.test(t) && ehCaixaAlta(t) && t.length<=100){
      // primeira linha, em CAIXA ALTA e curta = título do texto (padrão do
      // Quadro). Parágrafos normais (mesmo na 1ª linha) NÃO viram título.
      // Exclui linhas de lista: uma alternativa como "- B) A CLT" também bate
      // no teste de "caixa alta" (sigla curta) e virava título por engano,
      // quebrando a lista de alternativas no meio.
      closeL(); out+=HB+mdInline(t)+HE; tituloFeito=true;
    }
    else if(/^\d+[.)]\s+\S/.test(t) && ehCaixaAlta(t.replace(/^\d+[.)]\s+/,''))){
      // linha numerada em CAIXA ALTA = subtítulo de seção (padrão do conteúdo gerado)
      closeL(); out+=SB+mdInline(t)+SE;
    }
    else if(/^[-*•]\s/.test(t)){ if(!inList){out+='<ul>';inList=true;} out+='<li>'+mdInline(t.replace(/^[-*•]\s/,''))+'</li>'; }
    else if(t===''){ closeL(); }
    else { closeL(); out+='<p>'+mdInline(t)+'</p>'; }
    i++;
  }
  closeL(); return out;
}
function textToHtml(s){ return renderMd(s,'screen'); }
/* Mapa mental gráfico (blocos hierárquicos) para o PDF */
function buildMapTree(md){
  const lines=String(md||'').split('\n').filter(l=>l.trim());
  const root={text:'',level:-1,children:[]}; const stack=[root];
  lines.forEach(l=>{
    let level,text; const h=l.match(/^(#{1,6})\s+(.*)/);
    if(h){ level=h[1].length-1; text=h[2]; }
    else { const m=l.match(/^(\s*)[-*•]\s+(.*)/);
      if(m){ const ind=m[1].replace(/\t/g,'  ').length; level=2+Math.floor(ind/2); text=m[2]; }
      else { level=2; text=l.replace(/^[-*•]\s*/,''); } }
    const node={text:text.trim(),level,children:[]};
    while(stack.length>1 && stack[stack.length-1].level>=level) stack.pop();
    stack[stack.length-1].children.push(node); stack.push(node);
  });
  return root;
}
function mdMapToHtml(md){
  const root=buildMapTree(md);
  const render=(nodes,d)=> nodes.length? '<ul class="mm-tree">'+nodes.map(c=>'<li><div class="mm-box mm-l'+Math.min(d,4)+'">'+mdInline(c.text)+'</div>'+render(c.children,d+1)+'</li>').join('')+'</ul>' : '';
  let central=null;
  if(root.children.length===1) central=root.children[0];
  if(central) return '<div class="mm"><div class="mm-box mm-root">'+mdInline(central.text)+'</div>'+render(central.children,1)+'</div>';
  return '<div class="mm">'+render(root.children,1)+'</div>';
}
let _mmiId=0;
function mapInterativo(md){
  const root=buildMapTree(md);
  function node(n,depth){
    const has=n.children.length; const nid='mmi'+(_mmiId++);
    return '<div class="mmi-node mmi-d'+Math.min(depth,4)+'">'+
      '<div class="mmi-head'+(has?' has':'')+'"'+(has?(' onclick="mmiToggle(\''+nid+'\')"'):'')+'>'+
        (has?('<span class="mmi-tg" id="tg'+nid+'">▾</span>'):'<span class="mmi-dot">•</span>')+
        '<span>'+mdInline(n.text)+'</span></div>'+
      (has?('<div class="mmi-kids" id="'+nid+'">'+n.children.map(c=>node(c,depth+1)).join('')+'</div>'):'')+
    '</div>';
  }
  _mmiId=0;
  let central=root.children.length===1?root.children[0]:null;
  if(central) return node(central,0);
  return root.children.map(c=>node(c,0)).join('');
}
/* Dashboard: quadros com os tópicos essenciais, em vez da árvore de mapa mental — leitura mais rápida na projeção */
/* Diagrama radial: núcleo central + ramos ligados por linhas — pensado para SÍNTESE/REVISÃO (ver tudo de uma vez e as relações entre os conceitos), ao contrário do slide, que é sequencial (uma ideia de cada vez) */
function mapDashboard(md){
  const root=buildMapTree(md);
  let central=root.children.length===1?root.children[0]:null;
  const ramos=central?central.children:root.children;
  const tituloCentral=central?central.text:(md||'').split('\n')[0]||'Tema';
  if(!ramos.length) return '<div class="dash-empty">Sem tópicos.</div>';
  const folhas=(n)=>{ let out=[]; (n.children||[]).forEach(k=>{ if(!k.children.length) out.push(k.text); else out=out.concat(folhas(k)); }); return out; };
  let html='<div class="mm-radial"><div class="mm-center">'+mdInline(tituloCentral)+'</div><div class="mm-branches">';
  ramos.forEach(r=>{
    const topicos=folhas(r);
    html+='<div class="mm-branch"><div class="mm-branch-h">'+mdInline(r.text)+'</div>'+
      (topicos.length?('<ul class="mm-leaves">'+topicos.map(t=>'<li>'+mdInline(t)+'</li>').join('')+'</ul>'):'')+
    '</div>';
  });
  html+='</div></div>';
  return html;
}
function mmiToggle(id){ const el=document.getElementById(id), tg=document.getElementById('tg'+id); if(!el)return; const hide=el.style.display!=='none'; el.style.display=hide?'none':''; if(tg)tg.textContent=hide?'▸':'▾'; }
let toastT;
/* ---------- Contador de tempo de geração (progride s -> min -> h) ---------- */
function fmtElapsed(ms){
  const totalSec=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  const pad=n=>String(n).padStart(2,'0');
  return h>0 ? (h+':'+pad(m)+':'+pad(s)) : (m+':'+pad(s));
}
/* Aprende a duração média de gerações passadas (por tipo) para estimar quanto falta — contagem regressiva, não progressiva */
function genTimeKey(kind){ return 'leciona_gentime_'+kind; }
function genTimeEstimate(kind){
  try{ const v=parseFloat(localStorage.getItem(genTimeKey(kind))); if(v>0) return v; }catch(e){}
  return kind==='adapt' ? 25000 : kind==='lote' ? 35000 : 40000; // ms — chute inicial até termos histórico
}
function genTimeLearn(kind, ms){
  try{ const prev=parseFloat(localStorage.getItem(genTimeKey(kind)))||ms;
    const novo=Math.round(prev*0.7+ms*0.3); // média móvel — se estabiliza com o uso
    localStorage.setItem(genTimeKey(kind), String(novo));
  }catch(e){}
}
function startGenTimer(getLabel, onTick, kind){
  const t0=Date.now(); const estimate=genTimeEstimate(kind||'single');
  const tick=()=>{
    const decorrido=Date.now()-t0; const falta=estimate-decorrido;
    const txt = falta>1000 ? ('faltam ~'+fmtElapsed(falta)) : 'finalizando…';
    onTick(getLabel()+' · '+txt);
  };
  tick();
  const id=setInterval(tick,1000);
  return {id:id, t0:t0, kind:kind||'single'};
}
function stopGenTimer(h){ if(!h) return; clearInterval(h.id); genTimeLearn(h.kind, Date.now()-h.t0); }
let _ultimoToastMsg='', _ultimoToastTs=0, _toastRepeticoes=0;
function toast(msg,kind){
  const agora=Date.now();
  if(msg===_ultimoToastMsg && agora-_ultimoToastTs<3000){
    _toastRepeticoes++;
    if(_toastRepeticoes>2) return; // já mostrou esse aviso 3x seguidas em 3s — não empilha mais
  } else {
    _toastRepeticoes=0;
  }
  _ultimoToastMsg=msg; _ultimoToastTs=agora;
  const el=document.getElementById('toast');
  const d=document.createElement('div'); d.className='toast '+(kind||''); d.textContent=msg;
  el.appendChild(d); setTimeout(()=>d.remove(),4200);
  // trava de segurança: nunca deixa mais de 5 toasts na tela ao mesmo tempo
  while(el.children.length>5) el.removeChild(el.firstChild);
}

/* O bloqueio anterior via touchmove/preventDefault travava a rolagem do app inteiro (modais, listas) e foi removido.
   A prevenção do pull-to-refresh nativo agora depende só do overscroll-behavior no CSS (mais seguro, não quebra scroll). */

/* =========================================================
   ADAPTAÇÕES INCLUSIVAS (material adaptado para impressão)
   ========================================================= */
const ADAPT_PERFIS=[
  {k:'tea',     label:'TEA (autismo)'},
  {k:'tdah',    label:'TDAH'},
  {k:'di',      label:'Deficiência intelectual'},
  {k:'dislexia',label:'Dislexia'},
  {k:'altas',   label:'Altas habilidades'}
];
const ADAPT_BASES=[
  {k:'atividade', label:'Atividade'},
  {k:'questoes',  label:'Questões'},
  {k:'estudo',label:'Estudo'},
  {k:'mapaMental',label:'Mapa mental'}
];
const ADAPT_GUIA={
  tea:'Linguagem literal e objetiva (sem ironia, metáfora ou duplo sentido). Instruções em passos numerados, curtos e previsíveis. Um comando por vez. Estrutura clara. Mantenha o mesmo objetivo de aprendizagem.',
  tdah:'Tarefas curtas e segmentadas, poucos itens por vez, comando direto no início da frase. Destaque o que fazer. Reduza texto supérfluo. Mantenha o mesmo objetivo de aprendizagem.',
  di:'Linguagem simples e concreta, vocabulário do cotidiano, frases curtas. Quebre em passos pequenos, repita o comando-chave, use exemplos da vivência. Reduza a abstração SEM perder o conceito central. Mantenha o mesmo objetivo de aprendizagem.',
  dislexia:'Frases curtas e diretas, vocabulário simples, evite blocos longos de texto. Prefira listas e palavras-chave. Mantenha o mesmo objetivo de aprendizagem.',
  altas:'Aprofunde: acrescente desafios e questões de ordem cognitiva mais alta (analisar, avaliar, criar), conexões interdisciplinares e uma proposta de extensão/pesquisa. Mantenha o objetivo base e vá além dele.'
};

function adaptSourceText(t,baseK){
  const o=t.obj||{};
  const av=o.avaliacao||{};
  if(baseK==='estudo') return o.estudo||'';
  if(baseK==='mapaMental') return o.mapaMental||'';
  if(baseK==='atividade') return (av.atividade||[]).map((x,i)=>(i+1)+'. '+(x.enunciado||'')).join('\n');
  if(baseK==='questoes') return (av.questoes||[]).map((q,i)=>(i+1)+'. '+(q.enunciado||'')+'\n'+(q.alternativas||[]).map((a,j)=>String.fromCharCode(65+j)+') '+a).join('\n')).join('\n\n');
  return '';
}

/* Mesmo tema (mesmo código DC-GO, mesma disciplina+série) já adaptado em
   turma irmã (outra letra/unidade) — a adaptação é sobre o CONTEÚDO, não
   sobre a turma, então dá pra copiar sem gastar crédito de IA de novo.
   Sem isso, gerar adaptação numa turma nunca aparecia nas outras seções do
   mesmo ano/disciplina, mesmo sendo exatamente o mesmo tema. */
function adaptacoesIrmasDisponiveis(t){
  if(!t || !t.dcgo) return [];
  const tu=turmas[t.turmaId]; if(!tu) return [];
  const code=t.dcgo.trim().toUpperCase();
  const jaTem=new Set(Object.keys(t.adaptado||{}).filter(k=>t.adaptado[k]&&Object.keys(t.adaptado[k]).length>0));
  const out=[];
  Object.values(temas).forEach(x=>{
    if(!x||x.id===t.id||!x.dcgo||x.dcgo.trim().toUpperCase()!==code||!x.adaptado) return;
    const xTu=turmas[x.turmaId]; if(!xTu||xTu.disciplina!==tu.disciplina||xTu.serie!==tu.serie) return;
    Object.keys(x.adaptado).forEach(pk=>{
      const v=x.adaptado[pk]; if(!v||!Object.keys(v).length||jaTem.has(pk)) return;
      if(!out.some(o=>o.perfil===pk)) out.push({perfil:pk, temaId:x.id, turmaNome:turmaNome(xTu)+' '+(xTu.unidade||'')});
    });
  });
  return out;
}
function copiarAdaptadoDeIrma(temaIdOrigem, perfil){
  const origem=temas[temaIdOrigem]; if(!origem||!origem.adaptado||!origem.adaptado[perfil]) return;
  if(!editing.adaptado) editing.adaptado={};
  editing.adaptado[perfil]=JSON.parse(JSON.stringify(origem.adaptado[perfil]));
  collectMeta(); persistTema(editing);
  closeModal(); openAdaptar();
  toast('Adaptação copiada, sem gastar crédito de IA.','ok');
}
/* Checagem em massa: pra cada tema da turma/bimestre atual, quais perfis
   necessários (perfisNecessariosDaTurma) ainda faltam — e se dá pra copiar
   de graça de uma turma irmã ou se precisa gerar de verdade na IA. */
function abrirAdaptacoesTurma(){
  if(!scope.turma){ toast('Selecione uma turma primeiro.','err'); return; }
  const necessarios=perfisNecessariosDaTurma(scope.turma);
  if(!necessarios.length){
    toast('Nenhum aluno desta turma está marcado com perfil de adaptação — marque em Notas, no boletim do aluno (clique no nome).','');
    return;
  }
  const temasT=[];
  conteudosDoScope().forEach(c=>temasDoConteudo(c.id).forEach(t=>temasT.push(t)));
  const itens=[];
  temasT.forEach(t=>{
    const gerados=new Set(Object.keys(t.adaptado||{}).filter(k=>{const v=t.adaptado[k];return v&&Object.keys(v).length>0;}));
    necessarios.forEach(perfK=>{
      if(gerados.has(perfK)) return;
      const irmas=adaptacoesIrmasDisponiveis(t).filter(o=>o.perfil===perfK);
      if(irmas.length) itens.push({tema:t, perfil:perfK, status:'copiavel', origemTemaId:irmas[0].temaId});
      else itens.push({tema:t, perfil:perfK, status:'gerar'});
    });
  });
  if(!itens.length){ toast('Tudo certo — todos os temas desta turma já têm as adaptações necessárias.','ok'); return; }
  const copiaveis=itens.filter(i=>i.status==='copiavel');
  const gerar=itens.filter(i=>i.status==='gerar');
  const linhaHtml=i=>'<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;border-bottom:1px solid var(--line,#e5e7eb)"><span style="flex:1">'+esc(i.tema.tituloExibicao||i.tema.nome)+' — '+esc((ADAPT_PERFIS.find(p=>p.k===i.perfil)||{}).label||i.perfil)+'</span><span style="color:'+(i.status==='copiavel'?'var(--green,#2f6b5e)':'var(--ochre,#c47a3d)')+'">'+(i.status==='copiavel'?'copiar — grátis':'gerar — API')+'</span></div>';
  const html='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>🧩 Adaptações desta turma</h3></div>'+
    '<div class="modal-b"><small>Alunos desta turma precisam de: <b>'+esc(necessarios.map(k=>(ADAPT_PERFIS.find(p=>p.k===k)||{}).label||k).join(', '))+'</b>. Faltam '+itens.length+' adaptação(ões) em '+new Set(itens.map(i=>i.tema.id)).size+' tema(s).</small>'+
    '<div style="max-height:300px;overflow:auto;margin:10px 0">'+itens.map(linhaHtml).join('')+'</div>'+
    '<div id="adaptTurmaProg" class="statusdot"></div>'+
    '</div><div class="modal-f">'+
      '<button class="btn ghost" onclick="closeModal()">Fechar</button>'+
      (copiaveis.length?'<button class="btn" onclick="executarCopiarTodasAdaptacoes()">Copiar '+copiaveis.length+' — grátis</button>':'')+
      (gerar.length?'<button class="btn primary" onclick="executarGerarTodasAdaptacoes()">Gerar '+gerar.length+' via IA</button>':'')+
    '</div></div></div>';
  const w=document.createElement('div'); w.id='modalWrap'; w.innerHTML=html; document.body.appendChild(w);
  window.__adaptTurmaItens=itens;
}
function executarCopiarTodasAdaptacoes(){
  const itens=(window.__adaptTurmaItens||[]).filter(i=>i.status==='copiavel');
  itens.forEach(i=>{
    const origem=temas[i.origemTemaId]; if(!origem||!origem.adaptado||!origem.adaptado[i.perfil]) return;
    if(!i.tema.adaptado) i.tema.adaptado={};
    i.tema.adaptado[i.perfil]=JSON.parse(JSON.stringify(origem.adaptado[i.perfil]));
    persistTema(i.tema);
  });
  closeModal();
  toast(itens.length+' adaptação(ões) copiada(s), sem gastar crédito.','ok');
  renderThemes();
}
async function executarGerarTodasAdaptacoes(){
  const itens=(window.__adaptTurmaItens||[]).filter(i=>i.status==='gerar');
  if(!itens.length) return;
  if(!confirm('Isto vai gerar até '+itens.length+' adaptação(ões) na API, uma de cada vez — pode levar alguns minutos e consome créditos da sua conta. Continuar?')) return;
  const prog=document.getElementById('adaptTurmaProg');
  let ok=0, falha=0;
  for(let i=0;i<itens.length;i++){
    const item=itens[i];
    if(prog) prog.innerHTML='<span class="spin dark"></span> gerando '+(i+1)+'/'+itens.length+'…';
    const basesComConteudo=ADAPT_BASES.map(b=>b.k).filter(bk=>{ const v=adaptSourceText(item.tema,bk); return !!(v&&v.trim()); });
    if(!basesComConteudo.length){ falha++; continue; }
    try{
      const r=await genAdaptOne(item.perfil, basesComConteudo, item.tema);
      if(r){ if(!item.tema.adaptado) item.tema.adaptado={}; item.tema.adaptado[item.perfil]=r; persistTema(item.tema); ok++; }
      else falha++;
    }catch(e){ falha++; }
  }
  closeModal();
  toast(ok+' adaptação(ões) gerada(s)'+(falha?(', '+falha+' falharam'):'')+'.', falha?'err':'ok');
  renderThemes();
}
function openAdaptar(){
  if(!editing){ toast('Abra um tema primeiro.','err'); return; }
  collectMeta();
  saveActiveObj();
  const temConteudo=k=>{ const v=adaptSourceText(editing,k); return !!(v && v.trim()); };
  const _adAlgum=ADAPT_BASES.some(b=>temConteudo(b.k));
  const baseChecks=ADAPT_BASES.map(b=>{
    const has=temConteudo(b.k); const mark=has||!_adAlgum;
    return '<label class="check"><input type="checkbox" value="'+b.k+'" '+(mark?'checked':'')+'> '+b.label+(has?'':' <span style="color:#9a9a9a">(vazio?)</span>')+'</label>';
  }).join('');
  const perfChecks=ADAPT_PERFIS.map(pf=>'<label class="check"><input type="checkbox" name="adPerf" value="'+pf.k+'"> '+pf.label+'</label>').join('');
  const ad=editing.adaptado||{};
  const existentes=Object.keys(ad).filter(k=>ad[k]&&ADAPT_BASES.some(b=>ad[k][b.k]&&String(ad[k][b.k]).trim()));
  const cards=existentes.length? '<div class="field"><label>Adaptações já geradas — imprima para entregar ao aluno</label>'+existentes.map(pk=>{
    const pl=(ADAPT_PERFIS.find(pf=>pf.k===pk)||{}).label||pk;
    return '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line,#e5e7eb)"><b style="flex:1;min-width:120px">'+esc(pl)+'</b>'+
      '<label class="check" style="margin:0;font-size:12px;white-space:nowrap"><input type="checkbox" id="timbre_'+pk+'" checked> timbre SEDUC</label>'+'<button class="btn ghost sm" onclick="imprimirAdaptado(\''+pk+'\', document.getElementById(\'timbre_'+pk+'\').checked)">&#128424; imprimir folha do aluno</button>'+
      '<button class="btn ghost sm" onclick="verAdaptado(\''+pk+'\')">ver</button>'+
      '<button class="btn ghost sm" onclick="removerAdaptado(\''+pk+'\')">excluir</button></div>';
  }).join('')+'</div>' : '';
  const irmas=adaptacoesIrmasDisponiveis(editing);
  const copiaHtml=irmas.length? '<div class="field" style="background:rgba(47,107,94,.08);border-radius:8px;padding:8px 10px"><label>Já adaptado noutra turma — copiar sem gastar crédito</label>'+
    irmas.map(o=>{
      const pl=(ADAPT_PERFIS.find(pf=>pf.k===o.perfil)||{}).label||o.perfil;
      return '<div style="display:flex;align-items:center;gap:8px;padding:3px 0"><span style="flex:1;font-size:12.5px">'+esc(pl)+' <span style="color:var(--muted,#8a8f98)">— de '+esc(o.turmaNome)+'</span></span>'+
        '<button class="btn ghost sm" onclick="copiarAdaptadoDeIrma(\''+o.temaId+'\',\''+o.perfil+'\')">copiar</button></div>';
    }).join('')+'</div>' : '';
  const html='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>Material adaptado (inclusão)</h3></div>'+
    '<div class="modal-b"><small>Gera uma versão acessível do conteúdo deste tema, <b>mantendo o objetivo e a habilidade da matriz</b> — muda só o acesso. Cada perfil sai numa folha própria (neutra, sem rótulo do perfil) para imprimir e entregar ao aluno.</small>'+
    copiaHtml+
    '<div class="field" style="margin-top:10px"><label>Perfis</label><div class="gt-checks">'+perfChecks+'</div></div>'+
    '<div class="field"><label>Adaptar a partir de</label><div class="gt-checks" id="adBases">'+baseChecks+'</div></div>'+
    cards+
    '<div id="adProg" class="statusdot"></div></div>'+
    '<div class="modal-f"><button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn primary" id="adBtn" onclick="gerarAdaptado()">Gerar adaptações</button></div></div></div>';
  const w=document.createElement('div'); w.id='modalWrap'; w.innerHTML=html; document.body.appendChild(w);
}

async function gerarAdaptado(){
  const perfis=[...document.querySelectorAll('input[name=adPerf]:checked')].map(c=>c.value);
  const bases=[...document.querySelectorAll('#adBases input[type=checkbox]:checked')].map(c=>c.value);
  if(!perfis.length){ toast('Marque ao menos um perfil.','err'); return; }
  if(!bases.length){ toast('Marque ao menos uma base com conteúdo.','err'); return; }
  // Checa ANTES de gastar créditos: base marcada mas sem texto nenhum nesse
  // tema falha silenciosamente lá na frente — melhor avisar já aqui, com
  // clareza do motivo, em vez de um "1 falhou" genérico depois.
  const basesComConteudo=bases.filter(bk=>{ const v=adaptSourceText(editing,bk); return !!(v&&v.trim()); });
  if(!basesComConteudo.length){ toast('Nenhuma das bases marcadas tem conteúdo neste tema ainda — gere/preencha Quadro, Estudo, Atividade ou Questões primeiro.','err'); return; }
  if(basesComConteudo.length<bases.length){
    const vazias=bases.filter(bk=>!basesComConteudo.includes(bk)).map(bk=>(ADAPT_BASES.find(b=>b.k===bk)||{}).label||bk);
    toast('Aviso: "'+vazias.join('", "')+'" está vazia neste tema e vai ser pulada.','');
  }
  if(!confirm('Isto fará até '+(perfis.length*basesComConteudo.length)+' geração(ões) na API (uma por base × perfil, mais robusto contra falhas; consome créditos da sua conta). Continuar?')) return;
  const btn=document.getElementById('adBtn'); if(btn)btn.disabled=true;
  const prog=document.getElementById('adProg');
  if(!editing.adaptado) editing.adaptado={};
  let ok=0, falha=0, err='';
  for(let i=0;i<perfis.length;i++){
    const pk=perfis[i]; const pl=(ADAPT_PERFIS.find(pf=>pf.k===pk)||{}).label||pk;
    const __label='adaptando para '+esc(pl)+'… ('+(i+1)+'/'+perfis.length+')';
    const __timerId=prog?startGenTimer(()=>__label,t=>{ prog.innerHTML='<span class="spin dark"></span> '+t; },'adapt'):null;
    try{
      const r=await genAdaptOne(pk,bases);
      if(r){ editing.adaptado[pk]=r; ok++; collectMeta(); persistTema(editing); dirty=false; }
      else falha++;
    }catch(e){ falha++; err=e.message; }
    finally{ stopGenTimer(__timerId); }
  }
  if(btn)btn.disabled=false;
  closeModal(); openAdaptar();
  toast(ok+' adaptação(ões) gerada(s)'+(falha?(', '+falha+' falhou ('+(err||'').slice(0,80)+')'):'')+'.', falha?'err':'ok');
}

async function genAdaptOne(perfK,bases,temaObj){
  const pl=(ADAPT_PERFIS.find(pf=>pf.k===perfK)||{}).label||perfK;
  const t=temaObj||editing;
  const bimNum=(t.bimestre||'').charAt(0);
  const out={}; let any=false;
  if(typeof ensurePrebuiltDiscLoaded!=='undefined') await ensurePrebuiltDiscLoaded(t.disciplina);
  // Pré-pronto: se já existe adaptação gerada pra esse tema+perfil (mesmo nome exato,
  // vindo de outra turma), reaproveita em vez de chamar a IA de novo — mesma lógica
  // do PREBUILT_OBJ pro conteúdo base, mas pra adaptação.
  const pronto = (typeof PREBUILT_ADAPT!=='undefined' && t.nome && PREBUILT_ADAPT[t.nome] && PREBUILT_ADAPT[t.nome][perfK]) || null;
  const basesFaltando=[];
  bases.forEach(bk=>{
    if(pronto && pronto[bk]){ out[bk]=pronto[bk]; any=true; }
    else basesFaltando.push(bk);
  });
  if(!basesFaltando.length) return any?out:null;
  const sys='Você é professora especialista em educação inclusiva de '+t.disciplina+' ('+t.serie+'), rede estadual de Goiás, com lente decolonial e pan-africanista — a MESMA perspectiva já usada na produção do material original que você vai adaptar agora. '+
    'REGRA INEGOCIÁVEL Nº1: mantenha o mesmo objetivo de aprendizagem, o conteúdo essencial da matriz (DC-GO/BNCC) E a mesma perspectiva crítica/decolonial do texto original — adapte só a FORMA de acesso (linguagem, estrutura), nunca a substância, o rigor historiográfico ou o ponto de vista já trabalhado. Não abrande, não neutralize e não generalize a abordagem crítica do original. '+
    'REGRA INEGOCIÁVEL Nº2: não invente referências bibliográficas novas — se o original citar autores/obras, preserve exatamente como estão; se não citar nenhuma, não adicione nenhuma. '+
    'REGRA INEGOCIÁVEL Nº3: se para cumprir a adaptação (ex.: montar uma linha do tempo, dar contexto, aprofundar) você precisar introduzir algum evento, data ou fato que NÃO estava no texto original, esse conteúdo novo também precisa receber a mesma leitura crítica/decolonial do resto do texto — nunca apareça como rótulo neutro de manual didático (ex.: numa tabela, não deixe uma linha "seca" sem glosa enquanto as outras têm interpretação). Se não for possível dar essa leitura crítica ao fato novo com segurança, prefira omiti-lo a inseri-lo sem contexto. '+
    'Orientação de acessibilidade para este perfil: '+(ADAPT_GUIA[perfK]||'')+' Responda APENAS o material adaptado em markdown (## para títulos; listas com "- "; para questões, cada alternativa numa linha de lista própria, ex.: "- A) texto da alternativa"), sem nenhum texto fora do conteúdo (sem JSON, sem preâmbulo).';
  // Uma chamada por base: evita que uma falha de parse de JSON combinado derrube todas as adaptações de uma vez
  for(let i=0;i<basesFaltando.length;i++){
    const bk=basesFaltando[i];
    const label=(ADAPT_BASES.find(b=>b.k===bk)||{}).label||bk;
    const txt=adaptSourceText(t,bk);
    if(!txt || !txt.trim()) continue;
    const usr='Tema: '+t.nome+(t.dcgo?('\nCódigo: '+t.dcgo):'')+(t.habilidade?('\nHabilidade: '+t.habilidade):'')+'\nContexto: Matrizes Essenciais SEDUC-GO / DC-GO, '+bimNum+'º bimestre.\n'+
      'Adapte o material ORIGINAL de "'+label+'" abaixo para o perfil "'+pl+'". Mantenha o objetivo; adeque linguagem e estrutura ao perfil.'+
      '\n\n### '+label+' (original)\n'+txt;
    try{
      // maxTokens maior que o padrão (2500): "estudo" adaptado costuma incluir
      // o texto inteiro reescrito + resumo, e vinha sendo cortado no meio às
      // vezes (achado real em produção: 2 adaptações truncadas mid-sentence).
      const raw=await callClaude(sys,usr,3500);
      const clean=(raw||'').replace(/```markdown|```/g,'').trim();
      if(clean){ out[bk]=clean; any=true; }
    }catch(e){ /* segue tentando as outras bases mesmo se uma falhar */ }
  }
  return any?out:null;
}

function _adaptBody(ad){
  let body='';
  ADAPT_BASES.forEach(b=>{ const v=ad[b.k]; if(v){ body+='<h4>'+esc(b.label)+'</h4>'+(b.k==='mapaMental'?mdMapToHtml(v):renderMd(v,'print')); } });
  return body;
}

function verAdaptado(perfK){
  const ad=(editing.adaptado||{})[perfK]; if(!ad){ toast('Sem adaptação gerada.','err'); return; }
  const pl=(ADAPT_PERFIS.find(pf=>pf.k===perfK)||{}).label||perfK;
  const body=_adaptBody(ad);
  const html='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>Adaptação \u2014 '+esc(pl)+'</h3></div>'+
    '<div class="modal-b">'+(body||'<p>Sem conteúdo.</p>')+'</div>'+
    '<div class="modal-f"><label class="check" style="margin:0 8px 0 0"><input type="checkbox" id="timbreAdaptChk" checked> timbre SEDUC</label><button class="btn ghost" onclick="openAdaptar()">Voltar</button><button class="btn primary" onclick="imprimirAdaptado(\''+perfK+'\', document.getElementById(\'timbreAdaptChk\').checked)">&#128424; imprimir folha do aluno</button></div></div></div>';
  closeModal(); const w=document.createElement('div'); w.id='modalWrap'; w.innerHTML=html; document.body.appendChild(w);
}

function removerAdaptado(perfK){
  if(!confirm('Excluir a adaptação deste perfil?')) return;
  if(editing.adaptado) delete editing.adaptado[perfK];
  collectMeta(); persistTema(editing); dirty=false; closeModal(); openAdaptar();
}

function imprimirAdaptado(perfK, comTimbre){
  const ad=(editing.adaptado||{})[perfK]; if(!ad){ toast('Sem adaptação gerada.','err'); return; }
  const tu=turmas[editing.turmaId]||{};
  let body='<div class="tema">';
  ADAPT_BASES.forEach(b=>{ const v=ad[b.k]; if(!v) return;
    body+='<h4>'+esc(b.label)+'</h4>'+(b.k==='mapaMental'?mdMapToHtml(v):renderMd(v,'print'));
    if(b.k==='atividade'||b.k==='questoes'){ body+='<div class="resp"><p class="rl">Respostas:</p>'+Array(7).join('<div class="ln"></div>')+'</div>'; }
  });
  body+='</div>';
  const titulo=editing.nome||'Atividade';
  const win=window.open('','_blank');
  if(!win){ toast('Libere pop-ups para imprimir.','err'); return; }
  win.document.write(adaptShell(titulo, body, tu, editing.disciplina, editing.bimestre, comTimbre));
  win.document.close();
