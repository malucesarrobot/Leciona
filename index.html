const WD_NOMES = {1:'Segunda',2:'Terça',3:'Quarta',4:'Quinta',5:'Sexta'};
// grades conhecidas do horário do CEPI Marajó (getDay: 2=Ter,3=Qua)
const KNOWN_GRADES = { 'História|9º ano|A|CEPI Marajó':{2:1,3:2}, 'História|9º ano|C|CEPI Marajó':{2:2,3:1} };
function bimAtivoAgora(dataISO){ const iso=dataISO||isoLocal(new Date()); for(const b in BIM_RANGES){ const r=BIM_RANGES[b]; if(iso>=r[0]&&iso<=r[1]) return b; } return null; }
function turmaKey(t){ return [t.disciplina,t.serie,t.letra||'',t.unidade||''].join('|'); }
/* SCHEDULE (o horário real, editado direto no arquivo) manda sempre que
   cobrir a turma+disciplina — assim atualizar o horário lá já vale pra
   Chamada na hora, sem precisar reconfigurar turma por turma. O grade
   salvo manualmente (t.grade) só é usado pra turmas fora do SCHEDULE
   (Estudo Orientado, Eletiva etc.). */
function gradeDe(t){ return gradeDeSchedule(t) || (t&&t.grade) || KNOWN_GRADES[turmaKey(t)] || {}; }
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function contarAulas(t, bim){
  const r=BIM_RANGES[bim]; const grade=gradeDe(t); if(!r) return {total:0,semanas:0};
  const [iy,im,id]=r[0].split('-').map(Number), [fy,fm,fd]=r[1].split('-').map(Number);
  let cur=new Date(iy,im-1,id); const end=new Date(fy,fm-1,fd);
  let total=0;
  while(cur<=end){ const wd=cur.getDay(); if(grade[wd] && !FERIADOS_2026.has(isoLocal(cur))) total+=grade[wd]; cur.setDate(cur.getDate()+1); }
  return {total};
}
/* Lista as datas reais de aula de uma turma num bimestre (calendário oficial
   ∩ dia da semana em que a turma tem aula, menos feriados) — base pra
   Chamada saber quais dias oferecer sem ela ter que digitar nada, e também
   pra futuras automações no SIAP (mesmos dados, mesma fonte). */
/* Todas as datas de aula da turma no bimestre (calendário oficial ∩ dia
   da semana da turma, menos feriados) — passado, hoje E futuro. Base pra
   datasDeAula() (só passado) e pra Linha do tempo (passado+futuro). */
function datasDoBimestre(t, bim){
  const r=BIM_RANGES[bim]; const grade=gradeDe(t); if(!r || !Object.keys(grade).length) return [];
  const [iy,im,id]=r[0].split('-').map(Number), [fy,fm,fd]=r[1].split('-').map(Number);
  let cur=new Date(iy,im-1,id); const end=new Date(fy,fm-1,fd);
  const datas=[];
  while(cur<=end){
    const wd=cur.getDay(), iso=isoLocal(cur);
    if(grade[wd] && !FERIADOS_2026.has(iso)) datas.push(iso);
    cur.setDate(cur.getDate()+1);
  }
  return datas;
}
function datasDeAula(t, bim){
  const hoje=isoLocal(new Date());
  return datasDoBimestre(t, bim).filter(iso=>iso<=hoje);
}
/* true se hoje é dia de aula desta turma segundo o horário configurado. */
function hojeTemAula(t){
  const grade=gradeDe(t); const wd=new Date().getDay();
  return !!(grade[wd] && !FERIADOS_2026.has(isoLocal(new Date())));
}
/* Aulas já dadas (fonte de verdade: chamadas lançadas), não previsão de
   calendário — usada no contador "Aula X/Y" junto de contarAulas() (Y). */
function aulasDadas(t, bim){
  const r=BIM_RANGES[bim]; if(!t || !r) return 0;
  const grade=gradeDe(t);
  const hoje=isoLocal(new Date());
  const fim = r[1]<hoje ? r[1] : hoje;
  let total=0;
  const datasContadas=new Set();
  const somaData=(data)=>{
    if(datasContadas.has(data)) return; // não conta o mesmo dia 2x se tiver chamada E aula avulsa nele
    datasContadas.add(data);
    const wd=new Date(data+'T00:00:00').getDay();
    total+=grade[wd]||1;
  };
  Object.values(chamadas).filter(c=>c&&c.turmaId===t.id&&c.data>=r[0]&&c.data<=fim).forEach(c=>somaData(c.data));
  // aula avulsa executada (explicação, atividade, correção, recomposição) conta como aula dada também
  Object.values(aulasAvulsas).filter(a=>a&&a.turmaId===t.id&&a.status==='executada'&&a.data>=r[0]&&a.data<=fim).forEach(a=>somaData(a.data));
  return total;
}

/* ── Planejamento automático ─────────────────────────────────────────────
   Substitui o cronograma manual (1 data de cada vez): monta a sequência
   de aulas restantes do bimestre pra uma turma, priorizando os códigos da
   matriz em ordem cronológica, reservando revisão+recomposição no fim —
   mesma lógica usada no documento de planejamento que já foi entregue,
   agora rodando dentro do próprio app e gravando de verdade em
   conteudo.planejamento[]. Só usa temas que JÁ EXISTEM (não inventa tema
   novo) — junto com o subtema (SUBTEMAS/SUBTEMAS_EXTRA) quando houver, pra
   cada aula ter um recorte específico, não só "o tema inteiro de novo". */
/* Um código de matriz pode ser compartilhado por mais de uma disciplina
   (ex.: GO-EMCHS605B aparece em Filosofia, História e Sociologia, cada
   uma com um tema real diferente — cada disciplina trata o mesmo código
   segundo seu próprio paradigma). Por isso a busca tenta primeiro a chave
   "código|disciplina"; só cai pra chave genérica (código sozinho) se não
   houver recorte específico daquela disciplina ainda. */
function subsDoCodigoPlano(code, disciplina){
  if(disciplina){
    const chaveDisc=code+'|'+disciplina;
    if(typeof SUBTEMAS!=='undefined'&&SUBTEMAS[chaveDisc]) return SUBTEMAS[chaveDisc];
    if(SUBTEMAS_EXTRA[chaveDisc]) return SUBTEMAS_EXTRA[chaveDisc];
  }
  return (typeof SUBTEMAS!=='undefined'&&SUBTEMAS[code]) || SUBTEMAS_EXTRA[code] || null;
}
function riquezaCodigoPlano(code, serieNove, disciplina){
  const subs=subsDoCodigoPlano(code, disciplina);
  if(subs&&subs.length) return subs.reduce((s,x)=>s+(x.a||1),0);
  return serieNove?2:1;
}
function montarSlotsPlano(obrigatorios, extras, contentSlots){
  const nReq=obrigatorios.length, nExtra=extras.length, nTotal=nReq+nExtra;
  const slots=[];
  if(contentSlots<=0) return {slots, aviso:'Sem aulas de conteúdo disponíveis — só sobra espaço pra revisão/recomposição.'};
  if(contentSlots>=nTotal){
    [...obrigatorios,...extras].forEach(it=>{
      const baseline=it.subs?Math.min(it.subs.length,4):1;
      slots.push({item:it, aulas:baseline});
    });
    let soma=slots.reduce((s,x)=>s+x.aulas,0);
    while(soma>contentSlots){ const maior=slots.reduce((m,s)=>s.aulas>(m?m.aulas:0)?s:m,null); if(!maior||maior.aulas<=1) break; maior.aulas--; soma--; }
    let leftover=contentSlots-soma;
    for(const s of slots){ if(leftover<=0) break; if(!s.item.subs && s.item.riqueza>=2 && s.aulas===1){ s.aulas=2; leftover--; } }
    const nAvals=Math.max(0,Math.floor(leftover));
    for(let i=0;i<nAvals;i++){
      const pos=Math.max(1,Math.min(slots.length,Math.round(slots.length*(i+1)/(nAvals+1))));
      slots.splice(pos,0,{item:{avaliacao:true,nome:'Atividade avaliativa — revisão do conteúdo até aqui'}, aulas:1});
    }
    return {slots, aviso: nAvals?(nAvals+' aula(s) avaliativa(s) inserida(s) pelo excedente de aulas.'):null};
  }
  if(contentSlots>=nReq){
    obrigatorios.forEach(it=>slots.push({item:it, aulas:1}));
    const sobra=contentSlots-nReq;
    if(sobra>0 && nExtra>0){
      const porBucket=Math.ceil(nExtra/sobra);
      for(let i=0;i<nExtra;i+=porBucket) slots.push({item:{agrupado:true, itens:extras.slice(i,i+porBucket)}, aulas:1});
    }
    return {slots, aviso: nExtra>sobra?(nExtra+' tema(s) extra(s) da turma precisaram se juntar em aulas compartilhadas.'):null};
  }
  const nBuckets=contentSlots, base=Math.floor(nReq/nBuckets), resto=nReq%nBuckets;
  let idx=0;
  for(let b=0;b<nBuckets;b++){
    const tam=base+(b<resto?1:0);
    const grupo=obrigatorios.slice(idx,idx+tam); idx+=tam;
    slots.push({item: grupo.length>1?{agrupado:true,itens:grupo}:grupo[0], aulas:1});
  }
  return {slots, aviso:'Mais conteúdo obrigatório da matriz ('+nReq+') do que aulas disponíveis ('+contentSlots+') — vários códigos foram agrupados na mesma aula.'};
}
function gerarSequenciaAutomatica(turmaId, bim){
  const tu=turmas[turmaId]; if(!tu) return;
  const matriz=(MATRIZ[matrizKey(tu.disciplina,tu.serie,bim)]||[]);
  const conts=Object.values(conteudos).filter(c=>c&&c.turmaId===turmaId&&c.bimestre===bim);
  const temasBim=[]; conts.forEach(c=>temasDoConteudo(c.id).forEach(t=>temasBim.push(t)));
  const codigosMatriz=new Set(matriz.map(m=>m.c.trim().toUpperCase()));
  const obrigatorios=matriz.map(m=>{
    const code=m.c.trim().toUpperCase();
    const tema=temasBim.find(t=>t.dcgo&&t.dcgo.trim().toUpperCase()===code);
    if(!tema) return null;
    const subs=subsDoCodigoPlano(code, tu.disciplina);
    return {tema, dcgo:m.c, riqueza:riquezaCodigoPlano(code, tu.serie==='9º ano', tu.disciplina), subs};
  }).filter(Boolean).sort((a,b)=>a.dcgo.localeCompare(b.dcgo,'pt-BR',{numeric:true,sensitivity:'base'}));
  const extras=temasBim.filter(t=>!t.dcgo||!codigosMatriz.has(t.dcgo.trim().toUpperCase())).map(t=>({tema:t, riqueza:1, subs:null}));
  if(!obrigatorios.length && !extras.length){ toast('Nenhum tema encontrado nesta turma/bimestre pra sequenciar.','err'); return; }

  const hoje=isoLocal(new Date());
  const datasFuturas=datasDoBimestre(tu,bim).filter(d=>d>=hoje);
  if(!datasFuturas.length){ toast('Não há mais aulas futuras neste bimestre pra essa turma.','err'); return; }
  const total=datasFuturas.length;
  const endReserved=total>=4?2:(total>=2?1:0);
  const contentSlots=total-endReserved;
  const {slots, aviso}=montarSlotsPlano(obrigatorios, extras, contentSlots);

  const jaExistentes=[]; conts.forEach(c=>(c.planejamento||[]).forEach(p=>{ if(p.data>=hoje) jaExistentes.push({c,p}); }));
  if(jaExistentes.length && !confirm('Isso vai substituir '+jaExistentes.length+' entrada(s) de planejamento futuras já existentes nesta turma por uma sequência nova. Continuar?')) return;
  jaExistentes.forEach(({c,p})=>{ c.planejamento=c.planejamento.filter(x=>x.id!==p.id); });

  const novasEntradas=[]; // {conteudoId, entry}
  let di=0;
  slots.forEach(s=>{
    for(let k=0;k<s.aulas;k++){
      const data=datasFuturas[di]; di++;
      if(!data) return;
      if(s.item.avaliacao){ /* aula avaliativa não vira planejamento de conteúdo — fica só no aviso */ continue; }
      if(s.item.agrupado){
        s.item.itens.forEach(it=>{
          novasEntradas.push({conteudoId:it.tema.conteudoId, entry:{id:uid(), data, temaId:it.tema.id, objeto:'estudo', obs:'agrupado nesta aula'}});
        });
        continue;
      }
      const it=s.item;
      // Códigos sem decomposição em subtemas (matriz de 1 aula só) não têm it.subs —
      // sem isso, obs ficava em branco no planejamento. Cai pro resumo/habilidade do
      // próprio tema, que já é curto o bastante pra servir de recorte da semana.
      const label=(it.subs && it.subs[k]) ? it.subs[k].s : (it.tema.resumo || it.tema.habilidade || '');
      novasEntradas.push({conteudoId:it.tema.conteudoId, entry:{id:uid(), data, temaId:it.tema.id, objeto:'estudo', obs:label}});
    }
  });
  if(endReserved>=1 && datasFuturas[di]) di++; // revisão — sem tema associado, só ocupa a data
  if(endReserved>=2 && datasFuturas[di]) di++; // recomposição

  const porConteudo={};
  novasEntradas.forEach(({conteudoId,entry})=>{ (porConteudo[conteudoId]||(porConteudo[conteudoId]=[])).push(entry); });
  Object.entries(porConteudo).forEach(([cid,entries])=>{
    const c=conteudos[cid]; if(!c) return;
    if(!c.planejamento) c.planejamento=[];
    c.planejamento.push(...entries);
    persistConteudo(c);
  });
  toast(novasEntradas.length+' aula(s) sequenciada(s)'+(aviso?' — '+aviso:'')+'.', 'ok');
  renderLinhaDoTempo();
}
/* Recuperação: entradas de planejamento no passado sem chamada/registro
   (não aconteceram de verdade) voltam pra fila, junto com as futuras, e
   tudo é remapeado nas próximas datas disponíveis — fecha o buraco sem
   ela ter que reorganizar manualmente uma por uma. */
function recuperarSequencia(turmaId, bim){
  const tu=turmas[turmaId]; if(!tu) return;
  const hoje=isoLocal(new Date());
  const conts=Object.values(conteudos).filter(c=>c&&c.turmaId===turmaId&&c.bimestre===bim);
  const pendentes=[]; // {c,p} em ordem de data
  conts.forEach(c=>(c.planejamento||[]).forEach(p=>{
    if(p.data>=hoje){ pendentes.push({c,p}); return; }
    const feito=Object.values(registros).some(r=>r&&r.turmaId===turmaId&&r.temaId===p.temaId&&r.data===p.data) || !!chamadaDoDia(turmaId,p.data);
    if(!feito) pendentes.push({c,p});
  }));
  if(!pendentes.length){ toast('Nada pendente pra recuperar — o planejamento desta turma está em dia.','ok'); return; }
  pendentes.sort((a,b)=>a.p.data.localeCompare(b.p.data));
  const datasFuturas=datasDoBimestre(tu,bim).filter(d=>d>=hoje);
  if(!confirm(pendentes.length+' aula(s) planejada(s) ficaram sem acontecer — remapear pras próximas '+Math.min(pendentes.length,datasFuturas.length)+' data(s) disponíveis?')) return;
  pendentes.forEach(({c,p})=>{ c.planejamento=c.planejamento.filter(x=>x.id!==p.id); });
  let sobraram=0;
  pendentes.forEach(({c,p},i)=>{
    const novaData=datasFuturas[i];
    if(!novaData){ sobraram++; return; }
    if(!c.planejamento) c.planejamento=[];
    c.planejamento.push({...p, data:novaData});
  });
  Object.values(conteudos).filter(c=>c&&c.turmaId===turmaId&&c.bimestre===bim).forEach(c=>persistConteudo(c));
  toast('Sequência remapeada.'+(sobraram?(' '+sobraram+' aula(s) ficaram sem data — faltam aulas disponíveis no bimestre.'):''), sobraram?'':'ok');
  renderLinhaDoTempo();
}

function planejamentoSectionHtml(tu, bim, hoje){
  const conts=Object.values(conteudos).filter(c=>c&&c.turmaId===tu.id&&c.bimestre===bim);
  const entradas=[];
  conts.forEach(c=>(c.planejamento||[]).forEach(p=>{ if(p.data>=hoje) entradas.push({c,p}); }));
  entradas.sort((a,b)=>a.p.data.localeCompare(b.p.data));
  // Selo de metodologia por semana — detecta quando a MESMA metodologia se
  // repete 3x ou mais na mesma semana (segunda a domingo) pra essa turma,
  // pra evitar empilhar "texto" 3x sem perceber (pedido dela).
  function semanaKey(iso){
    const d=new Date(iso+'T00:00:00');

  const contagemSemana={};
  entradas.forEach(({p})=>{
    if(!p.metodologia) return;

  });
  let h='<div class="lt-planejamento"><div class="lt-plan-head"><h3>Planejamento (a partir de hoje)</h3>'+
    '<div><button class="btn ghost sm" onclick="recuperarSequencia(\''+tu.id+'\',\''+esc(bim)+'\')" title="Remapeia aulas planejadas que ficaram sem acontecer pras próximas datas disponíveis">🔁 recuperar</button> '+
    '<button class="btn ghost sm" onclick="imprimirPlanejamentoBimestre(\''+tu.id+'\',\''+esc(bim)+'\')" title="Abre o planejamento em papel timbrado, pronto pra imprimir/salvar em PDF">🖨 imprimir planejamento</button> '+
    '<button class="btn sm" onclick="gerarSequenciaAutomatica(\''+tu.id+'\',\''+esc(bim)+'\')">🪄 gerar sequência automática</button></div>'+
  '</div>';
  if(!entradas.length){ h+='<p style="color:var(--muted);font-size:13px">Nenhuma aula planejada a partir de hoje ainda — use "gerar sequência automática".</p></div>'; return h; }
  h+='<div class="lt-plan-list">'+entradas.map(({c,p},i)=>{
    const t=temas[p.temaId]||{};
    const objLabel=(OBJ_DEFS.find(o=>o.k===p.objeto)||{}).label||p.objeto||'—';
    const repete = p.metodologia && contagemSemana[semanaKey(p.data)+'::'+p.metodologia]>=3;
    const metSelo = p.metodologia
      ? '<span class="selo '+(repete?'met-repete':'met')+'" title="'+(repete?'Essa metodologia já aparece 3x ou mais nesta semana pra essa turma':'Metodologia desta aula')+'">🎯 '+esc(p.metodologia)+(repete?' ⚠':'')+'</span>'
      : '';
    return '<div class="lt-plan-row">'+
      '<span class="lt-plan-data">'+p.data.split('-').reverse().join('/')+'</span>'+
      '<span class="lt-plan-tema" onclick="abrirEditor(\''+p.temaId+'\')" title="Abrir tema">'+esc(t.tituloExibicao||t.nome||'(tema removido)')+'</span>'+
      '<span class="lt-plan-obj">'+objIconHtml(p.objeto)+esc(objLabel)+(p.obs?(' · '+esc(p.obs)):'')+'</span>'+
      metSelo+
      '<button class="btn ghost sm" onclick="moverPlanejamentoLT(\''+tu.id+'\',\''+esc(bim)+'\','+i+',-1)"'+(i===0?' disabled':'')+'>▲</button>'+
      '<button class="btn ghost sm" onclick="moverPlanejamentoLT(\''+tu.id+'\',\''+esc(bim)+'\','+i+',1)"'+(i===entradas.length-1?' disabled':'')+'>▼</button>'+
      '<button class="btn ghost sm danger" onclick="removerPlanejamentoLT(\''+c.id+'\',\''+p.id+'\')">✕</button>'+
    '</div>';
  }).join('')+'</div></div>';
  return h;
}
function moverPlanejamentoLT(turmaId, bim, index, delta){
  const conts=Object.values(conteudos).filter(c=>c&&c.turmaId===turmaId&&c.bimestre===bim);
  const hoje=isoLocal(new Date());
  const entradas=[]; conts.forEach(c=>(c.planejamento||[]).forEach(p=>{ if(p.data>=hoje) entradas.push({c,p}); }));
  entradas.sort((a,b)=>a.p.data.localeCompare(b.p.data));
  const j=index+delta;
  if(j<0||j>=entradas.length) return;
  const dataA=entradas[index].p.data, dataB=entradas[j].p.data;
  entradas[index].p.data=dataB; entradas[j].p.data=dataA;
  persistConteudo(entradas[index].c);
  if(entradas[j].c.id!==entradas[index].c.id) persistConteudo(entradas[j].c);
  renderLinhaDoTempo();
}
function removerPlanejamentoLT(conteudoId, planejamentoId){
  const c=conteudos[conteudoId]; if(!c||!c.planejamento) return;
  c.planejamento=c.planejamento.filter(p=>p.id!==planejamentoId);
  persistConteudo(c);
  renderLinhaDoTempo();
}
const DIAS_SEMANA_CURTO={0:'dom',1:'seg',2:'ter',3:'qua',4:'qui',5:'sex',6:'sáb'};
/* Papel timbrado do planejamento — mesmo timbre SEDUC do relatório de

function planejamentoRelatorioHtml(tu, bim, porSemana){

    else{ const dObj=new Date(p.data+'T00:00:00'); rotulo=p.data.split('-').reverse().join('/')+' ('+DIAS_SEMANA_CURTO[dObj.getDay()]+')'; }
    h+='<div class="tema"><h3>'+esc(rotulo)+' — '+esc(t.tituloExibicao||t.nome||'(tema removido)')+'</h3>';

    if(t.atividadeEmSala) h+='<p><b>Atividade em sala:</b> '+esc(t.atividadeEmSala)+'</p>';

function wordCount(x){ return String(x||'').trim().split(/\s+/).filter(Boolean).length; }
/* tempo MECÂNICO (alunos): cópia ~10 pal/min, leitura ~120 pal/min, ~6min/atividade, ~4min/questão */
function tempoMecanico(t){
  const o=t.obj||{};
  const copia   = wordCount(o.quadro||o.textoQuadro||'')/10;
  const leitura = wordCount(o.estudo||o.textoAluno||'')/120;
  const av2=o.avaliacao||{}; const resposta=(av2.atividade||o.atividade||[]).length*6+(av2.questoes||o.questoes||[]).length*4;
  const flash   = (o.flashcards||[]).length*0.5;
  return Math.round(copia+leitura+resposta+flash);
}
async function estimarAulasIA(){
  const temasBim=[]; conteudosDoScope().forEach(c=> temasDoConteudo(c.id).forEach(t=>temasBim.push(t)) );
  if(!temasBim.length){ toast('Nenhum tema neste bimestre.','err'); return; }
  const btn=document.getElementById('estBtn'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin dark"></span> estimando…'; }
  // manda o CONTEÚDO REAL (resumido) para a IA julgar a densidade da explicação
  const blocos=temasBim.map((t,i)=>{
    const o=t.obj||{};
    const conteudo=[o.quadro||o.textoQuadro,o.estudo||o.textoAluno].filter(Boolean).join('\n').slice(0,900);
    return 'TEMA '+(i+1)+': '+(t.nome||'(sem título)')+'\nConteúdo: '+(conteudo||'(ainda sem texto gerado — estime pelo título)');
  }).join('\n\n');
  try{
    const sys='Você é professora experiente de '+(temasBim[0].serie||'')+' ('+(temasBim[0].disciplina||'')+'). Estime o tempo de AULA, em minutos, para EXPLICAR e DISCUTIR/CORRIGIR cada tema, conforme a densidade do conteúdo real. NÃO inclua tempo de cópia, leitura ou resposta dos alunos (isso é somado à parte). Aula padrão = 50 min.';
    const usr='Para cada tema, devolva o tempo de explicação+correção em MINUTOS. Responda APENAS um JSON: array de inteiros (10 a 200), na MESMA ordem dos temas, sem texto extra.\n\n'+blocos;
    const raw=await callClaude(sys,usr);
    const arr=JSON.parse(raw.replace(/```json|```/g,'').trim());
    if(Array.isArray(arr)) temasBim.forEach((t,i)=>{
      const explic=Math.max(0,parseInt(arr[i],10)||0);
      const mec=tempoMecanico(t);
      const total=explic+mec;
      t.aulasEstim=Math.max(1, Math.round(total/50));
      t.tempoDetalhe={explic, mec, total};
      persistTema(t);
    });
    toast('Estimativa recalculada: explicação (IA) + cópia/leitura/resposta (réguas).','ok');
  }catch(e){ toast('Não consegui estimar agora: '+e.message,'err'); }
  if(btn){ btn.disabled=false; btn.innerHTML='✦ estimar aulas por tema (IA)'; }
  renderBimBody();
}
function sectionsWithContent(){
  const present=new Set();
  conteudosDoScope().forEach(c=>temasDoConteudo(c.id).forEach(t=>{
    const o=t.obj||{};
    REL_KEYS.forEach(k=>{
      if(k==='imagens'){ if((t.imagens||[]).length) present.add(k); return; }
      if(k==='avaliacao'){
        const av=o.avaliacao||{};
        if(Object.values(av).some(a=>Array.isArray(a)&&a.length>0)) present.add(k);
        return;
      }
      const v=o[k];
      if(typeof v==='string'){ if(v.trim()) present.add(k); }
      else if(Array.isArray(v)){ if(v.length) present.add(k); }
    });
  }));
  return present;
}

  return Object.values(ad).some(v=>Array.isArray(v)?v.length>0:String(v||'').trim().length>0);
}

    conts.forEach(c=>temasDoConteudo(c.id).forEach(t=>_relTemasIncluidos.add(t.id)));
  }
  let h='';

    const ts=temasDoConteudo(c.id);
    if(!ts.length) return;
    h+='<div class="rel-temas-grupo"><strong>'+esc(c.nome)+'</strong>';

    });

  });
  box.innerHTML=h||'<span style="color:var(--muted);font-size:13px">Nenhum tema nesta turma/bimestre.</span>';

}

const SLIDE_PALETTE=['#2f6b5e','#a8562e','#3a5f8a','#7a4b8a','#8a6d1f','#2e7a73'];
function temaRelatorioHtml(t,incs,opt){
  opt=opt||{};
  let h='<div class="tema"><h3>'+esc(t.tituloExibicao||t.nome)+'</h3>';
  let meta=[]; if(t.dcgo)meta.push(t.dcgo);
  const it=matrizItem(t.disciplina,t.serie,t.bimestre,t.dcgo);
  if(it){ const sel=[]; if(it.r===1)sel.push('REVISA'); if(it.s===1)sel.push('SER'); if(it.g===1)sel.push('GoiásTec'); if(sel.length)meta.push('Material: '+sel.join(', ')); }
  { const st=t.status||{}; if(st.estado==='aplicado'&&st.data)meta.push('Aplicado em '+st.data.split('-').reverse().join('/')); else if(st.estado==='planejado')meta.push('Planejado'); }
  if(meta.length) h+='<div class="meta">'+esc(meta.join('  ·  '))+'</div>';
  const o=t.obj||{};
  (relCfg.ordem||REL_KEYS).forEach(k=>{
    if(!incs.includes(k)) return;
    const L=esc(relLabel(k));
    const adv = opt.perfil ? ((t.adaptado||{})[opt.perfil]||null) : null;
    // adaptado: sobrescreve o campo original pelo adaptado quando disponível
    const usarAdv = adv && adv[k];
    if(usarAdv){
      if(k==='estudo'||k==='quadro'){ h+='<h4>'+L+' (adaptado)</h4>'+mdToPrint(adv[k]); return; }
      if(k==='mapaMental'){ h+='<h4>'+L+'</h4>'+mdMapToHtml(adv[k]); return; }
    }
    if(k==='quadro'&&o.quadro) h+='<h4>'+L+'</h4>'+mdToPrint(o.quadro);
    else if(k==='estudo'&&o.estudo) h+='<h4>'+L+'</h4>'+mdToPrint(o.estudo);
    // estudo handled above
    else if(k==='slides'&&(o.slides||[]).length){ h+='<h4>'+L+'</h4><div class="slidewrap">'; o.slides.forEach((s,i)=>{ const cor=SLIDE_PALETTE[i%SLIDE_PALETTE.length]; h+='<div class="slidecard" style="border-left-color:'+cor+'"><p class="slidenum" style="color:'+cor+'">Slide '+(i+1)+'</p><p class="slidetit" style="color:'+cor+'">'+esc(s.titulo||'')+'</p><ul>'+(s.topicos||[]).filter(x=>x.trim()).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'; }); h+='</div>'; }
    else if(k==='atividade'&&(o.atividade||[]).length){ h+='<h4>'+L+'</h4><ol>'+o.atividade.map(x=>'<li>'+esc(x.enunciado||'')+'</li>').join('')+'</ol>'; }
    else if(k==='gabarito'&&(o.gabarito||[]).length){ h+='<h4>'+L+'</h4><ol>'+o.gabarito.map(x=>'<li><b>'+esc(x.resposta||'')+'</b>'+(x.comentario?' — '+esc(x.comentario):'')+'</li>').join('')+'</ol>'; }
    else if(k==='avaliacao'&&o.avaliacao&&Object.values(o.avaliacao).some(a=>Array.isArray(a)&&a.length>0)){
      const av=o.avaliacao;
      if((av.atividade||[]).length){ h+='<h4>Atividade</h4><ol>'+(av.atividade||[]).map(q=>'<li>'+esc(q.enunciado||'')+'</li>').join('')+'</ol>'; }
      if((av.questoes||[]).length){ h+='<h4>Questões</h4><ol>'+(av.questoes||[]).map(q=>'<li>'+esc(q.enunciado||'')+'<ul class="alts">'+(q.alternativas||[]).map((a,i)=>'<li>'+String.fromCharCode(65+i)+') '+esc(a)+'</li>').join('')+'</ul></li>').join('')+'</ol>'; }
      if((av.flashcards||[]).length){ h+='<h4>Flashcards</h4><table class="fc-table">'+(av.flashcards||[]).map(f=>'<tr><td>'+esc(f.frente||'')+'</td><td>'+esc(f.verso||'')+'</td></tr>').join('')+'</table>'; }
      // Gabarito: só incluir se 'gabarito' explicitamente está no relIncluded (padrão: NÃO)
      // No PDF padrão as questões saem sem gabarito — professor imprime gabarito separado
      if(relIncluded.has('gabarito')&&(av.gabarito||[]).length){ h+='<h4>Gabarito</h4><ol>'+(av.gabarito||[]).map(g=>'<li><strong>'+esc(g.resposta||'')+'</strong>'+(g.comentario?'<br><span class="cmt">'+esc(g.comentario)+'</span>':'')+'</li>').join('')+'</ol>'; }
    }
    else if(k==='flashcards'&&(o.flashcards||[]).length){ h+='<h4>'+L+'</h4><ol class="fcq">'+o.flashcards.map(f=>'<li><b>'+esc(f.frente||'')+'</b>'+(opt.flashResp?('<br><span class="resp">'+esc(f.verso||'')+'</span>'):'')+'</li>').join('')+'</ol>'; }
    else if(k==='mapaMental'&&(o.mapaMental||o.mapa)) h+='<h4>'+L+'</h4>'+mdMapToHtml(o.mapaMental||o.mapa);
    else if(k==='imagens'&&(t.imagens||[]).length){ h+='<h4>'+L+'</h4><div class="imgs">'+t.imagens.map(im=>'<img src="'+esc(im.url||im.thumburl)+'">').join('')+'</div>'; }
  });
  h+='</div>'; return h;
}

function saveConfig(){
  const model=document.getElementById('cfgModel').value.trim()||'claude-sonnet-4-6';
  const fb=document.getElementById('cfgFb').value.trim();
  try{ localStorage.setItem(LS_MODEL,model); }catch(e){}
  let fbChanged=false;
  if(fb!==(localStorage.getItem(LS_FB)||'')){
    if(fb){ try{ JSON.parse(fb); }catch(e){ toast('Firebase: JSON inválido.','err'); return; } }
    try{ localStorage.setItem(LS_FB,fb); }catch(e){}
    fbChanged=true;
  }
  closeModal();
  if(fbChanged){ toast('Configurações salvas. Recarregando…','ok'); setTimeout(()=>location.reload(),700); }
  else toast('Configurações salvas.','ok');
}
function exportBackup(){

const BACKUP_COMPLETO_COLECOES=['conteudos','temas','turmas','alunos','registros','chamadas','atividadesCtrl','notasCtrl','ocorrencias','aulasAvulsas','notasGerais','qualitativa','compromissos'];

function importarBackupCompleto(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(!d.version || d.version<3){ toast('Este arquivo não é um backup completo (é da exportação de conteúdo, mais antiga/limitada). Use "Importar conteúdo" pra esse tipo de arquivo.','err'); ev.target.value=''; return; }
    const chavePerigosa=(id)=>id==='__proto__'||id==='constructor'||id==='prototype';
    const contagem={};
    BACKUP_COMPLETO_COLECOES.forEach(k=>{ contagem[k]=Object.keys(d[k]||{}).filter(id=>!chavePerigosa(id)).length; });
    const total=Object.values(contagem).reduce((s,n)=>s+n,0);
    const resumo=BACKUP_COMPLETO_COLECOES.filter(k=>contagem[k]).map(k=>'• '+contagem[k]+' '+k).join('\n');
    if(!confirm('Isto vai SOBRESCREVER os dados atuais do Leciona (local e Firebase) com o conteúdo deste backup — '+total+' registro(s) no total:\n\n'+resumo+'\n\nEssa ação não pode ser desfeita. Restaurar mesmo assim?')){ ev.target.value=''; return; }
    const confirmacao=prompt('Para confirmar, digite RESTAURAR (em maiúsculas):');
    if(confirmacao!=='RESTAURAR'){ toast('Cancelado — o texto de confirmação não bateu. Nada foi restaurado.',''); ev.target.value=''; return; }
    const persistPorColecao={
      conteudos:persistConteudo, temas:persistTema, turmas:persistTurma, alunos:persistAluno,
      registros:persistRegistro, chamadas:persistChamada, atividadesCtrl:persistAtivCtrl, notasCtrl:persistNota,
      ocorrencias:persistOcorrencia, aulasAvulsas:persistAulaAvulsa, notasGerais:persistNotaGeral,
      qualitativa:persistQualitativa, compromissos:persistCompromisso,
    };
    let restaurados=0;
    BACKUP_COMPLETO_COLECOES.forEach(k=>{
      const persistFn=persistPorColecao[k];
      Object.entries(d[k]||{}).forEach(([id,item])=>{
        if(chavePerigosa(id) || !item || !item.id || chavePerigosa(item.id)) return;
        persistFn(item); restaurados++;
      });
    });
    if(d.mediaModo && typeof d.mediaModo==='object'){
      mediaModo=Object.assign({}, mediaModo, d.mediaModo);
      lsSet('leciona_media_modo', JSON.stringify(mediaModo));
    }
    if(!DB){ migrateAndRender(); }
    toast(restaurados+' registro(s) restaurado(s). Recarregando…','ok');
    setTimeout(()=>location.reload(),1200);
  }catch(e){ toast('Arquivo inválido: '+e.message,'err'); } };
  r.readAsText(f); ev.target.value='';
}
function importBackup(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    // Proteção contra prototype pollution: rejeita chaves perigosas.
    const chavePerigosa=(id)=>id==='__proto__'||id==='constructor'||id==='prototype';
    // Conta o que será importado, para avisar antes de sobrescrever.
    const nTemas=Object.keys(d.temas||d||{}).filter(k=>!chavePerigosa(k)).length;
    const nCont=Object.keys(d.conteudos||{}).length;
    const nTurmas=Object.keys(d.turmas||{}).length;
    const nExcluir=Array.isArray(d.excluirTemas)?d.excluirTemas.length:0;
    const resumo='Este backup vai importar/sobrescrever:\n• '+nTemas+' tema(s)\n'+(nCont?'• '+nCont+' conteúdo(s)\n':'')+(nTurmas?'• '+nTurmas+' turma(s)\n':'')+(nExcluir?'• excluir '+nExcluir+' tema(s)\n':'')+'\nTemas com o mesmo código serão substituídos pelos do arquivo. Deseja continuar?';
    if(!confirm(resumo)){ ev.target.value=''; return; }
    let n=0, del=0;
    if(d.conteudos) Object.entries(d.conteudos).forEach(([k,c])=>{ if(!chavePerigosa(k)&&c&&c.id&&!chavePerigosa(c.id)){ persistConteudo(c); } });
    if(d.turmas) Object.entries(d.turmas).forEach(([k,t])=>{ if(!chavePerigosa(k)&&t&&t.id&&!chavePerigosa(t.id)){ persistTurma(t); } });
    const imp=d.temas||d;
    Object.entries(imp).forEach(([k,t])=>{ if(!chavePerigosa(k)&&t&&t.id&&!chavePerigosa(t.id)){ persistTema(t); n++; } });
    if(Array.isArray(d.excluirTemas)) d.excluirTemas.forEach(id=>{ if(!chavePerigosa(id)&&temas[id]){ removeTema(id); del++; } });
    if(!DB){ migrateAndRender(); }
    toast(n+' tema(s) importado(s)/corrigido(s)'+(del?', '+del+' excluído(s)':'')+'.','ok');
  }catch(e){ toast('Arquivo inválido.','err'); } };
  r.readAsText(f); ev.target.value='';
}

      '<div class="hoje-acoes">'+acoes+'</div></div>';
  }).join('')+'</div>';

/* ═══════════════════════════════════════════════════════════════════════

function persistNotaGeral(n){ n._ts=Date.now(); notasGerais[n.id]=n; lsSet(LS_NOTASGERAIS,JSON.stringify(notasGerais)); if(DB) DB.ref('leciona/notas_gerais/'+n.id).set(n).catch(e=>toast('⚠ Falha ao gravar a nota (mantida localmente). '+e.message,'err')); }

        '<div style="flex:1"><div style="font-size:11px;color:var(--muted);margin-bottom:3px">'+(n.autor==='assistente'?'🤖 Assistente':'📝 Você')+(n._ts?(' · '+new Date(n._ts).toLocaleDateString('pt-BR')):'')+'</div>'+esc(n.texto)+
          (Array.isArray(n.turmaIds)&&n.turmaIds.length?'<div style="font-size:11px;color:#6a8fbf;margin-top:3px">📌 '+n.turmaIds.map(id=>esc(turmaNome(turmas[id]||{}))).join(', ')+'</div>':'')+

function persistCompromisso(c){ c._ts=Date.now(); compromissos[c.id]=c; lsSet(LS_COMP,JSON.stringify(compromissos)); if(DB) DB.ref('leciona/compromissos/'+c.id).set(c).catch(e=>toast('⚠ Falha ao gravar na agenda (mantido localmente). '+e.message,'err')); }

/* ---------- Aula avulsa: aula sem tema pré-definido (explicação, atividade,
   correção, recomposição de aprendizagem), com ciclo planejamento→execução
   igual ao padrão do SIAP. Coleção própria, separada de `registros` (que
   exige temaId) — ver justificativa no plano de manutenção. ---------- */
const AULA_AVULSA_TIPOS={explicacao:'Explicação',atividade:'Atividade',correcao:'Correção',recomposicao:'Recomposição de aprendizagem'};
function persistAulaAvulsa(a){ a._ts=Date.now(); aulasAvulsas[a.id]=a; lsSet(LS_AULASAVULSAS,JSON.stringify(aulasAvulsas)); if(DB) DB.ref('leciona/aulas_avulsas/'+a.id).set(a).catch(e=>toast('⚠ Falha ao gravar aula avulsa (mantida localmente). '+e.message,'err')); }
function removerAulaAvulsa(id){
  if(!confirm('Remover esta aula avulsa?')) return;
  delete aulasAvulsas[id];
  lsSet(LS_AULASAVULSAS,JSON.stringify(aulasAvulsas));
  if(DB) DB.ref('leciona/aulas_avulsas/'+id).remove().catch(e=>toast('⚠ Removida localmente, mas falhou ao remover no Firebase: '+e.message,'err'));
  renderAgenda();
}
function aulasAvulsasDoDia(turmaId,dataISO){ return Object.values(aulasAvulsas).filter(a=>a&&a.turmaId===turmaId&&a.data===dataISO); }
function aulasAvulsasDoDiaGlobal(dataISO){ return Object.values(aulasAvulsas).filter(a=>a&&a.data===dataISO); }
function marcarAulaAvulsaExecutada(id,dataReal){
  const a=aulasAvulsas[id]; if(!a) return;
  a.status='executada';
  if(dataReal) a.data=dataReal;
  persistAulaAvulsa(a);
  renderAgenda();

function confirmarNovaAulaAvulsa(){
  const turmaId=document.getElementById('alTurma').value;
  const titulo=document.getElementById('alTitulo').value.trim();
  const tipo=document.getElementById('alTipo').value;
  const data=document.getElementById('alData').value;
  const observacoes=document.getElementById('alObs').value.trim();
  if(!turmaId||!titulo||!data){ toast('Preencha turma, título e data.','err'); return; }
  const editId=_editandoAulaAvulsaId;
  const existente=editId?aulasAvulsas[editId]:null;
  const a=existente
    ? Object.assign({}, existente, {turmaId,titulo,tipo,observacoes,data})
    : {id:uid(),turmaId,titulo,tipo,observacoes,data,status:'planejada'};
  persistAulaAvulsa(a);
  closeModal();
  _editandoAulaAvulsaId=null;
  toast(existente?'Aula avulsa atualizada.':'Aula avulsa salva.','ok');
  renderAgenda();
}
let _agendaMes=null;     // Date do 1º dia do mês em exibição
let _agendaDiaSel=null;  // ISO do dia selecionado no painel
let _agendaOrigin='hoje';
let _agendaGradeAberta=false; // calendário do mês vem recolhido por padrão (ex-tela Hoje)
function toggleAgendaGrade(){ _agendaGradeAberta=!_agendaGradeAberta; renderAgenda(); }
function mudarMesAgenda(delta){
  if(!_agendaMes) _agendaMes=new Date();
  _agendaMes=new Date(_agendaMes.getFullYear(), _agendaMes.getMonth()+delta, 1);
  renderAgenda();
}
/* Mesma fonte que a tela Hoje usa (SCHEDULE + unidadeDoDia), mas pra uma
   data qualquer, não só "hoje". */
function aulasDoDiaISO(dataISO){
  const d=new Date(dataISO+'T00:00:00');
  const dia=d.getDay();
  if(FERIADOS_2026.has(dataISO)) return [];
  if(!bimAtivoAgora(dataISO)) return [];
  return SCHEDULE.filter(x=>x.dia===dia).sort((a,b)=>a.ini.localeCompare(b.ini));
}
function compromissosDoDia(dataISO){
  return Object.values(compromissos).filter(c=>c&&c.data===dataISO).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
}
function renderAgenda(){
  const box=document.getElementById('agendaBody'); if(!box) return;
  if(!_agendaMes) _agendaMes=new Date();
  if(!_agendaDiaSel) _agendaDiaSel=isoLocal(new Date());
  const voltarLabel = _agendaOrigin==='notas'?'Notas':_agendaOrigin==='gestao'?'Gestão':'';
  box.innerHTML =
    (voltarLabel?'<button class="btn ghost sm" style="margin-bottom:10px" onclick="setView(\''+_agendaOrigin+'\')">← Voltar pra '+voltarLabel+'</button>':'')+
    '<div class="agenda-layout">'+
      '<div class="agenda-card"><div class="agenda-mes-nav">'+
        '<button class="btn ghost sm" onclick="mudarMesAgenda(-1)">◀</button>'+
        '<div class="agenda-mes-label" id="agendaMesLabel"></div>'+
        '<button class="btn ghost sm" onclick="mudarMesAgenda(1)">▶</button>'+
        '<button class="btn ghost sm" style="margin-left:auto" onclick="toggleAgendaGrade()">'+(_agendaGradeAberta?'recolher ▲':'ver mês ▾')+'</button>'+
      '</div><div id="agendaGrade" class="agenda-grade'+(_agendaGradeAberta?'':' hidden')+'"></div></div>'+
      '<div class="agenda-card" id="agendaDiaCard"></div>'+
    '</div>'+
    '<div class="agenda-card" id="notasGeraisCard" style="margin-top:16px"></div>';
  renderAgendaGrade();
  renderAgendaDia();
  renderNotasGeraisAgenda();
}
function renderAgendaGrade(){
  const grade=document.getElementById('agendaGrade'); const label=document.getElementById('agendaMesLabel');
  if(!grade||!label) return;
  const ano=_agendaMes.getFullYear(), mes=_agendaMes.getMonth();
  label.textContent=_agendaMes.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const primeiroDia=new Date(ano,mes,1).getDay();
  const totalDias=new Date(ano,mes+1,0).getDate();
  const hojeISO=isoLocal(new Date());
  let html='<div class="agenda-semana">'+['D','S','T','Q','Q','S','S'].map(d=>'<span>'+d+'</span>').join('')+'</div><div class="agenda-dias">';
  for(let i=0;i<primeiroDia;i++) html+='<div class="agenda-cel vazia"></div>';
  for(let dia=1;dia<=totalDias;dia++){
    const d=new Date(ano,mes,dia); const iso=isoLocal(d);
    const temAula = SCHEDULE.some(x=>x.dia===d.getDay()) && !FERIADOS_2026.has(iso) && !!bimAtivoAgora(iso);
    const nCron = planejamentosDoDia(iso).length;
    const nComp = compromissosDoDia(iso).length;
    const nAvulsa = aulasAvulsasDoDiaGlobal(iso).length;
    const cls=['agenda-cel']; if(iso===hojeISO) cls.push('hoje'); if(iso===_agendaDiaSel) cls.push('sel');
    const pontos = (temAula?'<span class="agenda-ponto aula"></span>':'') + (nCron?'<span class="agenda-ponto cron"></span>':'') + (nComp?'<span class="agenda-ponto comp"></span>':'') + (nAvulsa?'<span class="agenda-ponto avulsa"></span>':'');
    html+='<div class="'+cls.join(' ')+'" onclick="selecionarDiaAgenda(\''+iso+'\')"><span class="agenda-num">'+dia+'</span><div class="agenda-pontos">'+pontos+'</div></div>';
  }
  html+='</div>';
  grade.innerHTML=html;
}
function selecionarDiaAgenda(iso){ _agendaDiaSel=iso; renderAgendaGrade(); renderAgendaDia(); }
/* Mudar o dia selecionado ±1, sem sair da Agenda — substitui o antigo
   hojeMudarDia() da tela Hoje (suprimida; virou a própria Agenda no dia). */
function agendaMudarDia(delta){
  const d=new Date(_agendaDiaSel+'T00:00:00');
  d.setDate(d.getDate()+delta);
  const iso=isoLocal(d);
  if(d.getMonth()!==_agendaMes.getMonth()||d.getFullYear()!==_agendaMes.getFullYear()){ _agendaMes=new Date(d.getFullYear(),d.getMonth(),1); renderAgendaGrade(); }
  selecionarDiaAgenda(iso);
}

          '<span>'+esc(u)+(entry.obs?(' · '+esc(entry.obs)):'')+'</span>'+metSelo+badgeReg+badgeAtraso;
        acoesHtml='<div class="hoje-acoes">'+
          '<button class="btn sm" style="border-color:var(--green);color:var(--green)" onclick="abrirChamadaTurma(\''+conteudo.turmaId+'\')" title="Chamada — o essencial da aula, em 1 toque">📋 Chamada</button>'+
          '<button class="btn sm" style="border-color:var(--ochre);color:var(--ochre)" onclick="abrirNotasTurma(\''+conteudo.turmaId+'\')" title="Lançar nota direto, sem passar por outra tela">📝 Notas</button>'+
          '<button class="btn sm" style="border-color:var(--green);color:var(--green)" onclick="abrirModalRegistroCard(\''+tema.id+'\')" title="Registra uma nova aplicação desta aula — pode repetir quantas vezes quiser">✓ Registrar</button>'+
          '<button class="btn ghost sm" onclick="abrirTemaDoDia(\''+tema.id+'\')">abrir</button>'+

      } else {

/* A antiga aba "Hoje" foi suprimida (pedido da Malu) — v==='hoje' agora é
   só um sinônimo de "Agenda, aberta no dia de hoje", pra não ter que caçar
   toda chamada interna de setView('hoje')/_agendaOrigin='hoje' espalhada
   pelo código. viewHoje/renderHoje() ficam sem uso (não removidos agora,
   por segurança — várias chamadas ainda os referenciam indiretamente). */
function setView(v){
  fecharProjecao();
  const viewId = (v==='hoje') ? 'viewAgenda' : ('view'+v.charAt(0).toUpperCase()+v.slice(1));
  ['viewHoje','viewPainel','viewAcervo','viewAgenda','viewNotas','viewGestao','viewLinhaTempo'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.toggle('hidden', id!==viewId);
  });
  const tabId = (v==='hoje') ? 'tabHoje' : (v==='linhaTempo') ? 'tabLinhaTempo' : ('tab'+v.charAt(0).toUpperCase()+v.slice(1));
  ['tabHoje','tabPainel','tabAcervo','tabAgenda','tabNotas','tabGestao','tabLinhaTempo'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.toggle('active', id===tabId);
  });
  try{ localStorage.setItem('leciona_lastview', v); }catch(e){}
  if(v==='hoje'){ _agendaMes=new Date(); _agendaDiaSel=isoLocal(new Date()); _agendaGradeAberta=false; renderAgenda(); }
  if(v==='painel') renderPainel();
  if(v==='acervo') renderAcervo();
  if(v==='agenda') renderAgenda();
  if(v==='notas') renderNotas();
  if(v==='gestao') renderThemes();
  if(v==='linhaTempo') renderLinhaDoTempo();
}

/* ── Progresso por turma/bimestre ──────────────────────────────────────── */
function renderProgressoBar(){
  const box=document.getElementById('progressoBar'); if(!box||!scope.turma) return;
  const tu=turmas[scope.turma]||{};
  const abertas=ocorrenciasAbertas(scope.turma);
  const avisoAtraso = abertas.length ?
    '<div class="notas-progresso" style="border:1px solid #a8442f;background:#fdecea;margin-bottom:10px">'+
      '<div class="prog-titulo"><span>⚠ '+esc(turmaNome(tu))+' está atrasada — '+abertas.length+' ocorrência(s) sem resolver ('+abertas.map(o=>esc(OCORR_CATEGORIAS[o.categoria]||o.categoria)).join(', ')+')</span>'+
      '<button class="btn sm" style="border-color:#a8442f;color:#a8442f" onclick="abrirRecuperacao()">⚡ Gerar aula de recuperação</button></div>'+
    '</div>' : '';
  // Progresso do bimestre em si (aulas dadas/previstas — calendário e
  // chamadas reais, independe de quantos temas existem).
  const contBim=contarAulas(tu,scope.bim);
  const dadasBim=aulasDadas(tu,scope.bim);
  const pctBim=contBim.total>0?Math.min(100,Math.round(dadasBim/contBim.total*100)):0;
  const bimBarHtml = contBim.total>0 ?
    '<div class="prog-titulo prog-titulo-sm"><span>Aula '+dadasBim+'/'+contBim.total+' ('+pctBim+'%)</span></div>'+
    '<div class="prog-barra-wrap prog-barra-wrap-sm"><div class="prog-barra" style="width:'+pctBim+'%;background:#6a8fbf"></div></div>' : '';
  const notasFixadas=Object.values(notasGerais).filter(n=>n&&Array.isArray(n.turmaIds)&&n.turmaIds.includes(scope.turma)).sort((a,b)=>(b._ts||0)-(a._ts||0));
  const notasFixadasHtml = notasFixadas.length ?
    '<div class="notas-progresso">'+
      '<div class="prog-titulo"><span>📌 '+notasFixadas.length+' nota(s) fixada(s) nesta turma</span>'+
        '<button class="btn ghost sm" onclick="_agendaOrigin=\'gestao\';setView(\'agenda\')">Ver na Agenda</button></div>'+
      notasFixadas.slice(0,3).map(n=>'<div style="font-size:12px;color:var(--muted);white-space:pre-wrap;margin-bottom:4px">'+esc(n.texto.length>140?n.texto.slice(0,140)+'…':n.texto)+'</div>').join('')+
    '</div>' : '';
  const conts=conteudosDoScope();
  let totalTemas=0, temasComReg=0;
  const objContadores={};
  PROJ_ORDER.forEach(k=>objContadores[k]=0);
  conts.forEach(c=>{
    temasDoConteudo(c.id).forEach(t=>{
      totalTemas++;
      const regsT=registrosDoTema(t.id).filter(r=>r.turmaId===scope.turma);
      if(regsT.length) temasComReg++;
      regsT.forEach(r=>(r.objetos||[]).forEach(k=>{ if(k in objContadores) objContadores[k]++; }));
    });
  });
  if(!totalTemas){ box.innerHTML=avisoAtraso+(bimBarHtml?'<div class="notas-progresso">'+bimBarHtml+'</div>':'')+notasFixadasHtml; return; }
  const pct=Math.round(temasComReg/totalTemas*100);
  const objDots=PROJ_ORDER.map(k=>{
    const label=OBJ_DEFS.find(o=>o.k===k)?.label||k;
    const n=objContadores[k];
    return '<span class="prog-obj'+(n>0?' feito':'')+'" title="'+label+(n?' — '+n+'x':'')+'">'+label+(n?' ×'+n:'')+'</span>';
  }).join('');
  box.innerHTML=avisoAtraso+notasFixadasHtml+'<div class="notas-progresso">'+
    '<div class="prog-titulo">'+
      '<span>'+esc(turmaNome(tu))+' · '+esc(scope.bim)+' · '+temasComReg+'/'+totalTemas+' temas aplicados</span>'+
      '<button class="btn ghost sm" onclick="abrirRelatorioTurma()">📈 Relatório</button>'+
    '</div>'+
    '<div class="prog-barra-wrap"><div class="prog-barra" style="width:'+pct+'%"></div></div>'+
    bimBarHtml+
    '<div class="prog-objetos">'+objDots+'</div>'+
  '</div>';
}

/* ── Modal Relatório da Turma ──────────────────────────────────────────── */
function abrirRelatorioTurma(){
  const turmaId=scope.turma;
  if(!turmaId){ toast('Selecione uma turma.','err'); return; }
  // Turmas comparáveis (mesma disc+série)
  const disc=scope.disc, serie=scope.serie;
  const turmasComp=Object.values(turmas).filter(t=>t.disciplina===disc&&t.serie===serie);

  // Tabela 1: Objetos aplicados por tema × turma
  const conts=conteudosDoScope();
  let todosTemasNomes=[];
  conts.forEach(c=>temasDoConteudo(c.id).forEach(t=>todosTemasNomes.push({id:t.id,nome:t.nome})));

  const tHead='<tr><th>Tema</th>'+turmasComp.map(t=>'<th>'+esc(turmaNome(t))+'</th>').join('')+'</tr>';
  const tBody=todosTemasNomes.map(({id,nome})=>{
    return '<tr><td>'+esc(nome)+'</td>'+
      turmasComp.map(tu=>{
        // Encontrar tema equivalente nesta turma
        let temaEquiv=null;
        Object.values(conteudos).filter(c=>c.turmaId===tu.id&&c.bimestre===scope.bim).forEach(c=>{
          const temaNome=nome.toLowerCase().trim();
        const eq=temasDoConteudo(c.id).find(t=>(t.nome||'').toLowerCase().trim()===temaNome);
          if(eq) temaEquiv=eq;
        });
        if(!temaEquiv) return '<td style="color:var(--muted)">—</td>';
        const regs=registrosDoTema(temaEquiv.id).filter(r=>r.turmaId===tu.id);
        const objFeitos=[...new Set(regs.flatMap(r=>r.objetos||[]))];
        if(!regs.length) return '<td style="color:var(--muted)">○</td>';
        return '<td style="color:var(--green)">'+objFeitos.map(k=>OBJ_DEFS.find(o=>o.k===k)?.label||k).join(', ')+'</td>';
      }).join('')+
    '</tr>';
  }).join('');

  // Tabela 2: Médias por atividade × turma
  const atvAll=Object.values(atividadesCtrl).filter(av=>av.disciplina===disc&&av.bimestre===scope.bim);
  const tHead2='<tr><th>Atividade</th>'+turmasComp.map(t=>'<th>'+esc(turmaNome(t))+'</th>').join('')+'</tr>';
  const tBody2=atvAll.length?atvAll.map(av=>{
    const tp=ATIV_TIPOS[av.tipo]||{bg:'#fff'};
    return '<tr><td style="background:'+tp.bg+'">'+esc(av.nome)+'</td>'+
      turmasComp.map(tu=>{
        const m=mediaAtividade(av.id,tu.id);
        return '<td>'+(m!=null?'<strong style="color:'+(m>=6?'var(--green)':'var(--err)')+'">'+m.toFixed(1)+'</strong>':'—')+'</td>';
      }).join('')+
    '</tr>';
  }).join(''):'<tr><td colspan="99" style="color:var(--muted)">Nenhuma atividade no controle de notas para este bimestre.</td></tr>';

  const h='<div class="modal-bg" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal" style="max-width:760px">'+
    '<div class="modal-h"><h3>📈 Relatório — '+esc(scope.disc)+' · '+esc(serie)+' · '+esc(scope.bim)+'</h3></div>'+
    '<div class="modal-b">'+
      '<h4 style="margin-bottom:8px">Objetos aplicados por tema</h4>'+
      '<div style="overflow-x:auto"><table class="rel-table">'+tHead+tBody+'</table></div>'+
      '<h4 style="margin:16px 0 8px">Médias por atividade</h4>'+
      '<div style="overflow-x:auto"><table class="rel-table">'+tHead2+tBody2+'</table></div>'+
    '</div>'+
    '<div class="modal-f">'+
      '<button class="btn ghost" onclick="exportarRelatorioCSV()">↓ CSV</button>'+
      '<button class="btn ghost" onclick="closeModal()">Fechar</button>'+
    '</div></div></div>';
  const w=document.createElement('div'); w.id='modalWrap'; w.innerHTML=h; document.body.appendChild(w);
}

function exportarRelatorioCSV(){
  const disc=scope.disc, serie=scope.serie;
  const turmasComp=Object.values(turmas).filter(t=>t.disciplina===disc&&t.serie===serie);
  const atvAll=Object.values(atividadesCtrl).filter(av=>av.disciplina===disc&&av.bimestre===scope.bim);
  const header=['Atividade','Tipo',...turmasComp.map(t=>turmaNome(t))].map(csvCell).join(',');
  const rows=atvAll.map(av=>{
    const tp=ATIV_TIPOS[av.tipo]?.label||av.tipo;
    return [csvCell(av.nome),csvCell(tp),...turmasComp.map(tu=>{ const m=mediaAtividade(av.id,tu.id); return m!=null?m.toFixed(1):''; })].join(',');
  });
  const csv=header+'\n'+rows.join('\n');
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='Relatorio_'+esc(disc)+'_'+esc(serie)+'_'+isoLocal(new Date())+'.csv'; a.click();
  toast('CSV exportado.','ok');
}

/* ═══════════════════════════════════════════════════════════════════════
   ACERVO — Navegação global cross-turma

let _acervoBusca='', _acervoDisc='', _acervoSerie='', _acervoBim='';

/* ── Painel geral — visão de todas as turmas de uma vez ──────────────────
   Pensado pra quem tem muitas turmas/disciplinas: mostra % aplicado por
   turma num bimestre, destaca quem está atrasada (ocorrência sem resolver)
   e dá um atalho direto pra abrir aquela turma na Gestão. */
let _painelBim = null, _painelDisc = '', _painelOrigin = 'gestao';
let _painelExpandidas = new Set();
function togglePainelTurma(turmaId){
  if(_painelExpandidas.has(turmaId)) _painelExpandidas.delete(turmaId); else _painelExpandidas.add(turmaId);

}
/* Resumo de alunos+notas de uma turma, pro card expandido do Painel —
   junta o que já existe em mediaAluno/atividadeFeita sem duplicar lógica,
   só que numa lista compacta em vez de abrir a tabela inteira de Notas. */
function painelRosterHtml(turmaId){
  const als=alunosDaTurma(turmaId);
  const atvs=atividadesDaTurma(turmaId);
  if(!als.length) return '<p style="font-size:12.5px;color:var(--muted);margin:8px 0 0">Nenhum aluno cadastrado nesta turma.</p>';
  const linhasAl=als.map(a=>{
    const med=mediaAluno(a.id,atvs,turmaId);
    const feitas=atvs.filter(av=>av.tipo!=='casa'&&atividadeFeita(a.id,av)).length;
    const totalAtv=atvs.filter(av=>av.tipo!=='casa').length;
    return '<div class="painel-al-row" onclick="event.stopPropagation();abrirBoletimAluno(\''+a.id+'\')">'+
      '<span class="painel-al-nome">'+esc(a.nome)+'</span>'+
      '<span class="painel-al-atv">'+feitas+'/'+totalAtv+' atv.</span>'+
      '<span class="painel-al-med'+(med==null?'':med>=6?' ok':' baixa')+'">'+(med==null?'—':med.toFixed(1))+'</span>'+
    '</div>';
  }).join('');
  const medGeral=mediaGeralTurma(turmaId);
  return '<div class="painel-roster" onclick="event.stopPropagation()">'+
    '<div style="font-size:11.5px;color:var(--muted);margin:8px 0 4px">'+als.length+' aluno(s) · média da turma '+(medGeral!=null?medGeral.toFixed(1):'—')+' · '+atvs.filter(av=>av.tipo!=='casa').length+' atividade(s) lançada(s)</div>'+
    linhasAl+
  '</div>';
}
function renderPainel(){
  const box=document.getElementById('painelBody'); if(!box) return;
  if(_painelBim==null) _painelBim = bimAtual();
  const discs=[...new Set(turmasAtivas().map(t=>t.disciplina).filter(Boolean))].sort();

  const linhas = turmasAtivas()
    .filter(t=>!_painelDisc || t.disciplina===_painelDisc)
    .map(t=>{
      const conts = Object.values(conteudos).filter(c=>c.turmaId===t.id && c.bimestre===_painelBim);
      let total=0, comReg=0;
      conts.forEach(c=>{
        temasDoConteudo(c.id).forEach(tm=>{
          total++;
          if(registrosDoTema(tm.id).some(r=>r.turmaId===t.id)) comReg++;
        });
      });
      const pct = total ? Math.round(comReg/total*100) : null;
      const nAvulsas = Object.values(aulasAvulsas).filter(a=>a&&a.turmaId===t.id&&bimAtivoAgora(a.data)===_painelBim).length;
      return {t, total, comReg, pct, atrasada:turmaAtrasada(t.id), nAvulsas};
    })
    .sort((a,b)=>{
      if(a.atrasada!==b.atrasada) return a.atrasada?-1:1; // atrasadas primeiro
      const pa=a.pct==null?101:a.pct, pb=b.pct==null?101:b.pct; // sem conteúdo no fim
      return pa-pb;
    });

  const nAtrasadas = linhas.filter(l=>l.atrasada).length;
  const comConteudo = linhas.filter(l=>l.total>0);
  const pctMedio = comConteudo.length ? Math.round(comConteudo.reduce((s,l)=>s+l.pct,0)/comConteudo.length) : 0;

  let html = '<button class="btn ghost sm" style="margin-bottom:10px" onclick="setView(\''+_painelOrigin+'\')">← Voltar'+(_painelOrigin==='notas'?' pra Notas':' pra Gestão')+'</button>'+
    '<div class="acervo-filtros">'+
    '<select onchange="_painelDisc=this.value;renderPainel()"><option value="">Todas disciplinas</option>'+
      discs.map(d=>'<option value="'+esc(d)+'"'+(d===_painelDisc?' selected':'')+'>'+esc(d)+'</option>').join('')+
    '</select>'+
    '<select onchange="_painelBim=this.value;renderPainel()">'+
      BIMESTRES.map(b=>'<option value="'+esc(b)+'"'+(b===_painelBim?' selected':'')+'>'+esc(b)+'</option>').join('')+
    '</select>'+
  '</div>';

  html += '<div class="notas-stats">'+
    '<div class="stat-box"><strong>'+linhas.length+'</strong><span>turma(s)</span></div>'+
    '<div class="stat-box"><strong style="'+(nAtrasadas?'color:#a8442f':'')+'">'+nAtrasadas+'</strong><span>atrasada(s)</span></div>'+
    '<div class="stat-box"><strong>'+pctMedio+'%</strong><span>aplicado em média — '+esc(_painelBim)+'</span></div>'+
  '</div>';

  if(!linhas.length){ html += '<div class="empty"><p>Nenhuma turma cadastrada ainda.</p></div>'; box.innerHTML=html; return; }

  html += '<div class="card-list">'+linhas.map(l=>{
    const cor = l.atrasada ? '#a8442f' : (l.pct==null?'#ccc': l.pct<30?'#c47a3d':'#2f6b5e');
    const aberta=_painelExpandidas.has(l.t.id);
    return '<div class="mini-card" style="cursor:pointer" onclick="abrirTurmaNoPainel(\''+l.t.id+'\')">'+
      '<div class="row">'+
        '<b style="flex:1">'+esc(turmaNome(l.t))+' <span style="font-weight:400;color:var(--muted);font-size:12px">· '+esc(l.t.disciplina||'')+' · '+esc(l.t.unidade||'—')+'</span></b>'+
        (l.atrasada?'<span class="reg-badge" style="background:#a8442f">⚠ atrasada</span>':'')+
        (l.nAvulsas?'<span class="reg-badge" style="background:#7a4b8a" title="Aulas avulsas (sem tema) neste bimestre">✎ '+l.nAvulsas+' avulsa'+(l.nAvulsas>1?'s':'')+'</span>':'')+
        '<span style="font-size:13px;font-weight:600;min-width:42px;text-align:right">'+(l.pct==null?'—':l.pct+'%')+'</span>'+
        '<button class="btn ghost sm" style="margin-left:4px" onclick="event.stopPropagation();togglePainelTurma(\''+l.t.id+'\')" title="Ver alunos e notas desta turma">'+(aberta?'👥 ▲':'👥 ▾')+'</button>'+
      '</div>'+
      '<div class="prog-barra-wrap" style="margin:0"><div class="prog-barra" style="width:'+(l.pct||0)+'%;background:'+cor+'"></div></div>'+
      (aberta?painelRosterHtml(l.t.id):'')+
    '</div>';
  }).join('')+'</div>';

  box.innerHTML=html;
}
/* Pula direto pra uma turma (ajustando disciplina/unidade/série/bimestre
   junto, já que os 4 selects são em cascata) — usado pelo Painel e pela
   busca rápida, pra não ter que clicar select por select toda vez. */
function irParaTurma(turmaId, bimOverride){
  const t=turmas[turmaId]; if(!t) return;
  scope.disc=t.disciplina; scope.unidade=t.unidade; scope.serie=t.serie; scope.turma=turmaId; scope.bim=bimOverride||scope.bim;
  saveScope();
  setView('gestao');
  const selDisc=document.getElementById('selDisc'); if(selDisc) selDisc.value=scope.disc;
  refreshSeries();
  const selSerie=document.getElementById('selSerie'); if(selSerie) selSerie.value=scope.serie;
  const selUnidade=document.getElementById('selUnidade'); if(selUnidade) selUnidade.value=scope.unidade;
  refreshTurmas();
  const selTurma=document.getElementById('selTurma'); if(selTurma) selTurma.value=scope.turma;
  const selBim=document.getElementById('selBim'); if(selBim) selBim.value=scope.bim;
  renderThemes();
}
function abrirTurmaNoPainel(turmaId){ irParaTurma(turmaId, _painelBim); }
function _normBusca(s){ return (s||'').toLowerCase().replace(/[ºª°\s]/g,''); }
/* Busca geral — turmas, temas, alunos e conteúdos num campo só, pedido dela
   ("o botão busca podia buscar de tudo dentro do app"). Cada tipo abre no
   lugar certo, reaproveitando navegação que já existe (nada de rota nova). */
function buscarTurmaRapida(termo){
  const box=document.getElementById('buscaTurmaResultados'); if(!box) return;
  termo=(termo||'').trim().toLowerCase();
  if(!termo){ box.classList.add('hidden'); box.innerHTML=''; return; }
  const termoNorm=_normBusca(termo);

  const turmasR=turmasAtivas().filter(t=>
    (_normBusca(turmaNome(t)).includes(termoNorm) || (t.disciplina||'').toLowerCase().includes(termo) || (t.unidade||'').toLowerCase().includes(termo))
  ).slice(0,5).map(t=>({tipo:'turma', label:turmaNome(t), sub:(t.disciplina||'')+' · '+(t.unidade||''), acao:'selecionarTurmaRapida(\''+t.id+'\')'}));

  const temasR=Object.values(temas).filter(t=>t &&
    (_normBusca(t.nome||'').includes(termoNorm) || _normBusca(t.tituloExibicao||'').includes(termoNorm) || _normBusca(t.dcgo||'').includes(termoNorm))
  ).slice(0,5).map(t=>{ const tu=turmas[t.turmaId]||{}; return {tipo:'tema', label:t.tituloExibicao||t.nome, sub:turmaNome(tu)+(t.dcgo?(' · '+t.dcgo):''), acao:'abrirTemaRapido(\''+t.id+'\')'}; });

  const alunosR=Object.values(alunos).filter(a=>a && a.ativo!==false && _normBusca(a.nome||'').includes(termoNorm))
    .slice(0,5).map(a=>{ const tu=turmas[a.turmaId]||{}; return {tipo:'aluno', label:a.nome, sub:turmaNome(tu), acao:'abrirAlunoRapido(\''+a.id+'\')'}; });

  const conteudosR=Object.values(conteudos).filter(c=>c && _normBusca(c.nome||'').includes(termoNorm))
    .slice(0,5).map(c=>{ const tu=turmas[c.turmaId]||{}; return {tipo:'conteúdo', label:c.nome, sub:turmaNome(tu)+' · '+(c.bimestre||''), acao:'irParaTurmaRapido(\''+c.turmaId+'\',\''+esc(c.bimestre||'')+'\')'}; });

  const results=[...turmasR,...temasR,...alunosR,...conteudosR].slice(0,15);
  box.innerHTML = results.length
    ? results.map(r=>'<div class="busca-turma-item" onmousedown="'+r.acao+'"><span class="busca-tipo">'+esc(r.tipo)+'</span>'+esc(r.label)+'<small>'+esc(r.sub)+'</small></div>').join('')
    : '<div class="busca-turma-item" style="cursor:default;opacity:.6">Nada encontrado.</div>';
  box.classList.remove('hidden');
}
function fecharBuscaTurmaRapida(){
  const box=document.getElementById('buscaTurmaResultados'); if(box) box.classList.add('hidden');
}
function _limparBuscaRapida(){ const inp=document.getElementById('buscaTurmaRapida'); if(inp) inp.value=''; fecharBuscaTurmaRapida(); }

function limparDuplicatasAcervo(temaIds){
  const lista=temaIds.map(id=>temas[id]).filter(Boolean);
  if(lista.length<2){ toast('Nada para limpar.',''); return; }
  // pontua cada duplicata: aplicado > tem registro > mais campos preenchidos > mais recente
  const pontuar=t=>{
    let p=0;
    if((registrosDoTema(t.id)||[]).length) p+=1000;
    p += OBJ_DEFS.filter(o=>isFilled(t,o.k)).length*10;
    p += (t.updatedAt||0)/1e13; // desempate: mais recente pontua um pouco mais
    return p;
  };
  const ordenado=lista.slice().sort((a,b)=>pontuar(b)-pontuar(a));
  const manter=ordenado[0], apagar=ordenado.slice(1);
  const nomes=apagar.map(t=>t.nome).join(', ');
  if(!confirm('Manter 1 tema ("'+manter.nome+'") e apagar '+apagar.length+' duplicata(s)? Essa ação não pode ser desfeita.')) return;
  apagar.forEach(t=>removeTema(t.id));
  toast(apagar.length+' duplicata(s) removida(s). Mantido o mais completo.','ok');
  renderAcervoLista();
}
function renderAcervoLista(){
  const box=document.getElementById('acervoLista'); if(!box) return;

  // Coletar todos os temas de todas as turmas
  let itens=[];
  Object.values(turmas).forEach(tu=>{
    if(_acervoDisc && tu.disciplina!==_acervoDisc) return;
    if(_acervoSerie && tu.serie!==_acervoSerie) return;
    Object.values(conteudos).filter(c=>c.turmaId===tu.id&&(!_acervoBim||c.bimestre===_acervoBim)).forEach(c=>{
      temasDoConteudo(c.id).forEach(t=>{
        itens.push({t, tu, c});
      });
    });
  });

  // Filtro por busca com ranking
  if(_acervoBusca){
    itens=itens.map(x=>{
      const nome=(x.t.nome||'').toLowerCase();
      const dcgo=(x.t.dcgo||'').toLowerCase();
      const hab=(x.t.habilidade||'').toLowerCase();
      let score=0;
      if(nome.includes(_acervoBusca)) score+=nome.startsWith(_acervoBusca)?4:3;
      if(dcgo.includes(_acervoBusca)) score+=2;
      if(hab.includes(_acervoBusca)) score+=1;
      return {...x, score};
    }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  } else {
    itens=itens.sort((a,b)=>(a.t.nome||'').localeCompare(b.t.nome||''));
  }

  if(!itens.length){
    box.innerHTML='<div class="acervo-vazio"><p>'+(_acervoBusca?'Nenhum tema encontrado para "'+esc(_acervoBusca)+'"':'Nenhum tema no acervo ainda.')+'</p></div>';
    renderAcervoPreProntos(new Set());
    return;
  }

  // Agrupar temas com mesmo dcgo+nome (mesma "aula" em turmas diferentes)
  const grupos={};
  itens.forEach(x=>{
    const chave=(x.t.dcgo||'')+'::'+(x.t.nome||'');
    if(!grupos[chave]) grupos[chave]={nome:x.t.nome, dcgo:x.t.dcgo, hab:x.t.habilidade, disc:x.tu.disciplina, serie:x.tu.serie, bim:x.c.bimestre, turmas:[]};
    // Status dos objetos via registros
    const regs=registrosDoTema(x.t.id);
    const objsExec=new Set(regs.flatMap(r=>r.objetos||[]));
    const temConteudo=PROJ_ORDER.some(k=>isFilled(x.t,k));
    const aplicado=regs.length>0;
    grupos[chave].turmas.push({tu:x.tu, temaId:x.t.id, temConteudo, aplicado, objsExec, cont:x.c});
  });

  let html='<div style="font-size:12px;color:var(--muted);margin-bottom:10px">'+Object.keys(grupos).length+' tema(s)</div>';

  Object.values(grupos).forEach(g=>{
    // Agrupa por turma real (uma turma pode ter mais de um tema duplicado
    // no mesmo grupo — nesse caso mostra 1 tag só, com contador, em vez de
    // repetir a etiqueta idêntica várias vezes)
    const porTurma={};
    g.turmas.forEach(entry=>{
      const tid=entry.tu.id;
      if(!porTurma[tid]) porTurma[tid]={tu:entry.tu, n:0, aplicado:false, temConteudo:false, temaIds:[]};
      porTurma[tid].n++;
      porTurma[tid].temaIds.push(entry.temaId);
      if(entry.aplicado) porTurma[tid].aplicado=true;
      if(entry.temConteudo) porTurma[tid].temConteudo=true;
    });
    // detecta se o mesmo nome de turma (ex.: "1ªA") aparece em mais de uma
    // escola/unidade diferente — só aí mostra a unidade, pra não poluir à toa
    const nomesContagem={};
    Object.values(porTurma).forEach(p=>{ const n=turmaNome(p.tu); nomesContagem[n]=(nomesContagem[n]||0)+1; });
    const precisaUnidade=nome=>nomesContagem[nome]>1;
    const tuHtml=Object.values(porTurma).map(p=>{
      const cls=p.aplicado?'aplicado':p.temConteudo?'tem-conteudo':'';
      const nome=turmaNome(p.tu);
      const rotulo=precisaUnidade(nome) ? (nome+' · '+esc(p.tu.unidade||'?')) : nome;
      const dupAviso = p.n>1 ? (' <span class="dup-fix" onclick="event.stopPropagation();limparDuplicatasAcervo([\''+p.temaIds.join('\',\'')+'\'])" title="Clique para manter só o melhor e apagar os outros '+(p.n-1)+' duplicado(s)">⚠️×'+p.n+'</span>') : '';
      const title=(p.aplicado?'✓ aplicado':(p.temConteudo?'tem conteúdo':'vazio'))+' — '+esc(p.tu.unidade||'')+(p.n>1?' — clique no aviso ⚠️ para limpar as duplicatas':'');
      return '<span class="acervo-tu '+cls+'" title="'+title+'">'+esc(rotulo)+dupAviso+'</span>';
    }).join('');

    // Objetos executados (union de todas as turmas)
    const todosObjs=new Set(g.turmas.flatMap(e=>[...e.objsExec]));
    const objDotsHtml=PROJ_ORDER.map(k=>{
      const label=OBJ_DEFS.find(o=>o.k===k)?.label||k;
      const feito=todosObjs.has(k);
      return '<span class="obj-dot'+(feito?' feito':'')+'" title="'+label+(feito?' — executado':'')+'">'+label+'</span>';
    }).join('');

    // Ações: usa primeira turma do grupo como contexto
    const primeiro=g.turmas[0];
    const tuId=primeiro.tu.id, tId=primeiro.temaId;

    html+='<div class="acervo-card">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
        '<div style="flex:1">'+
          '<h4>'+esc(g.nome)+'</h4>'+
          '<div class="acervo-meta">'+esc(g.disc)+' · '+esc(g.serie)+' · '+esc(g.bim)+(g.dcgo?' · '+esc(g.dcgo):'')+'</div>'+
          '<div class="acervo-turmas">'+tuHtml+'</div>'+
          '<div class="obj-status-row">'+objDotsHtml+'</div>'+
        '</div>'+
        '<div class="acervo-acoes">'+
          '<button class="btn ghost sm" onclick="acervoAbrir(this.dataset.tu,this.dataset.ti)" data-tu="'+tuId+'" data-ti="'+tId+'">abrir</button>'+
          '<button class="btn ghost sm" onclick="acervoProjetar(this.dataset.ti)" data-ti="'+tId+'">projetar</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  });

  box.innerHTML=html;
  renderAcervoPreProntos(new Set(Object.keys(grupos)));
}

/* ── Pré-prontos ainda não usados em nenhuma turma ────────────────────────
   O Acervo, até aqui, só mostra temas que já foram criados de verdade em
   alguma turma. Mas boa parte do conteúdo pré-pronto (matriz + subtemas do
   catálogo, com PREBUILT_OBJ já escrito) nunca chegou a virar tema em
   turma nenhuma — fica invisível. Esta seção lista esse restante e deixa
   aplicar direto numa turma, sem passar pelo "Partir da matriz" turma por
   turma. */
const PREBUILT_DISCS = Object.keys(PREBUILT_DISC_FILE);
let _acervoPreProntoAtual = [];
function candidatosPreProntoDoRecorte(disc, serie, bim){
  const arr = MATRIZ[disc+'|'+serie+'|'+bim] || [];
  const out = [];
  arr.forEach(it=>{
    const nomeHab = it.t||it.h||it.c;
    if(PREBUILT_OBJ[nomeHab]) out.push({nome:nomeHab, dcgo:it.c, habilidade:it.h, disc, serie, bim});
    (catalogoSubtemas(it, disc)||[]).forEach(sb=>{
      const nome=(sb&&sb.s)||sb;
      if(nome && PREBUILT_OBJ[nome]) out.push({nome, dcgo:it.c, habilidade:it.h, disc, serie, bim});
    });
  });
  return out;
}
async function renderAcervoPreProntos(existentesKeys){
  const box=document.getElementById('acervoPrePronto'); if(!box) return;
  const discsAlvo = (_acervoDisc ? [_acervoDisc] : PREBUILT_DISCS).filter(d=>PREBUILT_DISC_FILE[d]);
  if(!discsAlvo.length){ box.innerHTML=''; return; }
  box.innerHTML='<div class="acervo-preprontos-head">📦 carregando pré-prontos…</div>';
  await Promise.all(discsAlvo.map(ensurePrebuiltDiscLoaded));
  const combos=[];
  Object.keys(MATRIZ).forEach(k=>{
    const [d,s,b]=k.split('|');
    if(!discsAlvo.includes(d)) return;
    if(_acervoSerie && s!==_acervoSerie) return;
    if(_acervoBim && b!==_acervoBim) return;
    combos.push([d,s,b]);
  });
  let candidatos=[];
  combos.forEach(([d,s,b])=>candidatos.push(...candidatosPreProntoDoRecorte(d,s,b)));
  candidatos = candidatos.filter(c=>!existentesKeys.has(c.dcgo+'::'+c.nome));
  const vistos=new Set();
  candidatos = candidatos.filter(c=>{ const k=c.disc+'|'+c.serie+'|'+c.bim+'|'+c.nome; if(vistos.has(k))return false; vistos.add(k); return true; });
  if(_acervoBusca){
    candidatos = candidatos.filter(c=>c.nome.toLowerCase().includes(_acervoBusca)||(c.dcgo||'').toLowerCase().includes(_acervoBusca)||(c.habilidade||'').toLowerCase().includes(_acervoBusca));
  }
  candidatos.sort((a,b)=>a.nome.localeCompare(b.nome));
  _acervoPreProntoAtual = candidatos;
  if(!candidatos.length){ box.innerHTML=''; return; }
  let html='<div class="acervo-preprontos-head">📦 Pré-prontos disponíveis, ainda não usados em nenhuma turma ('+candidatos.length+')</div>';
  html += candidatos.map((c,i)=>
    '<div class="acervo-card pronto">'+
      '<div style="flex:1">'+
        '<h4>'+esc(c.nome)+' <span class="acervo-badge-pronto">pré-pronto</span></h4>'+
        '<div class="acervo-meta">'+esc(c.disc)+' · '+esc(c.serie)+' · '+esc(c.bim)+(c.dcgo?' · '+esc(c.dcgo):'')+'</div>'+
      '</div>'+
      '<div class="acervo-acoes"><button class="btn ghost sm" onclick="abrirUsarPrePronto('+i+')">usar numa turma…</button></div>'+
    '</div>'
  ).join('');
  box.innerHTML=html;
}
function abrirUsarPrePronto(i){
  const c=_acervoPreProntoAtual[i]; if(!c) return;
  const turmasDisc=Object.values(turmas).filter(t=>t&&t.disciplina===c.disc&&t.serie===c.serie).sort((a,b)=>turmaNomeEscola(a).localeCompare(turmaNomeEscola(b)));
  if(!turmasDisc.length){ toast('Nenhuma turma de '+c.disc+' · '+c.serie+' cadastrada ainda. Crie a turma primeiro.','err'); return; }
  const opts=turmasDisc.map(t=>'<option value="'+t.id+'">'+esc(turmaNomeEscola(t))+'</option>').join('');
  const html='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:420px">'+
    '<div class="modal-h"><h3>Usar "'+esc(c.nome.slice(0,40))+'"</h3></div>'+
    '<div class="modal-b"><small>'+esc(c.disc)+' · '+esc(c.serie)+' · '+esc(c.bim)+(c.dcgo?' · '+esc(c.dcgo):'')+'</small>'+
    '<div class="field" style="margin-top:10px"><label>Em qual turma</label><select id="upTurma">'+opts+'</select></div>'+
    '</div><div class="modal-f"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="confirmarUsarPrePronto('+i+')">Adicionar</button></div></div></div>';
  const w=document.createElement('div'); w.id='modalWrap'; w.innerHTML=html; document.body.appendChild(w);
}
/* Cria (ou reaproveita, se já existir) um tema a partir de um candidato
   pré-pronto da matriz, numa turma. Compartilhado entre o Acervo e a
   Gestão — mesmo critério de dedup do criarPartirMatriz(): nunca duplica
   se já existe um tema com mesmo dcgo+nome neste conteúdo. */
function criarTemaAPartirDePrePronto(c, turmaId){
  let cont=Object.values(conteudos).find(co=>co.turmaId===turmaId&&co.bimestre===c.bim&&co.nome==='Matriz — '+c.bim);
  if(!cont){
    const contsDaTurmaBim=Object.values(conteudos).filter(co=>co.turmaId===turmaId&&co.bimestre===c.bim);
    const ordemCont=contsDaTurmaBim.length?Math.max(...contsDaTurmaBim.map(co=>co.ordem||0))+1:0;
    cont={id:uid(),disciplina:c.disc,serie:c.serie,turmaId,bimestre:c.bim,nome:'Matriz — '+c.bim,resumo:'',ordem:ordemCont,updatedAt:Date.now()};
    persistConteudo(cont);
  }
  const jaExiste=temasDoConteudo(cont.id).find(t=>t.dcgo===c.dcgo&&t.nome===String(c.nome).slice(0,80));
  const tema=jaExiste||blankTema(cont.id,{turmaId,disciplina:c.disc,serie:c.serie,bimestre:c.bim,nome:String(c.nome).slice(0,80),dcgo:c.dcgo,habilidade:c.habilidade,resumo:c.habilidade,ordem:nextOrdemTema(cont.id)});
  applyPrebuiltIfEmpty(tema);
  if(!jaExiste) persistTema(tema);
  return tema;
}
function confirmarUsarPrePronto(i){
  const c=_acervoPreProntoAtual[i]; if(!c) return;
  const turmaId=(document.getElementById('upTurma')||{}).value; if(!turmaId) return;
  criarTemaAPartirDePrePronto(c, turmaId);
  closeModal();
  toast('"'+c.nome+'" adicionado à turma.','ok');
  renderAcervoLista();
}

function acervoAbrir(turmaId, temaId){
  const tu=turmas[turmaId]; if(!tu) return;
  // Ir para gestão na turma certa e abrir o tema
  scope.disc=tu.disciplina; scope.serie=tu.serie; scope.unidade=tu.unidade;
  const cont=Object.values(conteudos).find(c=>c.turmaId===turmaId);
  if(cont) scope.bim=cont.bimestre;
  saveScope();
  setView('gestao');
  setTimeout(()=>{ renderThemes(); setTimeout(()=>abrirEditor(temaId), 200); }, 100);
}
function acervoProjetar(temaId){
  const t=temas[temaId]; if(!t) return;
  projetarTemaId(temaId);
}

// ── Persist ──────────────────────────────────────────────────────────────
function persistAluno(a){ a._ts=Date.now(); alunos[a.id]=a; lsSet(LS_ALUNOS,JSON.stringify(alunos)); if(DB) DB.ref('leciona/alunos/'+a.id).set(a).catch(e=>console.warn(e)); }
function persistAtivCtrl(av){ av._ts=Date.now(); atividadesCtrl[av.id]=av; lsSet(LS_ATVCTRL,JSON.stringify(atividadesCtrl)); if(DB) DB.ref('leciona/atividades_ctrl/'+av.id).set(av).catch(e=>console.warn(e)); }
function persistNota(n){ n._ts=Date.now(); notasCtrl[n.id]=n; lsSet(LS_NOTAS,JSON.stringify(notasCtrl)); if(DB) DB.ref('leciona/notas_ctrl/'+n.id).set(n).catch(e=>console.warn(e)); }
function removerAluno(id){
  const al=alunos[id]; if(!al) return;
  if(!confirm('Remover "'+(al.nome||'este aluno')+'"? As notas lançadas para ele também serão removidas. Não pode ser desfeito.')) return;
  delete alunos[id];
  lsSet(LS_ALUNOS,JSON.stringify(alunos));
  if(DB) DB.ref('leciona/alunos/'+id).remove().catch(e=>toast('⚠ Removido localmente, mas falhou ao remover no Firebase: '+e.message,'err'));
  // notas lançadas pra esse aluno ficariam órfãs (sem aluno pra aparecer) — limpa junto
  const notasApagar=Object.keys(notasCtrl).filter(nid=>notasCtrl[nid].alunoId===id);
  notasApagar.forEach(nid=>{ delete notasCtrl[nid]; if(DB) DB.ref('leciona/notas_ctrl/'+nid).remove().catch(()=>{}); });
  if(notasApagar.length) lsSet(LS_NOTAS,JSON.stringify(notasCtrl));
  renderNotas();
  toast('Aluno removido.','ok');
}
/* Outros registros de aluno (um por turma) que são a MESMA pessoa —
   ligados pela matrícula do SIAP, agora confiável depois da recuperação
   de 29-30/07/2026. Sem matrícula, o aluno só existe nesta turma mesmo. */
function alunosMesmaMatricula(matricula, excludeId){
  if(!matricula) return [];
  return Object.values(alunos).filter(a=>a && a.matricula===matricula && a.id!==excludeId && a.ativo!==false);
}
function atividadeFeita(alunoId, av){
  const n=notaDoAluno(alunoId, av.id);
  if(av.checklist===true) return !!(n && n.valor>0);
  return !!(n && n.valor!=null);
}
/* Boletim individual — clique no nome em Notas. Junta editar dados (que já
   existia) com a visão de todas as turmas em que o aluno está matriculado
   e o que já foi feito/falta em cada uma — pedido dela, espelhando o
   boletim do sistema antigo de controle de notas. */
function abrirBoletimAluno(id){
  const al=alunos[id]; if(!al) return;
  const irmaos=alunosMesmaMatricula(al.matricula, id);
  const todos=[al, ...irmaos];
  const turmasHtml=todos.map(a=>{
    const tu=turmas[a.turmaId]||{};
    const atvs=atividadesDaTurma(a.turmaId);
    const med=mediaAluno(a.id,atvs,a.turmaId);
    const medCls=med==null?'':(med>=6?'aprovado':'reprovado');
    const feitas=atvs.filter(av=>atividadeFeita(a.id,av));
    const faltando=atvs.filter(av=>!atividadeFeita(a.id,av));
    return '<div class="meta-block">'+
      '<h4>'+esc(turmaNomeCompleto(tu))+'</h4>'+
      '<div style="display:flex;gap:14px;align-items:baseline;margin-bottom:8px">'+
        '<span class="nota-media '+medCls+'" style="font-size:15px">'+(med!=null?med.toFixed(1):'-')+'</span>'+
        '<span style="font-size:11.5px;color:var(--muted)">qualitativa '+notaQualitativa(a.id,a.turmaId).toFixed(1)+'</span>'+
      '</div>'+
      (atvs.length ? (
        '<div style="font-size:12.5px;color:var(--green);margin-bottom:3px">✓ '+feitas.length+' feita(s)'+(feitas.length?': '+esc(feitas.map(av=>av.nome).join(', ')):'')+'</div>'+
        '<div style="font-size:12.5px;color:var(--ochre)">○ '+faltando.length+' faltando'+(faltando.length?': '+esc(faltando.map(av=>av.nome).join(', ')):'')+'</div>'
      ) : '<p style="color:var(--muted);font-size:12.5px;margin:0">Nenhuma atividade lançada nesta turma ainda.</p>')+
    '</div>';
  }).join('');
  const h='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:520px;max-height:82vh;overflow:auto">'+
    '<div class="modal-h"><h3>📋 Boletim — '+esc(al.nome)+'</h3></div>'+
    '<div class="modal-b">'+
      '<div class="field"><label>Nome completo</label><input id="alunoEdNome" value="'+esc(al.nome||'')+'" autofocus></div>'+
      '<div class="field"><label>Número (opcional)</label><input id="alunoEdNum" type="number" value="'+esc(al.numero!=null?String(al.numero):'')+'" placeholder="ex.: 1"></div>'+
      '<div class="field"><label>Adaptação curricular (perfis que este aluno precisa)</label><div class="gt-checks">'+
        ADAPT_PERFIS.map(pf=>'<label class="check"><input type="checkbox" name="alunoPerf" value="'+pf.k+'"'+((al.perfisAdaptacao||[]).includes(pf.k)?' checked':'')+'> '+esc(pf.label)+'</label>').join('')+
      '</div><small style="color:var(--muted)">Marcando aqui, os temas dessa turma passam a avisar quando faltar adaptação pra esse perfil.</small></div>'+
      (al.matricula?'<p style="font-size:11px;color:var(--muted);margin:-4px 0 14px">Matrícula '+esc(al.matricula)+' · matriculado em '+todos.length+' turma(s)</p>':'<p style="font-size:11px;color:var(--muted);margin:-4px 0 14px">Sem matrícula vinculada — não é possível ver outras turmas dele automaticamente.</p>')+
      '<div class="sep"></div>'+
      '<div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px">Turmas e desempenho</div>'+
      turmasHtml+
    '</div>'+

    '<button class="btn primary" onclick="salvarEdicaoAluno(\''+id+'\')">Salvar dados</button></div></div></div>';
  const w=document.createElement('div'); w.id='modalWrap'; w.innerHTML=h; document.body.appendChild(w);
}
function abrirEditarAluno(id){
  const al=alunos[id]; if(!al) return;
  const h='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:380px">'+

function salvarEdicaoAluno(id){
  const al=alunos[id]; if(!al) return;
  const nome=(document.getElementById('alunoEdNome')?.value||'').trim();
  const numStr=document.getElementById('alunoEdNum')?.value;
  if(!nome){ toast('Digite o nome do aluno.','err'); return; }
  al.nome=nome;
  al.numero=numStr?parseInt(numStr,10):null;
  al.perfisAdaptacao=[...document.querySelectorAll('input[name=alunoPerf]:checked')].map(c=>c.value);
  persistAluno(al);
  closeModal();
  renderNotas();
  toast('Aluno atualizado.','ok');

/* Perfis de adaptação que essa turma precisa garantir em TODO tema.
   Fonte principal: os perfis JÁ GERADOS em qualquer tema desta turma —
   isso já foi decidido e feito numa sessão anterior, cruzando com o SIAP,
   então é evidência real de necessidade, sem pedir pra ela marcar de novo.
   O checkbox no boletim do aluno é só um reforço/atalho pra quando um
   aluno novo chegar e ainda não tiver nenhuma adaptação gerada pra ele. */
function perfisNecessariosDaTurma(turmaId){
  const set=new Set();
  alunosDaTurma(turmaId).forEach(a=>(a.perfisAdaptacao||[]).forEach(p=>set.add(p)));
  Object.values(temas).filter(t=>t&&t.turmaId===turmaId&&t.adaptado).forEach(t=>{
    Object.keys(t.adaptado).forEach(k=>{
      const v=t.adaptado[k];
      if(v&&Object.keys(v).length>0) set.add(k);
    });
  });
  return [...set];
}

// ── Helpers ───────────────────────────────────────────────────────────────
function alunosDaTurma(turmaId){ return Object.values(alunos).filter(a=>a.turmaId===turmaId&&a.ativo!==false).sort((a,b)=>(a.numero||999)-(b.numero||999)||(a.nome||'').localeCompare(b.nome||'')); }
function atividadesDaTurma(turmaId){
  return Object.values(atividadesCtrl)
    .filter(av=>av.turmaIds&&av.turmaIds.includes(turmaId))
    .sort((a,b)=>(a.data||'').localeCompare(b.data||'')||(a.nome||'').localeCompare(b.nome||''));
}
function notaDoAluno(alunoId,atividadeId){ return Object.values(notasCtrl).find(n=>n.alunoId===alunoId&&n.atividadeId===atividadeId)||null; }
function mediaAtividade(atividadeId,turmaId){
  const av=atividadesCtrl[atividadeId]||{};
  const als=alunosDaTurma(turmaId);
  if(!als.length) return null;
  let soma=0;
  als.forEach(al=>{
    const n=notaDoAluno(al.id,atividadeId);
    if(av.checklist===true){
      soma += (n && n.valor>0) ? 10 : 0;
    } else {
      if(n && n.valor!=null){ const max=av.valorMax||10; soma += max>0?(n.valor/max)*10:n.valor; }
      // sem nota = 0, já incluído por não somar nada
    }
  });
  return soma/als.length;
}
// Faixa que mostra, por tema, os objetos de aula já aplicados nesta turma,
// cada um na cor do padrão estabelecido (OBJ_TIPO_PADRAO → ATIV_TIPOS).
function renderFaixaAplicados(turmaId){
  const regs=Object.values(registros).filter(r=>r.turmaId===turmaId && (scope.bim? (temas[r.temaId]&&temas[r.temaId].bimestre===scope.bim):true));
  if(!regs.length) return '';
  // agrupa por tema: união dos objetos aplicados
  const porTema={};
  regs.forEach(r=>{
