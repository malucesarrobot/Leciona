/* Popula TODAS as turmas, em TODOS os bimestres que a matriz cobre, de uma vez:
   cria os temas que faltam (a partir da MATRIZ) e já aplica o pré-pronto
   correspondente na hora, sem IA e sem precisar abrir turma por turma.
   Não sobrescreve tema que já tem conteúdo. */
function chaveTurma(t){
  if(!t) return '';
  if(t._auto) return '__auto__'+t.id; // registro especial (fallback) — nunca funde com nada
  const raw=turmaNome(t).toUpperCase();
  const m=raw.match(/(\d+)\s*[ºO°]?\s*([A-Z])(?![A-Z])/);
  const serieLetra = m ? (m[1]+m[2]) : raw.replace(/[^A-Z0-9]/g,'');
  const unidade=(t.unidade||'').trim().toUpperCase();
  return (t.disciplina||'')+'|'+serieLetra+'|'+unidade;
}
async function limparTurmasDuplicadas(silent){
  if(!silent){
    if(!confirm('Isso vai unificar turmas duplicadas (mesmo nome e mesma escola), movendo todo o conteúdo pra uma só e apagando as cópias vazias. Continuar?')) return;
    closeModal();
    toast('Verificando turmas duplicadas…','');
  }

  const grupos={};
  Object.values(turmas).forEach(t=>{ if(!t) return; const k=chaveTurma(t); (grupos[k]=grupos[k]||[]).push(t); });

  let turmasRemovidas=0, gruposAfetados=0;
  const contsAtualizados=[], temasAtualizados=[], regsAtualizados=[], alunosAtualizados=[], notasAtualizadas=[], ativsAtualizadas=[], turmasApagar=[];
  const chaves=Object.keys(grupos);
  for(let i=0;i<chaves.length;i++){
    const lista=grupos[chaves[i]];
    if(lista.length>1){
      gruposAfetados++;
      const pontuar=t=>{
        let p = t.letra ? 1000 : 0; // formato novo (serie+letra) tem prioridade sobre nome digitado à mão
        p += Object.values(alunos).filter(a=>a.turmaId===t.id).length*50; // turma com alunos de verdade tem prioridade
        p += Object.values(conteudos).filter(c=>c.turmaId===t.id).length*10;
        return p;
      };
      const ordenado=lista.slice().sort((a,b)=>pontuar(b)-pontuar(a));
      const manter=ordenado[0];
      ordenado.slice(1).forEach(perdedor=>{
        Object.values(conteudos).forEach(c=>{ if(c.turmaId===perdedor.id){ c.turmaId=manter.id; contsAtualizados.push(c); } });
        Object.values(temas).forEach(t=>{ if(t.turmaId===perdedor.id){ t.turmaId=manter.id; temasAtualizados.push(t); } });
        // registros de aplicação, alunos, notas e atividades de controle também
        // referenciam turmaId/turmaIds — sem migrar isso junto, ficam órfãos
        // apontando pra uma turma apagada (alunos inteiros "somem" da tela de Notas).
        Object.values(registros).forEach(r=>{ if(r.turmaId===perdedor.id){ r.turmaId=manter.id; regsAtualizados.push(r); } });
        Object.values(alunos).forEach(a=>{ if(a.turmaId===perdedor.id){ a.turmaId=manter.id; alunosAtualizados.push(a); } });
        Object.values(notasCtrl).forEach(n=>{ if(n.turmaId===perdedor.id){ n.turmaId=manter.id; notasAtualizadas.push(n); } });
        Object.values(atividadesCtrl).forEach(av=>{
          if((av.turmaIds||[]).includes(perdedor.id)){
            av.turmaIds=av.turmaIds.filter(tid=>tid!==perdedor.id);
            if(!av.turmaIds.includes(manter.id)) av.turmaIds.push(manter.id);
            ativsAtualizadas.push(av);
          }
        });
        turmasApagar.push(perdedor.id);
        turmasRemovidas++;
      });
    }
    if(i>0 && i%200===0) await new Promise(r=>setTimeout(r,0));
  }

  if(!turmasRemovidas){ if(!silent) toast('Nenhuma turma duplicada encontrada.','ok'); return {turmasRemovidas:0}; }

  turmasApagar.forEach(id=>delete turmas[id]);
  _temaIdx=null;
  lsSet(LS_TURMAS, JSON.stringify(turmas));
  lsSet(LS_CONT, JSON.stringify(conteudos));
  lsSet(LS_TEMAS, JSON.stringify(temas));
  if(regsAtualizados.length) lsSet(LS_REG, JSON.stringify(registros));
  if(alunosAtualizados.length) lsSet(LS_ALUNOS, JSON.stringify(alunos));
  if(notasAtualizadas.length) lsSet(LS_NOTAS, JSON.stringify(notasCtrl));
  if(ativsAtualizadas.length) lsSet(LS_ATVCTRL, JSON.stringify(atividadesCtrl));
  if(DB){
    const updates={};
    turmasApagar.forEach(id=>updates['leciona/turmas/'+id]=null);
    contsAtualizados.forEach(c=>updates['leciona/conteudos/'+c.id]=c);
    temasAtualizados.forEach(t=>updates['leciona/temas/'+t.id]=t);
    regsAtualizados.forEach(r=>updates['leciona/registros/'+r.id]=r);
    alunosAtualizados.forEach(a=>updates['leciona/alunos/'+a.id]=a);
    notasAtualizadas.forEach(n=>updates['leciona/notas_ctrl/'+n.id]=n);
    ativsAtualizadas.forEach(av=>updates['leciona/atividades_ctrl/'+av.id]=av);
    DB.ref().update(updates).catch(e=>toast('⚠ Falha ao sincronizar com o Firebase (mantido localmente). '+e.message,'err'));
  }
  renderThemes();
  if(!silent) toast(turmasRemovidas+' turma(s) duplicada(s) unificada(s) em '+gruposAfetados+' grupo(s). Agora rode "Limpar duplicatas (banco inteiro)" de novo, pra juntar os temas que ficaram repetidos na turma unificada.','ok');
  return {turmasRemovidas,gruposAfetados};
}
/* Corrige temas cujo turmaId ficou desalinhado do conteudoId real (sobra de
   fusões de turma antigas que não migraram esse campo em todos os temas —
   o conteudoId é a fonte confiável, então realinha turmaId a partir dele).
   Não apaga nada, só corrige a referência; roda ANTES de limparDuplicatasGeral
   pra que ela consiga agrupar corretamente por turma+código. */
async function corrigirTurmaIdTemas(silent){
  if(!silent){
    if(!confirm('Isso vai corrigir o turmaId de temas cujo campo ficou desalinhado do conteúdo real onde estão (sobra de fusões antigas de turma). Não apaga nada, só realinha a referência. Continuar?')) return;
    closeModal();
    toast('Corrigindo referências… não feche a aba.','');
  }
  let corrigidos=0;
  const temasCorrigidos=[];
  Object.values(temas).forEach(t=>{
    if(!t||!t.conteudoId) return;
    const c=conteudos[t.conteudoId];
    if(!c) return;
    if(t.turmaId!==c.turmaId){ t.turmaId=c.turmaId; corrigidos++; temasCorrigidos.push(t); }
  });
  if(!corrigidos){ if(!silent) toast('Nenhuma referência desalinhada encontrada.','ok'); return {corrigidos:0}; }
  _temaIdx=null;
  lsSet(LS_TEMAS, JSON.stringify(temas));
  if(DB){
    const updates={};
    temasCorrigidos.forEach(t=>updates['leciona/temas/'+t.id+'/turmaId']=t.turmaId);
    DB.ref().update(updates).catch(e=>toast('⚠ Falha ao sincronizar com o Firebase (mantido localmente). '+e.message,'err'));
  }
  renderThemes();
  if(!silent) toast(corrigidos+' tema(s) com turmaId corrigido. Agora rode "Limpar duplicatas (banco inteiro)" pra juntar os que ficaram repetidos.','ok');
  return {corrigidos};
}
async function limparDuplicatasGeral(silent){
  if(typeof PREBUILT_OBJ==='undefined'){ if(!silent) toast('Aguarde o carregamento terminar e tente de novo.','err'); return; }
  if(!silent){
    if(!confirm('Isso vai varrer TODOS os seus temas, agrupar por turma+código DC-GO, manter só o mais completo de cada grupo (priorizando o que já foi aplicado em sala) e apagar os duplicados. Não pode ser desfeito. Continuar?')) return;
    closeModal();
    toast('Varrendo o banco inteiro… não feche a aba.','');
  }

  const grupos={};
  Object.values(temas).forEach(t=>{
    if(!t||!t.dcgo||!t.turmaId) return;
    const chave=t.turmaId+'::'+t.dcgo;
    (grupos[chave]=grupos[chave]||[]).push(t);
  });
  const pontuar=t=>{
    let p=0;
    if((registrosDoTema(t.id)||[]).length) p+=1000;
    p += OBJ_DEFS.filter(o=>isFilled(t,o.k)).length*10;
    p += (t.updatedAt||0)/1e13;
    return p;
  };
  const idsParaApagar=[]; let gruposAfetados=0;
  const chaves=Object.keys(grupos);
  for(let i=0;i<chaves.length;i++){
    const lista=grupos[chaves[i]];
    if(lista.length>1){
      gruposAfetados++;
      const ordenado=lista.slice().sort((a,b)=>pontuar(b)-pontuar(a));
      ordenado.slice(1).forEach(t=>idsParaApagar.push(t.id));
    }
    if(i>0 && i%200===0){ if(!silent) toast('Varrendo… '+i+'/'+chaves.length+' grupos.',''); await new Promise(r=>setTimeout(r,0)); }
  }

  if(!idsParaApagar.length){ if(!silent) toast('Nenhuma duplicata encontrada — está tudo limpo.','ok'); return {idsParaApagar:[]}; }

  // registros de aplicação do tema perdedor ficariam órfãos (apontando pra um
  // tema que não existe mais) se não forem removidos junto.
  const idsSet=new Set(idsParaApagar);
  const regsApagar=Object.values(registros).filter(r=>idsSet.has(r.temaId));

  idsParaApagar.forEach(id=>{ delete temas[id]; });
  regsApagar.forEach(r=>{ delete registros[r.id]; });
  _temaIdx=null;
  lsSet(LS_TEMAS, JSON.stringify(temas));
  if(regsApagar.length) lsSet(LS_REG, JSON.stringify(registros));
  if(DB){
    const updates={};
    idsParaApagar.forEach(id=>updates['leciona/temas/'+id]=null); // null apaga no Firebase, em lote
    regsApagar.forEach(r=>updates['leciona/registros/'+r.id]=null);
    DB.ref().update(updates).catch(e=>toast('⚠ Falha ao sincronizar exclusões com o Firebase (removido localmente). '+e.message,'err'));
  }
  renderThemes();
  if(!silent) toast(idsParaApagar.length+' tema(s) duplicado(s) removidos, em '+gruposAfetados+' grupo(s) — mantido sempre o mais completo de cada um.'+(regsApagar.length?(' '+regsApagar.length+' registro(s) órfão(s) também limpo(s).'):''), 'ok');
  return {idsParaApagar,gruposAfetados,regsApagar};
}
/* limparDuplicatasGeral() dedupe TEMAS (mesma turma+código), mas não funde os
   containers de "conteúdo" (ex.: vários "Matriz — 3º Bimestre" pra mesma turma)
   que sobram quando "Popular pela matriz" roda mais de uma vez — isso confunde
   a própria função de popular (ela pode escolher um container "irmão" vazio e
   recriar temas que já existem no outro). Esta função funde esses containers:
   migra os temas do(s) container(s) mais fraco(s) pro mais completo (mais temas,
   priorizando os já aplicados em sala) e apaga os containers que ficaram vazios.
   Depois roda o mesmo dedupe de temas de novo, já que a fusão pode ter colocado
   dois temas do mesmo código no mesmo container. */
async function limparConteudosDuplicados(silent){
  if(!silent){
    if(!confirm('Isso vai unificar os containers de conteúdo duplicados (mesma turma+bimestre), migrando os temas pro container mais completo e apagando os containers redundantes. Depois roda de novo a limpeza de temas duplicados, por segurança. Não pode ser desfeito. Continuar?')) return;
    closeModal();
    toast('Unificando containers duplicados… não feche a aba.','');
  }

  const grupos={};
  Object.values(conteudos).forEach(c=>{
    if(!c||!c.turmaId||!c.bimestre) return;
    const chave=c.turmaId+'::'+c.bimestre;
    (grupos[chave]=grupos[chave]||[]).push(c);
  });
  const pontuarConteudo=c=>{
    const ts=Object.values(temas).filter(t=>t.conteudoId===c.id);
    let p=ts.length*10;
    ts.forEach(t=>{ if((registrosDoTema(t.id)||[]).length) p+=1000; });
    p += (c.updatedAt||0)/1e13;
    return p;
  };
  const idsContApagar=[]; let gruposAfetados=0, temasMigrados=0;
  const chaves=Object.keys(grupos);
  for(let i=0;i<chaves.length;i++){
    const lista=grupos[chaves[i]];
    if(lista.length>1){
      gruposAfetados++;
      const ordenado=lista.slice().sort((a,b)=>pontuarConteudo(b)-pontuarConteudo(a));
      const vencedor=ordenado[0];
      ordenado.slice(1).forEach(perdedor=>{
        Object.values(temas).forEach(t=>{
          if(t.conteudoId===perdedor.id){ t.conteudoId=vencedor.id; temasMigrados++; }
        });
        idsContApagar.push(perdedor.id);
      });
    }
    if(i>0 && i%200===0){ if(!silent) toast('Unificando… '+i+'/'+chaves.length+' grupos.',''); await new Promise(r=>setTimeout(r,0)); }
  }

  if(!idsContApagar.length){ if(!silent) toast('Nenhum container duplicado encontrado.','ok'); return {idsContApagar:[],temasMigrados:0}; }

  idsContApagar.forEach(id=>{ delete conteudos[id]; });
  _temaIdx=null;
  lsSet(LS_CONT, JSON.stringify(conteudos));
  lsSet(LS_TEMAS, JSON.stringify(temas));
  if(DB){
    const updates={};
    idsContApagar.forEach(id=>updates['leciona/conteudos/'+id]=null);
    Object.values(temas).forEach(t=>{ if(temasMigrados && t.conteudoId) updates['leciona/temas/'+t.id+'/conteudoId']=t.conteudoId; });
    DB.ref().update(updates).catch(e=>toast('⚠ Falha ao sincronizar com o Firebase (mantido localmente). '+e.message,'err'));
  }
  if(!silent){ toast(idsContApagar.length+' container(s) duplicado(s) removido(s) em '+gruposAfetados+' grupo(s), '+temasMigrados+' tema(s) migrado(s). Rodando limpeza de temas duplicados…',''); await new Promise(r=>setTimeout(r,300)); }
  const dedupe = await limparDuplicatasGeral(true);
  renderThemes();
  return {idsContApagar,gruposAfetados,temasMigrados,dedupe};
}
/* Apaga TODOS os dados pedagógicos (conteúdos, temas, turmas, registros,
   alunos, notas) — local e no Firebase. Não mexe em configurações (chave da
   IA, modelo, credenciais do Firebase): isso é "esvaziar o Leciona", não
   "resetar o app". Dupla confirmação porque é irreversível. */
function excluirTodosDados(){
  const nTemas=Object.keys(temas).length, nConts=Object.keys(conteudos).length, nTurmas=Object.keys(turmas).length;
  if(!confirm('Isso vai apagar TODOS os dados do Leciona: '+nTemas+' tema(s), '+nConts+' conteúdo(s), '+nTurmas+' turma(s), além de todos os registros de aplicação, alunos e notas — local e no Firebase (se conectado). NÃO PODE SER DESFEITO. Continuar?')) return;
  const confirmacao=prompt('Para confirmar, digite APAGAR TUDO (em maiúsculas):');
  if(confirmacao!=='APAGAR TUDO'){ toast('Cancelado — o texto de confirmação não bateu. Nada foi apagado.',''); return; }
  closeModal();

  [LS_CONT,LS_TEMAS,LS_TURMAS,LS_REG,LS_ALUNOS,LS_ATVCTRL,LS_NOTAS,LS_OCORR,LS_CHAMADAS].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  conteudos={}; temas={}; turmas={}; registros={}; alunos={}; atividadesCtrl={}; notasCtrl={}; ocorrencias={}; chamadas={}; _temaIdx=null;

  if(DB){
    DB.ref('leciona').remove()
      .then(()=>toast('Todos os dados foram apagados (local e Firebase). Recarregando…','ok'))
      .catch(e=>toast('⚠ Apagado localmente, mas falhou ao apagar do Firebase: '+e.message,'err'))
      .finally(()=>setTimeout(()=>location.reload(),1200));
  } else {
    toast('Todos os dados locais foram apagados. Recarregando…','ok');
    setTimeout(()=>location.reload(),1200);
  }
}
/* ---------- Limpeza de dados de teste do 3º bimestre ----------
   3º bimestre ainda não começou (2026-08-03) — tudo datado dele até agora
   foi lançamento de teste. 1º/2º bimestre (dado real) NUNCA são tocados.
   auditarDados3Bim() é só leitura; apagarDados3Bim() exige revisão do
   relatório + dupla confirmação, mesmo padrão de excluirTodosDados(). */
let _auditoria3BimAtual=null;
function auditarDados3Bim(){
  const corte=BIM_RANGES['3º Bimestre'][0];
  const registrosAlvo=Object.values(registros).filter(r=>r&&r.data>=corte);
  const chamadasAlvo=Object.values(chamadas).filter(c=>c&&c.data>=corte);
  const ocorrenciasAlvo=Object.values(ocorrencias).filter(o=>o&&o.data>=corte);
  const atividadesAlvo=Object.values(atividadesCtrl).filter(a=>a&&a.data>=corte);
  const idsAtividadesAlvo=new Set(atividadesAlvo.map(a=>a.id));
  const notasAlvo=Object.values(notasCtrl).filter(n=>n&&idsAtividadesAlvo.has(n.atividadeId));
  const temasAplicadosAlvo=Object.values(temas).filter(t=>t&&t.status&&t.status.estado==='aplicado'&&t.status.data>=corte);
  const planejamentosAlvo=[];
  Object.values(conteudos).forEach(c=>{ (c.planejamento||[]).forEach(p=>{ if(p&&p.data>=corte) planejamentosAlvo.push({conteudoId:c.id,entry:p}); }); });
  const compromissosAlvo=Object.values(compromissos).filter(c=>c&&c.data>=corte);
  const r={corte,registrosAlvo,chamadasAlvo,ocorrenciasAlvo,atividadesAlvo,notasAlvo,temasAplicadosAlvo,planejamentosAlvo,compromissosAlvo};
  _auditoria3BimAtual=r;
  abrirRelatorio3Bim(r);
  return r;
}
function abrirRelatorio3Bim(r){
  const cortaLista=(txts)=>txts.slice(0,5).join('<br>')+(txts.length>5?'<br>… e mais '+(txts.length-5):'');
  const linha=(label,arr,txts)=>'<div class="field"><label>'+label+' ('+arr.length+')</label>'+(arr.length?('<small>'+cortaLista(txts)+'</small>'):'<small style="color:var(--muted)">nenhum</small>')+'</div>';
  const txtRegistros=r.registrosAlvo.map(x=>{ const t=temas[x.temaId]||{}, tu=turmas[x.turmaId]||{}; return esc((t.nome||'?')+' · '+turmaNome(tu)+' · '+x.data); });
  const txtChamadas=r.chamadasAlvo.map(x=>{ const tu=turmas[x.turmaId]||{}; return esc(turmaNome(tu)+' · '+x.data); });
  const txtOcorr=r.ocorrenciasAlvo.map(x=>{ const tu=turmas[x.turmaId]||{}; return esc(turmaNome(tu)+' · '+x.data+' · '+(x.categoria||'')); });
  const txtAtiv=r.atividadesAlvo.map(x=>{ const tus=(x.turmaIds||[]).map(id=>turmaNome(turmas[id]||{})).join(', '); return esc((x.nome||'?')+' · '+tus+' · '+x.data); });
  const txtTemas=r.temasAplicadosAlvo.map(x=>esc((x.nome||'?')+' · '+(x.status.data||'')));
  const txtPlan=r.planejamentosAlvo.map(({conteudoId,entry})=>{ const c=conteudos[conteudoId]||{}; return esc((c.nome||'?')+' · '+entry.data); });
  const txtComp=r.compromissosAlvo.map(x=>esc((x.titulo||'?')+' · '+x.data));
  const html='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:560px">'+
    '<div class="modal-h"><h3>🧹 Dados no 3º bimestre (a partir de '+r.corte.split('-').reverse().join('/')+')</h3></div>'+
    '<div class="modal-b">'+
    '<small>1º e 2º bimestre não são tocados — o 3º bimestre ainda não começou, então tudo datado dele até agora foi lançamento de teste. Revise antes de apagar.</small>'+
    linha('Registros de aplicação',r.registrosAlvo,txtRegistros)+
    linha('Chamadas',r.chamadasAlvo,txtChamadas)+
    linha('Ocorrências',r.ocorrenciasAlvo,txtOcorr)+
    linha('Atividades de controle de notas (+ '+r.notasAlvo.length+' nota(s) em cascata)',r.atividadesAlvo,txtAtiv)+
    linha('Temas marcados "aplicado" (status será resetado — o tema em si NÃO é apagado)',r.temasAplicadosAlvo,txtTemas)+
    linha('Entradas de cronograma (só a entrada é removida — o conteúdo fica)',r.planejamentosAlvo,txtPlan)+
    '<div class="field" style="border-top:1px solid var(--line);padding-top:10px"><label style="color:#a06a2e">⚠ Compromissos no período — NÃO incluídos no botão abaixo, podem ser reunião/prazo real. Remova manualmente na Agenda se forem teste.</label>'+(r.compromissosAlvo.length?('<small>'+cortaLista(txtComp)+'</small>'):'<small style="color:var(--muted)">nenhum</small>')+'</div>'+
    '</div><div class="modal-f"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" style="background:#c0392b;border-color:#c0392b;color:#fff" onclick="apagarDados3Bim()">Apagar itens acima</button></div></div></div>';
  const w=document.createElement('div'); w.id='modalWrap'; w.innerHTML=html; document.body.appendChild(w);
}
function apagarDados3Bim(){
  const r=_auditoria3BimAtual; if(!r) return;
  const total=r.registrosAlvo.length+r.chamadasAlvo.length+r.ocorrenciasAlvo.length+r.atividadesAlvo.length+r.notasAlvo.length+r.temasAplicadosAlvo.length+r.planejamentosAlvo.length;
  if(!total){ toast('Nada para apagar.',''); closeModal(); return; }
  if(!confirm('Isso vai apagar '+total+' item(ns) de teste do 3º bimestre (registros, chamadas, ocorrências, atividades/notas, status de temas aplicados, entradas de cronograma) — local e no Firebase. 1º e 2º bimestre NÃO são afetados. Compromissos NÃO são apagados por aqui. NÃO PODE SER DESFEITO. Continuar?')) return;
  const confirmacao=prompt('Para confirmar, digite APAGAR 3 BIM (em maiúsculas):');
  if(confirmacao!=='APAGAR 3 BIM'){ toast('Cancelado — o texto de confirmação não bateu. Nada foi apagado.',''); return; }
  closeModal();

  const upd={};
  r.registrosAlvo.forEach(x=>{ delete registros[x.id]; upd['leciona/registros/'+x.id]=null; });
  r.chamadasAlvo.forEach(x=>{ delete chamadas[x.id]; upd['leciona/chamadas/'+x.id]=null; });
  r.ocorrenciasAlvo.forEach(x=>{ delete ocorrencias[x.id]; upd['leciona/ocorrencias/'+x.id]=null; });
  r.atividadesAlvo.forEach(x=>{ delete atividadesCtrl[x.id]; upd['leciona/atividades_ctrl/'+x.id]=null; });
  r.notasAlvo.forEach(x=>{ delete notasCtrl[x.id]; upd['leciona/notas_ctrl/'+x.id]=null; });
  r.temasAplicadosAlvo.forEach(t=>{ t.status={}; upd['leciona/temas/'+t.id+'/status']=null; });
  r.planejamentosAlvo.forEach(({conteudoId,entry})=>{
    const c=conteudos[conteudoId]; if(!c||!c.planejamento) return;
    c.planejamento=c.planejamento.filter(p=>p!==entry);
    upd['leciona/conteudos/'+conteudoId+'/planejamento']=c.planejamento;
  });

  lsSet(LS_REG,JSON.stringify(registros));
  lsSet(LS_CHAMADAS,JSON.stringify(chamadas));
  lsSet(LS_OCORR,JSON.stringify(ocorrencias));
  lsSet(LS_ATVCTRL,JSON.stringify(atividadesCtrl));
  lsSet(LS_NOTAS,JSON.stringify(notasCtrl));
  lsSet(LS_TEMAS,JSON.stringify(temas));
  lsSet(LS_CONT,JSON.stringify(conteudos));

  if(DB){
    DB.ref().update(upd)
      .then(()=>toast('Dados de teste do 3º bimestre apagados (local e Firebase).','ok'))
      .catch(e=>toast('⚠ Apagado localmente, mas falhou ao apagar do Firebase: '+e.message,'err'));
  } else {
    toast('Dados de teste do 3º bimestre apagados localmente.','ok');
  }
  _auditoria3BimAtual=null;
  renderThemes(); if(!document.getElementById('viewAgenda').classList.contains('hidden')) renderAgendaDia();
}

async function popularTudoAutomaticamente(filtro){
  filtro=filtro||{};
  if(typeof PREBUILT_OBJ==='undefined'){ toast('O conteúdo pré-pronto ainda está carregando. Aguarde alguns segundos e tente de novo.','err'); return; }
  let turmasArr=Object.values(turmas).filter(t=>t&&!t._auto);
  if(filtro.disciplina) turmasArr=turmasArr.filter(t=>t.disciplina===filtro.disciplina);
  if(filtro.unidade) turmasArr=turmasArr.filter(t=>t.unidade===filtro.unidade);
  if(!turmasArr.length){ toast('Nenhuma turma corresponde a esse filtro.','err'); return; }
  const bimestresAlvo = filtro.bimestre ? [filtro.bimestre] : BIMESTRES;
  const descr = (filtro.disciplina||'todas as disciplinas')+' · '+(filtro.unidade||'todas as escolas')+' · '+(filtro.bimestre||'todos os bimestres');
  if(!confirm('Criar os temas que faltam em '+turmasArr.length+' turma(s) ('+descr+'), aplicando o conteúdo pré-pronto? Temas já existentes não são alterados.')) return;
  closeModal();
  toast('Processando '+turmasArr.length+' turma(s)… não feche a aba.','');

  if(typeof ensurePrebuiltDiscLoaded!=='undefined'){
    const discsAlvo=[...new Set(turmasArr.map(t=>t.disciplina))];
    await Promise.all(discsAlvo.map(ensurePrebuiltDiscLoaded));
  }

  let turmasProcessadas=0, temasCriados=0, temasComPrebuilt=0;
  const contsNovos=[], temasNovos=[];
  const idxTemas={};
  Object.values(temas).forEach(t=>{ if(t&&t.conteudoId){ (idxTemas[t.conteudoId]||(idxTemas[t.conteudoId]=[])).push(t); } });
  const idxConteudos={};
  Object.values(conteudos).forEach(c=>{ if(c&&c.turmaId&&c.bimestre){ const k=c.turmaId+'|'+c.bimestre; if(!idxConteudos[k]) idxConteudos[k]=c; } });

  for(let ti=0; ti<turmasArr.length; ti++){
    const tu=turmasArr[ti];
    const disc=tu.disciplina, serie=tu.serie;
    if(disc && serie && disc!=='Eletiva' && disc!=='Estudo Orientado'){
      let turmaTocada=false;
      bimestresAlvo.forEach(bim=>{
        const arr=MATRIZ[matrizKey(disc,serie,bim)]||[];
        if(!arr.length) return;
        turmaTocada=true;
        const chaveCont=tu.id+'|'+bim;
        let cont=idxConteudos[chaveCont];
        if(!cont){
          cont={id:uid(),disciplina:disc,serie,turmaId:tu.id,bimestre:bim,nome:'Matriz — '+bim,resumo:'',ordem:0,updatedAt:Date.now()};
          conteudos[cont.id]=cont; idxConteudos[chaveCont]=cont; contsNovos.push(cont);
        }
        const jaTem=idxTemas[cont.id]||[];
        const existentes=new Set(jaTem.map(t=>t.dcgo));
        let base=jaTem.length ? Math.max(...jaTem.map(t=>t.ordem||0))+1 : 0;
        arr.forEach(it=>{
          if(existentes.has(it.c)) return;
          const tema=blankTema(cont.id,{nome:it.t,dcgo:it.c,habilidade:it.h,resumo:it.h,ordem:base++,turmaId:tu.id,disciplina:disc,serie:serie,bimestre:bim});
          tema._ts=Date.now(); tema.updatedAt=tema._ts;
          temas[tema.id]=tema;
          (idxTemas[cont.id]||(idxTemas[cont.id]=[])).push(tema);
          temasCriados++;
          if(applyPrebuiltIfEmptySilent(tema)) temasComPrebuilt++;
          temasNovos.push(tema);
        });
      });
      if(turmaTocada) turmasProcessadas++;
    }
    // cede o controle ao navegador antes da próxima turma — é isso que
    // evita o aviso de "página sem resposta" em bases grandes
    if(ti>0 && ti%5===0) toast('Processando… '+ti+'/'+turmasArr.length+' turmas.','');
    await new Promise(r=>setTimeout(r,0));
  }

  // grava tudo de uma vez só: 1x no localStorage, 1x no Firebase (multi-path update)
  _temaIdx=null;
  lsSet(LS_CONT, JSON.stringify(conteudos));
  lsSet(LS_TEMAS, JSON.stringify(temas));
  if(DB){
    const updates={};
    contsNovos.forEach(c=>updates['leciona/conteudos/'+c.id]=c);
    temasNovos.forEach(t=>updates['leciona/temas/'+t.id]=t);
    if(Object.keys(updates).length){
      DB.ref().update(updates).catch(e=>toast('⚠ Falha ao sincronizar com o Firebase (mantido localmente). '+e.message,'err'));
    }
  }

  renderThemes();
  toast('Pronto: '+temasCriados+' tema(s) criados em '+turmasProcessadas+' turma(s) · '+temasComPrebuilt+' já vieram com conteúdo pré-pronto aplicado.', 'ok');
}
/* Igual a applyPrebuiltIfEmpty, mas sem chamar persistTema sozinho —
   usado durante popularTudoAutomaticamente() pra não gravar tema por tema. */
function applyPrebuiltIfEmptySilent(t){
  const pb=getPrebuilt(t);
  if(!pb) return false;
  if(!t.obj) t.obj={};
  const o=t.obj;
  const campoVazio=(k)=>{
    const v=o[k];
    if(v==null) return true;
    if(k==='avaliacao'){
      return !(typeof v==='object' && !Array.isArray(v) && Object.values(v).some(a=>Array.isArray(a)?a.length>0:String(a||'').trim().length>0));
    }
    if(Array.isArray(v)) return v.length===0;
    if(typeof v==='object') return Object.keys(v).length===0;
    return !String(v).trim();
  };
  let mudou=false;
  ['quadro','estudo','slides','mapaMental','avaliacao'].forEach(k=>{
    if(campoVazio(k) && pb[k]!=null){ o[k]=pb[k]; mudou=true; }
  });
  return mudou;
}

/* Verifica todo tema cujo NOME bate exatamente com um subtema do
   prebuilt.js, e confere se o conteúdo aplicado (quadro) é realmente
   o daquele subtema — ou se, por causa do bug de prioridade (código
   antes do nome), veio o conteúdo de outro subtema do mesmo código.
   Corrige em lote, uma única gravação no final (mesma lição do
   Popular tudo agora — nunca gravar tema por tema num loop). */
async function corrigirPrebuiltAplicadoErrado(silent){
  if(typeof PREBUILT_OBJ==='undefined'){ if(!silent) toast('O conteúdo pré-pronto ainda está carregando. Aguarde e tente de novo.','err'); return; }
  if(typeof ensurePrebuiltDiscLoaded!=='undefined'){
    await Promise.all(Object.keys(PREBUILT_DISC_FILE).map(ensurePrebuiltDiscLoaded));
  }
  const divergentes=[];
  Object.values(temas).forEach(t=>{
    if(!t||!t.nome||!t.obj) return;
    const nome=t.nome.trim();
    const correto=PREBUILT_OBJ[nome];
    if(!correto) return; // nome genérico (nível habilidade) — não mexe
    const quadroAtual=(t.obj.quadro||'').trim();
    if(!quadroAtual) return; // ainda vazio, não é caso de conteúdo errado
    if(quadroAtual!==correto.quadro.trim()){
      divergentes.push(t);
    }
  });
  if(!divergentes.length){ if(!silent) toast('Nenhum tema com conteúdo trocado encontrado. Tudo certo.','ok'); return {divergentes:0}; }
  if(!silent && !confirm('Encontrei '+divergentes.length+' tema(s) cujo nome bate com um subtema específico, mas o conteúdo aplicado é de OUTRO subtema do mesmo código (bug de correspondência). Corrigir agora, substituindo pelo conteúdo certo?')) return;
  divergentes.forEach(t=>{ t.obj=Object.assign({}, PREBUILT_OBJ[t.nome.trim()]); t._ts=Date.now(); t.updatedAt=t._ts; });
  _temaIdx=null;
  lsSet(LS_TEMAS, JSON.stringify(temas));
  if(DB){
    const updates={};
    divergentes.forEach(t=>updates['leciona/temas/'+t.id]=t);
    DB.ref().update(updates).catch(e=>toast('⚠ Falha ao sincronizar com o Firebase (mantido localmente). '+e.message,'err'));
  }
  renderThemes();
  if(!silent) toast(divergentes.length+' tema(s) corrigido(s) — conteúdo trocado pelo certo.','ok');
  return {divergentes:divergentes.length};
}

/* Botão único de manutenção: encadeia as 5 correções/limpezas acima na ordem
   certa (cada uma dependia da anterior já ter rodado — motivo de existirem
   5 botões separados antes, com instruções de ordem só no texto do toast).
   Roda tudo silenciosamente e mostra um resumo único no final. */
async function manutencaoCompleta(){
  if(!confirm('Isso vai verificar e corrigir os dados automaticamente, nesta ordem: realinhar turmaId desatualizado, unificar turmas duplicadas, unificar containers de conteúdo duplicados, remover temas duplicados e corrigir conteúdo trocado por engano. Pode levar alguns segundos e não pode ser desfeito. Continuar?')) return;
  closeModal();
  toast('Verificando e corrigindo tudo… não feche a aba.','');
  const r1 = (await corrigirTurmaIdTemas(true)) || {corrigidos:0};
  const r2 = (await limparTurmasDuplicadas(true)) || {turmasRemovidas:0};
  const r3 = (await limparConteudosDuplicados(true)) || {idsContApagar:[],temasMigrados:0,dedupe:{idsParaApagar:[]}};
  const r4 = (r3.dedupe) || (await limparDuplicatasGeral(true)) || {idsParaApagar:[]};
  const r5 = (await corrigirPrebuiltAplicadoErrado(true)) || {divergentes:0};
  const partes=[];
  if(r1.corrigidos) partes.push(r1.corrigidos+' turmaId realinhado(s)');
  if(r2.turmasRemovidas) partes.push(r2.turmasRemovidas+' turma(s) duplicada(s) unificada(s)');
  if(r3.idsContApagar&&r3.idsContApagar.length) partes.push(r3.idsContApagar.length+' container(s) de conteúdo unificado(s)');
  if(r4.idsParaApagar&&r4.idsParaApagar.length) partes.push(r4.idsParaApagar.length+' tema(s) duplicado(s) removido(s)');
  if(r5.divergentes) partes.push(r5.divergentes+' tema(s) com conteúdo trocado corrigido(s)');
  renderThemes();
  toast(partes.length ? ('Tudo verificado — '+partes.join(', ')+'.') : 'Tudo verificado — nenhum problema encontrado, seus dados estão em ordem.', 'ok');
}

let _saveT=null;

  const el=document.getElementById('saveStatus'); if(!el) return;
  if(estado==='editando'){ el.textContent='• editando…'; el.style.color='var(--muted,#888)'; }
  else if(estado==='salvando'){ el.textContent='salvando…'; el.style.color='var(--muted,#888)'; }
  else if(estado==='salvo'){ el.textContent='✓ salvo'; el.style.color='var(--green,#2f6b5e)'; }

function autosave(){
  if(!editing) return; const ed=document.getElementById('editor');

/* ---- Exportar conteúdo (e temas) para outra(s) turma(s) ----
   Multi-seleção: pode marcar turmas avulsas, "todas da mesma série" (atalho)
   ou "todas" de uma vez — útil pra distribuir o mesmo conteúdo/aula pra
   várias turmas paralelas sem repetir a operação. */
function _checksDestino(alvos, origem, cssClass){
  const mesmaSerieIds=alvos.filter(x=>x.disciplina===origem.disciplina && x.serie===origem.serie).map(x=>x.id);
  const todosIds=alvos.map(x=>x.id);
  const checks=alvos.map(x=>'<label class="check"><input type="checkbox" class="'+cssClass+'" value="'+x.id+'">'+esc(turmaNome(x))+' — '+esc(x.disciplina)+' · '+esc(x.unidade||'—')+'</label>').join('');
  const marcar=(ids)=>'expMarcar(\''+cssClass+'\',['+ids.map(id=>'\''+id+'\'').join(',')+'])';
  const botoes='<div class="addrow" style="margin:10px 0 4px;flex-wrap:wrap">'+
    (mesmaSerieIds.length>1?'<button class="btn ghost sm" type="button" onclick="'+marcar(mesmaSerieIds)+'">marcar todas de '+esc(origem.serie||'')+'</button>':'')+
    '<button class="btn ghost sm" type="button" onclick="'+marcar(todosIds)+'">marcar todas ('+todosIds.length+')</button>'+
    '<button class="btn ghost sm" type="button" onclick="'+marcar([])+'">limpar</button>'+
  '</div>';
  return botoes+'<div class="rel-temas-list">'+checks+'</div>';
}
function expMarcar(cssClass, ids){
  document.querySelectorAll('.'+cssClass).forEach(cb=>{ cb.checked=ids.includes(cb.value); });
}
function openExportConteudo(cid){
  const c=conteudos[cid]; if(!c) return;
  const origem=turmas[c.turmaId]||{};
  const alvos=Object.values(turmas).filter(t=>t.id!==c.turmaId).sort((a,b)=>((a.disciplina||'')+(a.serie||'')+turmaNome(a)).localeCompare((b.disciplina||'')+(b.serie||'')+turmaNome(b)));
  const inner = alvos.length
    ? '<small>Copia o conteúdo "<b>'+esc(c.nome)+'</b>" e todos os seus temas/objetos pras turmas marcadas (útil para projetos interdisciplinares e temas transversais). Cada cópia fica <b>independente</b>: editar ou excluir numa não afeta as outras.</small>'+
      _checksDestino(alvos, origem, 'expDestC')
    : '<small>Não há outra turma cadastrada. Crie a turma de destino em "+ turmas" primeiro.</small>';
  const foot = alvos.length ? '<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="doExportConteudo(\''+cid+'\')">Copiar</button>' : '<button class="btn ghost" onclick="closeModal()">Fechar</button>';
  const html='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>Copiar para outra(s) turma(s)</h3></div><div class="modal-b">'+inner+'</div><div class="modal-f">'+foot+'</div></div></div>';
  const w=document.createElement('div'); w.id='modalWrap'; w.innerHTML=html; document.body.appendChild(w);
}
function doExportConteudo(cid){
  const c=conteudos[cid]; if(!c) return;
  const destIds=[...document.querySelectorAll('.expDestC:checked')].map(cb=>cb.value);
  if(!destIds.length){ toast('Marque ao menos uma turma de destino.','err'); return; }
  const nomes=destIds.map(id=>turmaNome(turmas[id])).join(', ');
  if(!confirm('Copiar "'+c.nome+'" e todos os seus temas para: '+nomes+'?\nCada cópia será independente da turma de origem.')) return;
  let feitas=0;
  destIds.forEach(dest=>{
    const dt=turmas[dest]; if(!dt) return;
    const novoC=JSON.parse(JSON.stringify(c)); novoC.id=uid(); novoC.turmaId=dest; novoC.disciplina=dt.disciplina; novoC.serie=dt.serie; novoC._avulsos=false; novoC.ordem=99; novoC.updatedAt=Date.now();
    novoC.planejamento=[]; // cronograma referencia temaIds da origem — não faz sentido na cópia

/* ---------- Cronograma (planejamento por conteúdo) ----------
   O campo 'planejamento' vive no CONTEÚDO (não no tema/objeto): um conteúdo
   pode ter vários temas/aulas, e o cronograma é a distribuição deles no
   tempo — data prevista + qual dos 5 objetos será dado naquela aula.
   Cada entrada: {id, data:'AAAA-MM-DD', temaId, objeto, obs}. */
function renderCronograma(){
  const box=document.getElementById('edCronograma'); if(!box) return;
  // lê do <select> (não de editing.conteudoId) pra refletir a troca de Conteúdo
  // na hora, mesmo antes do autosave rodar collectMeta() e persistir a mudança.

  const cont=cid?conteudos[cid]:null;
  if(!cont){ box.innerHTML='<p class="statusdot" style="font-size:12px">Escolha um Conteúdo (acima) pra habilitar o cronograma.</p>'; return; }
  const plan=(cont.planejamento||[]).slice().sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const temasDoCont=temasDoConteudo(cid);
  const temaOpts=temasDoCont.map(t=>'<option value="'+t.id+'"'+(t.id===editing.id?' selected':'')+'>'+esc((t.nome||'(sem nome)').slice(0,40))+'</option>').join('');
  const objOpts=OBJ_DEFS.map(o=>'<option value="'+o.k+'">'+esc(o.label)+'</option>').join('');
  const lista = plan.length ? plan.map(p=>{
    const tm=temas[p.temaId];
    const objLabel=(OBJ_DEFS.find(o=>o.k===p.objeto)||{}).label||p.objeto||'—';
    const dataFmt=p.data?new Date(p.data+'T00:00:00').toLocaleDateString('pt-BR'):'—';
    return '<div class="turma-row"><span class="tn" style="flex:0 0 76px">'+esc(dataFmt)+'</span>'+
      '<span style="flex:1;font-size:12px">'+objIconHtml(p.objeto)+esc(tm?tm.nome:'(tema removido)')+' · '+esc(objLabel)+(p.obs?(' · '+esc(p.obs)):'')+'</span>'+
      '<button class="btn ghost sm" onclick="remPlanejamento(\''+p.id+'\')" title="Remover">✕</button></div>';
  }).join('') : '<p class="statusdot" style="font-size:12px">Nenhuma aula planejada ainda.</p>';
  box.innerHTML = lista+
    '<div class="addrow" style="margin-top:8px;flex-wrap:wrap">'+
      '<input type="date" id="cronData" style="flex:0 0 132px">'+
      '<select id="cronTema" style="flex:1;min-width:130px">'+temaOpts+'</select>'+
      '<select id="cronObjeto" style="flex:0 0 116px">'+objOpts+'</select>'+
    '</div>'+
    '<div class="addrow" style="margin-top:6px">'+
      '<input id="cronObs" placeholder="observação (opcional)" style="flex:1">'+

    '</div>';
}
function addPlanejamento(){
  const cid=(document.getElementById('edConteudo')||{}).value || editing.conteudoId;
  if(!cid){ toast('Escolha um Conteúdo primeiro.','err'); return; }
  const cont=conteudos[cid]; if(!cont) return;
  const data=(document.getElementById('cronData')||{}).value;
  const temaId=(document.getElementById('cronTema')||{}).value;
  const objeto=(document.getElementById('cronObjeto')||{}).value;
  const obs=(document.getElementById('cronObs')||{}).value.trim();
  if(!data){ toast('Escolha uma data.','err'); return; }
  if(!temaId){ toast('Este conteúdo ainda não tem tema pra planejar.','err'); return; }
  const turmaCont=turmas[cont.turmaId];
  if(turmaCont){
    const grade=gradeDe(turmaCont);
    const wd=new Date(data+'T00:00:00').getDay();
    if(!grade[wd]){
      const diaEscolhido=WD_NOMES[wd]||wd;
      const diasTurma=Object.keys(grade).map(k=>WD_NOMES[k]||k).join(', ')||'(sem horário configurado)';
      if(!confirm('Essa turma não tem aula em '+diaEscolhido+' — o horário configurado é '+diasTurma+'. Adicionar mesmo assim?')) return;
    }
  }
  if(!cont.planejamento) cont.planejamento=[];
  cont.planejamento.push({id:uid(),data,temaId,objeto,obs});
  persistConteudo(cont);
  renderCronograma();
  toast('Aula adicionada ao cronograma.','ok');
}
function remPlanejamento(pid){
  const cid=(document.getElementById('edConteudo')||{}).value || editing.conteudoId;
  const cont=cid?conteudos[cid]:null; if(!cont||!cont.planejamento) return;
  cont.planejamento=cont.planejamento.filter(p=>p.id!==pid);
  persistConteudo(cont);
  renderCronograma();
}

function fmtWrap(marcador){
  const ta=document.getElementById('objText'); if(!ta) return;
  const ini=ta.selectionStart, fim=ta.selectionEnd;
  const antes=ta.value.slice(0,ini), meio=ta.value.slice(ini,fim), depois=ta.value.slice(fim);
  const novoMeio = meio ? (marcador+meio+marcador) : (marcador+'texto'+marcador);
  ta.value = antes+novoMeio+depois;
  const novaPos = meio ? ini+novoMeio.length : ini+marcador.length;
  const novaSel = meio ? novaPos : ini+marcador.length+5;
  ta.focus();
  ta.setSelectionRange(meio?novaPos:ini+marcador.length, meio?novaPos:novaSel);
  onObjText();
}

    const {system,user,parse}=promptFor(def, editing, append?existente:null, foco);
    const raw=await callClaude(system,user);
    stopGenTimer(__timerId);
    const novo=parse(raw);
    const vazio=(Array.isArray(novo)&&!novo.length)||(typeof novo==='string'&&!novo.trim());
    if(vazio){ toast('A IA retornou vazio — mantive o que já existia. Tente de novo ou ajuste o foco.','err'); if(btn){btn.disabled=false;btn.innerHTML='✦ Gerar com IA';} return; }
    if(activeObj==='avaliacao'){
      const tab=window.__avalTab||'questoes';
      if(!editing.obj.avaliacao) editing.obj.avaliacao={questoes:[],flashcards:[],atividade:[],gabarito:[]};
      const existArr=editing.obj.avaliacao[tab]||[];
      editing.obj.avaliacao[tab]=(append&&Array.isArray(existArr)&&Array.isArray(novo))?existArr.concat(novo):novo;
    } else if(append && Array.isArray(existente) && Array.isArray(novo)) editing.obj[activeObj]=existente.concat(novo);
    else editing.obj[activeObj]=novo;
    collectMeta(); persistTema(editing); dirty=false;   // salva já — não perde no reload
    renderObjTabs(); renderObjContent();
    toast(append?'Itens adicionais gerados e salvos.':'Conteúdo gerado e salvo.','ok');
  }catch(e){ stopGenTimer(__timerId); console.error(e); toast('Erro na geração: '+e.message,'err');
    if(btn){ btn.disabled=false; btn.innerHTML='✦ Gerar com IA'; } }
}
async function genObjFor(temaObj, objKey){
  if(objKey==='avaliacao'){
    // Gera os 4 sub-campos em sequência
    const subKeys=['questoes','flashcards','atividade','gabarito'];
    const av={questoes:[],flashcards:[],atividade:[],gabarito:[]};
    for(const sub of subKeys){
      const fakeDef={k:sub,tipo:sub};
      try{
        const {system,user,parse}=promptFor(fakeDef, temaObj, null, '');
        const raw=await callClaude(system,user);
        const novo=parse(raw);
        if(Array.isArray(novo)&&novo.length) av[sub]=novo;
      }catch(e){ console.warn('genObjFor avaliacao/'+sub+':',e); }
      await new Promise(r=>setTimeout(r,350));
    }
    const temAlgo=Object.values(av).some(a=>a.length>0);
    return temAlgo?av:null;
  }
  const def=OBJ_DEFS.find(o=>o.k===objKey);
  if(!def) throw new Error('objeto desconhecido: '+objKey);
  const {system,user,parse}=promptFor(def, temaObj, null, '');
  const raw=await callClaude(system,user);
  const novo=parse(raw);
  const vazio=(Array.isArray(novo)&&!novo.length)||(typeof novo==='string'&&!novo.trim());
  return vazio?null:novo;
}

async function genOne(key, foco){

  }
  const def=OBJ_DEFS.find(o=>o.k===key);

function ctx(t, opt){

  if(!opt.semCodigo){
    if(t.dcgo) s+='Código DC-GO/BNCC: '+t.dcgo+'\n';
    if(t.habilidade) s+='Habilidade essencial: '+t.habilidade+'\n';
  }
  if(t.resumo) s+='Resumo: '+t.resumo+'\n';
  s+='Contexto curricular: Matrizes Essenciais SEDUC-GO / DC-GO Ampliado, '+bimNum+'º bimestre.';
  // GoiásTec como referência curricular prioritária quando a habilidade tem o selo
  if(!opt.semCodigo && t.dcgo){ const it=matrizItem(t.disciplina,t.serie,t.bimestre,t.dcgo); if(it&&it.g===1) s+='\nEsta habilidade possui material no GoiásTec (plataforma oficial SEDUC-GO): alinhe o conteúdo à abordagem das Matrizes Essenciais/GoiásTec para esta habilidade.'; }
  // anti-redundância: avisa dos temas vizinhos do mesmo conteúdo
  try{
    const irmaos=Object.values(temas).filter(x=>x && x.conteudoId===t.conteudoId && x.id!==t.id).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
    if(irmaos.length){ s+='\n\nOUTROS TEMAS DO MESMO CONTEÚDO (serão tratados em aulas separadas — NÃO repita o que pertence a eles; foque apenas no recorte específico de "'+t.nome+'"): '+irmaos.map(x=>x.nome).filter(Boolean).join('; ')+'.'; }
  }catch(e){}
  return s;
}
function promptFor(def,t,existentes,foco){
  const temFoco = foco && foco.trim();
  let base=ctx(t, temFoco?{semCodigo:true}:null);
  if(temFoco){
    base = 'ASSUNTO/FOCO PRINCIPAL (prioridade máxima, gere SOBRE ISTO): '+foco.trim()+'\n\n'+base+
      '\n\nIMPORTANTE: produza o conteúdo sobre o ASSUNTO/FOCO acima, mesmo que vá além do título do tema (há projetos interdisciplinares e temas transversais). Mantenha rigor histórico e linguagem da série.';
  }
  if(existentes && existentes.length){
    const resumo=existentes.map((x,i)=>(i+1)+'. '+(x.enunciado||x.frente||x.titulo||x.resposta||'').slice(0,80)).join('\n');
    base+='\n\nJÁ EXISTEM estes itens — gere itens ADICIONAIS, DIFERENTES e que não repitam os abaixo:\n'+resumo;
  }
  const sysBase='Você é uma professora experiente de Ciências Humanas da rede estadual de Goiás. Escreva em português do Brasil, com rigor historiográfico e linguagem adequada à série. Responda apenas com o conteúdo pedido, sem preâmbulos.';
  const txt=(s)=>({system:sysBase,user:s,parse:r=>r.trim()});
  const json=(sys,u)=>({system:sys+' Responda SOMENTE com JSON válido, sem cercas de código nem texto fora do JSON.',user:u,parse:r=>parseJSON(r)});
  switch(def.k){
    case 'quadro': return txt(base+'\n\nProduza um TEXTO DE QUADRO curto, para os alunos copiarem da lousa em UMA aula: entre 100 e 250 palavras no total. Use um título, poucos tópicos curtos com palavras-chave e, no máximo, uma definição essencial. Nada de parágrafos longos. Se o tema for amplo, foque apenas no recorte de uma aula.');
    case 'estudo': return txt(base+'\n\nProduza um TEXTO PARA ESTUDO DO ALUNO: prosa explicativa, parágrafos completos e linguagem adequada à série, para leitura e estudo. Inclua 2 perguntas de reflexão e, ao final, uma seção "Referências" com 2 a 4 obras/autores acadêmicos REAIS e reconhecidos sobre o tema (formato ABNT). Não invente títulos, autores, anos ou páginas; na dúvida, omita o dado em vez de inventar.');
    case 'slides': return json('Você cria slides de aula para projeção.', base+'\n\nGere de 5 a 7 slides como JSON: array de {"titulo": string, "topicos": [string,...]}. Cada slide com 3 a 5 tópicos curtos.');
    case 'atividade': return json('Você cria atividades escolares formativas, com rigor histórico, sem múltipla escolha com distratores e sem entregar a resposta no enunciado.', base+'\n\nGere uma ATIVIDADE com 5 itens como JSON: array de {"enunciado": string}. REGRAS: (1) NUNCA inclua a resposta no próprio enunciado nem deixe a resposta óbvia pela formulação; o gabarito fica só na aba Gabarito. (2) Em itens de completar lacunas, você pode oferecer um banco de palavras EM ORDEM ALEATÓRIA, mas sem indicar qual palavra vai em qual lacuna. (3) NÃO use múltipla escolha com alternativas. (4) Varie os tipos: discursiva, completar lacunas, relacionar colunas (descreva as duas colunas embaralhadas, sem o par pronto), análise de trecho de texto e leitura de imagem/charge. (5) Mantenha rigor historiográfico e linguagem da série.');
    case 'gabarito': {
      const at=((t.obj.avaliacao&&t.obj.avaliacao.atividade)||t.obj.atividade||[]).map((x,i)=>(i+1)+'. '+x.enunciado).join('\n');
      return json('Você corrige atividades escolares.', base+'\n\n'+(at?('Atividade existente:\n'+at):'Crie respostas para 5 questões coerentes com o tema.')+'\n\nGere o gabarito comentado como JSON: array de {"resposta": string, "comentario": string}, na mesma ordem.');
    }
    case 'questoes': return json('Você elabora questões de múltipla escolha no estilo ENEM (texto-base ou contexto + comando claro).', base+'\n\nGere 5 questões estilo ENEM como JSON: array de {"enunciado": string (pode conter um pequeno texto-base seguido do comando), "alternativas": [5 strings], "correta": índice 0-4, "comentario": string explicando a correta e por que cada distrator está errado}.');
    case 'flashcards': return json('Você cria flash cards de revisão.', base+'\n\nGere 8 flash cards como JSON: array de {"frente": string, "verso": string}.');
    case 'mapaMental': return {system:'Você organiza conteúdos em mapas mentais hierárquicos.',user:base+'\n\nProduza um mapa mental em MARKDOWN hierárquico: "# Tema central", depois "## Ramos" e "- subitens". Apenas o markdown.',parse:r=>r.replace(/```[a-z]*|```/g,'').trim()};
    case 'avaliacao': {
      // Delega para a sub-aba ativa
      const tab=window.__avalTab||'questoes';
      const fakeKey=tab==='flash'?'flashcards':tab;
      const fakeDef=OBJ_DEFS.find(o=>o.k===fakeKey)||{k:fakeKey,tipo:fakeKey};
      return promptFor(fakeDef,t,existentes,foco);
    }
  }
}
function parseJSON(raw){
  let s=raw.replace(/```json|```/g,'').trim();
  const a=s.indexOf('['), b=s.lastIndexOf(']');
  if(a>=0&&b>a) s=s.slice(a,b+1);
  return JSON.parse(s);
}
/* Todas as chamadas de IA passam pela Cloud Function gerarComIA — a chave da
   API Anthropic fica só no servidor (Secret Manager), nunca no navegador.
   A function já faz o retry em 429 internamente; aqui só repassamos o erro. */
/* Variante que devolve a resposta inteira (blocos de conteúdo + stop_reason),
   não só o texto — usada pelo Assistente pra rodar o loop de ferramentas.
   As chamadas simples (callClaude etc.) continuam usando chamarIA(), que só
   quer o texto. */
async function chamarIARaw(system, messages, opts){
  opts=opts||{};
  const fn=firebase.app().functions('southamerica-east1').httpsCallable('gerarComIA');
  const r=await fn({system, messages, maxTokens:opts.maxTokens||2500, useWeb:!!opts.useWeb, model:getModel(), tools:opts.tools});
  return r.data||{};
}
async function chamarIA(system, messages, opts){
  const data=await chamarIARaw(system, messages, opts);
  return data.resposta||'';
}
async function callClaude(system,user,maxTokens){
  return chamarIA(system,[{role:'user',content:user}],maxTokens?{maxTokens}:undefined);
}
async function callClaudeWeb(system,user){
  return chamarIA(system,[{role:'user',content:user}],{maxTokens:3000,useWeb:true});
}

/* =========================================================
   ASSISTENTE — chat com IA, com ferramentas (agenda + anotação em
   tema) e opção de anexar qualquer resposta a um tema aberto.

   A Cloud Function gerarComIA é um proxy burro: só repassa `tools` pra
   API da Anthropic e devolve os blocos de conteúdo crus. Todo o "o que
   uma ferramenta faz de verdade" mora aqui, no cliente — mesma filosofia
   do resto do Leciona (o servidor nunca toca nos dados, só na chamada de

   quem cria um compromisso pelo chat usa a MESMA persistCompromisso() que
   o formulário da Agenda usa.

   consultar agenda, anexar anotação a um tema). Nada que crie/apague

/* Turma citada em texto livre pelo usuário/IA — não tem id, então casa por
   nome parcial; se vazio, assume a turma selecionada no momento no app.
   turmaNome() sozinho só dá "1ªA" (sem disciplina/escola — ver comentário
   ali), então a busca real precisa combinar disciplina+turma+escola+série
   e exigir que TODAS as palavras da consulta apareçam nessa descrição,
   não só o nome curto. */
function acharTurmaPorNome(query){
  if(!query) return turmas[scope.turma]||null;
  const normaliza=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[ºª]/g,'');
  const palavras=normaliza(query).split(/\s+/).filter(Boolean);
  const desc=t=>normaliza([t.disciplina, turmaNome(t), t.unidade, t.serie].filter(Boolean).join(' '));
  const todas=Object.values(turmas).filter(Boolean);
  const porTodasPalavras=todas.filter(t=>palavras.every(p=>desc(t).includes(p)));
  if(porTodasPalavras.length) return porTodasPalavras[0];
  return todas.find(t=>normaliza(turmaNome(t)).includes(normaliza(query))) || null;
}

    criar_compromisso:'criando compromisso "'+(input.titulo||'')+'"',
    editar_compromisso:input.apagar?'apagando compromisso da agenda':'editando compromisso da agenda',
    consultar_agenda:'consultando a agenda ('+(input.data_inicio||'?')+' a '+(input.data_fim||'?')+')',
    deixar_nota_tema:'anexando anotação'+(input.tema_nome?(' a "'+input.tema_nome+'"'):' ao tema aberto'),
    deixar_nota_geral:'anotando no bloco de notas da Agenda',
    listar_progresso_bimestre:'conferindo progresso do bimestre'+(input.turma?(' — '+input.turma):''),
    sugerir_conteudos_pendentes:'buscando conteúdos pendentes'+(input.turma?(' — '+input.turma):''),
    criar_tema:'criando o tema "'+(input.nome||'')+'"',
    criar_tema_livre:'criando o tema original "'+(input.nome||'')+'"',

  };
  return labels[nome]||nome;
}
function executarFerramentaAssistente(nome, input){
  input=input||{};
  try{
    if(nome==='criar_compromisso'){
      if(!input.titulo||!input.data) return {erro:'faltam titulo/data'};
      const c={id:uid(), titulo:String(input.titulo).slice(0,120), data:input.data, hora:input.hora||'', descricao:input.descricao||'', concluido:false};
      persistCompromisso(c);
      if(!document.getElementById('viewAgenda').classList.contains('hidden')) renderAgenda();
      return {ok:true, id:c.id};
    }
    if(nome==='editar_compromisso'){
      const c=compromissos[input.id]; if(!c) return {erro:'compromisso não encontrado — use consultar_agenda pra achar o id'};
      if(input.apagar){
        delete compromissos[input.id];
        lsSet(LS_COMP, JSON.stringify(compromissos));
        if(DB) DB.ref('leciona/compromissos/'+input.id).remove().catch(()=>{});
        if(!document.getElementById('viewAgenda').classList.contains('hidden')) renderAgenda();
        return {ok:true, apagado:true};
      }
      ['titulo','data','hora','descricao'].forEach(k=>{ if(input[k]!=null) c[k]=input[k]; });
      persistCompromisso(c);
      if(!document.getElementById('viewAgenda').classList.contains('hidden')) renderAgenda();
      return {ok:true};
    }
    if(nome==='consultar_agenda'){
      const {data_inicio,data_fim}=input;
      if(!data_inicio||!data_fim) return {erro:'faltam data_inicio/data_fim'};
      const out=[];
      let cur=new Date(data_inicio+'T00:00:00'); const fim=new Date(data_fim+'T00:00:00');
      let dias=0;
      while(cur<=fim && dias<93){ // limite de segurança (~3 meses)
        const iso=isoLocal(cur);
        aulasDoDiaISO(iso).forEach(x=>out.push({tipo:'aula', data:iso, hora:x.ini, titulo:x.disc+' · '+serieCurta(SERIE_NUM[x.serie])+x.letra}));
        planejamentosDoDia(iso).forEach(({tema})=>out.push({tipo:'cronograma', data:iso, titulo:tema.nome||''}));
        compromissosDoDia(iso).forEach(c=>out.push({tipo:'compromisso', id:c.id, data:iso, hora:c.hora||'', titulo:c.titulo, concluido:!!c.concluido}));
        aulasAvulsasDoDiaGlobal(iso).forEach(a=>{ const tu=turmas[a.turmaId]||{}; out.push({tipo:'aula_avulsa', id:a.id, data:iso, titulo:a.titulo, turma:turmaNome(tu), tipo_aula:a.tipo, status:a.status}); });
        cur.setDate(cur.getDate()+1); dias++;
      }
      return {itens: out};
    }
    if(nome==='deixar_nota_tema'){
      let t=editing;
      if(!t && input.tema_nome){ const nomeLow=String(input.tema_nome).toLowerCase(); t=Object.values(temas).find(x=>x && (x.nome||'').toLowerCase()===nomeLow); }
      if(!t) return {erro:'nenhum tema aberto no editor e tema_nome não encontrado'};
      if(!input.texto) return {erro:'falta texto'};
      if(!Array.isArray(t.notasAssistente)) t.notasAssistente=[];
      t.notasAssistente.push({texto:input.texto, ts:Date.now()});
      persistTema(t);
      if(editing && editing.id===t.id) renderNotasAssistente();
      return {ok:true, tema:t.nome};
    }
    if(nome==='listar_progresso_bimestre'){
      const tu=acharTurmaPorNome(input.turma); if(!tu) return {erro:'turma não encontrada'};
      const bim=input.bimestre||scope.bim;
      const cont=contarAulas(tu,bim), dadas=aulasDadas(tu,bim);
      let totalTemas=0, aplicados=0;
      Object.values(conteudos).filter(c=>c&&c.turmaId===tu.id&&c.bimestre===bim).forEach(c=>{
        temasDoConteudo(c.id).forEach(t=>{ totalTemas++; if(registrosDoTema(t.id).some(r=>r.turmaId===tu.id)) aplicados++; });
      });
      return {turma:turmaNome(tu), bimestre:bim, aulas_previstas:cont.total, aulas_dadas:dadas, temas_totais:totalTemas, temas_aplicados:aplicados};
    }
    if(nome==='sugerir_conteudos_pendentes'){
      const tu=acharTurmaPorNome(input.turma); if(!tu) return {erro:'turma não encontrada'};
      if(typeof candidatosPreProntoDoRecorte==='undefined') return {erro:'catálogo de pré-prontos indisponível'};
      const bim=input.bimestre||scope.bim;
      const existentesKeys=new Set();
      Object.values(conteudos).filter(c=>c&&c.turmaId===tu.id&&c.bimestre===bim).forEach(c=>temasDoConteudo(c.id).forEach(t=>existentesKeys.add((t.dcgo||'')+'::'+(t.nome||''))));
      let candidatos=candidatosPreProntoDoRecorte(tu.disciplina,tu.serie,bim).filter(c=>!existentesKeys.has(c.dcgo+'::'+c.nome));
      const vistos=new Set();
      candidatos=candidatos.filter(c=>{ const k=c.dcgo+'::'+c.nome; if(vistos.has(k)) return false; vistos.add(k); return true; }).slice(0,15);
      return {turma:turmaNome(tu), bimestre:bim, candidatos:candidatos.map(c=>({nome:c.nome,dcgo:c.dcgo,habilidade:c.habilidade}))};
    }
    if(nome==='criar_tema'){
      const tu=acharTurmaPorNome(input.turma); if(!tu) return {erro:'turma não encontrada'};
      if(!input.nome||!input.dcgo||!input.bimestre) return {erro:'faltam nome/dcgo/bimestre'};
      const candidato={nome:input.nome, dcgo:input.dcgo, habilidade:input.habilidade||'', disc:tu.disciplina, serie:tu.serie, bim:input.bimestre};
      const tema=criarTemaAPartirDePrePronto(candidato, tu.id);
      if(!document.getElementById('viewGestao').classList.contains('hidden')) renderThemes();
      return {ok:true, tema_id:tema.id, tema_nome:tema.nome};
    }
    if(nome==='criar_tema_livre'){
      const tu=acharTurmaPorNome(input.turma); if(!tu) return {erro:'turma não encontrada'};
      if(!input.nome||!input.bimestre) return {erro:'faltam nome/bimestre'};
      const bim=input.bimestre;
      let cont=Object.values(conteudos).find(co=>co.turmaId===tu.id&&co.bimestre===bim&&co.nome==='Matriz — '+bim);
      if(!cont){
        const contsDaTurmaBim=Object.values(conteudos).filter(co=>co.turmaId===tu.id&&co.bimestre===bim);
        const ordemCont=contsDaTurmaBim.length?Math.max(...contsDaTurmaBim.map(co=>co.ordem||0))+1:0;
        cont={id:uid(),disciplina:tu.disciplina,serie:tu.serie,turmaId:tu.id,bimestre:bim,nome:'Matriz — '+bim,resumo:'',ordem:ordemCont,updatedAt:Date.now()};
        persistConteudo(cont);
      }
      const tema=blankTema(cont.id,{turmaId:tu.id,disciplina:tu.disciplina,serie:tu.serie,bimestre:bim,nome:String(input.nome).slice(0,80),resumo:input.resumo||'',ordem:nextOrdemTema(cont.id)});
      persistTema(tema);
      if(!document.getElementById('viewGestao').classList.contains('hidden')) renderThemes();
      return {ok:true, tema_id:tema.id, tema_nome:tema.nome};
    }
    if(nome==='criar_aula_avulsa'){
      const tu=acharTurmaPorNome(input.turma); if(!tu) return {erro:'turma não encontrada'};
      if(!input.titulo||!input.data) return {erro:'faltam titulo/data'};

        return {ok:true, apagado:true};

      return {ok:true};
    }
    if(nome==='deixar_nota_geral'){
      if(!input.texto) return {erro:'falta texto'};
      const n={id:uid(), texto:String(input.texto), autor:'assistente'};

        const turmaIds=input.turmas.map(nomeQ=>acharTurmaPorNome(nomeQ)).filter(Boolean).map(t=>t.id);

    }
    return {erro:'ferramenta desconhecida: '+nome};
  }catch(e){ return {erro:e.message}; }

/* ---------- Ditado por voz no chat (Web Speech API do navegador — sem
   custo de IA, mesma técnica do Lex no Iuris) ---------- */
let _reconhecimentoVozChat=null, _ditandoChat=false;
function alternarDitadoChat(){
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionAPI){ toast('Seu navegador não suporta ditado por voz. Tente pelo Chrome ou Safari atualizado.','err'); return; }
  const btn=document.getElementById('btnMicChat'); const input=document.getElementById('chatInput');
  if(_ditandoChat){ _reconhecimentoVozChat && _reconhecimentoVozChat.stop(); _ditandoChat=false; return; }
  if(_reconhecimentoVozChat){
    _reconhecimentoVozChat.onresult=null; _reconhecimentoVozChat.onend=null;
    try{ _reconhecimentoVozChat.abort(); }catch(e){}
  }
  const instancia=new SpeechRecognitionAPI();
  _reconhecimentoVozChat=instancia;
  instancia.lang='pt-BR'; instancia.interimResults=false; instancia.maxAlternatives=1; instancia.continuous=false;
  const textoBase = input.value ? input.value.trim()+' ' : '';
  instancia.onstart=()=>{
    _ditandoChat=true;
    if(btn){ btn.style.background='#a8442f'; btn.style.color='#fff'; btn.textContent='⏹️'; }
    toast('🎙️ Ouvindo... fale e aguarde parar sozinho','');
  };
  instancia.onresult=(e)=>{
    if(instancia!==_reconhecimentoVozChat) return;
    const ultimo=e.results[e.results.length-1];
    const texto=ultimo && ultimo[0] ? ultimo[0].transcript : '';
    input.value=textoBase+texto;
  };
  instancia.onerror=(e)=>{ if(e.error!=='no-speech' && e.error!=='aborted') toast('⚠ Erro no ditado: '+e.error,'err'); };
  instancia.onend=()=>{
    if(instancia!==_reconhecimentoVozChat) return;
    _ditandoChat=false;
    if(btn){ btn.style.background=''; btn.style.color=''; btn.textContent='🎤'; }
  };
  instancia.start();
}
/* ---------- Anexo (foto/PDF) no chat — lido inteiramente no navegador
   (FileReader → base64) e mandado direto no bloco de conteúdo da mensagem.
   gerarComIA é um proxy burro que repassa `messages` sem mexer, então isso
   não exige NENHUMA mudança na Cloud Function nem Firebase Storage — o
   arquivo nunca é salvo em lugar nenhum, só analisado nessa mensagem. */
let _chatAnexoPendente=null; // {mediaType, base64, nome, isImage}
const CHAT_ANEXO_MAX=15*1024*1024;
/* Abre o seletor de arquivo. showPicker() é a API mais nova, feita
   especificamente pra isso — mais confiável que o clique sintético (.click())
   em alguns navegadores/versões. Cai pra .click() se showPicker não existir
   ou falhar por qualquer motivo. O <label> cancela seu próprio comportamento
   nativo (preventDefault) pra sempre passar por aqui, evitando abrir dois
   diálogos em navegadores onde o label já funcionaria sozinho. */
function abrirAnexoChat(){
  const inp=document.getElementById('chatAnexoInput'); if(!inp) return;
  try{
    if(inp.showPicker){ inp.showPicker(); return; }
  }catch(e){ console.warn('showPicker falhou, tentando .click():', e); }
  inp.click();
}
function selecionarAnexoChat(e){
  const f=e.target.files && e.target.files[0]; e.target.value='';
  if(!f) return;
  if(f.size>CHAT_ANEXO_MAX){ toast('Arquivo maior que 15MB — grande demais pra anexar.','err'); return; }
  const tiposOk=['image/jpeg','image/png','image/gif','image/webp','application/pdf'];
  if(!tiposOk.includes(f.type)){ toast('Tipo de arquivo não suportado — envie foto (jpg/png/webp) ou PDF.','err'); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const base64=String(reader.result).split(',')[1]||'';
    _chatAnexoPendente={mediaType:f.type, base64, nome:f.name, isImage:f.type!=='application/pdf'};
    renderAnexoChipChat();
  };
  reader.onerror=()=>toast('Não consegui ler esse arquivo.','err');
  reader.readAsDataURL(f);
}
function removerAnexoChat(){ _chatAnexoPendente=null; renderAnexoChipChat(); }
function renderAnexoChipChat(){
  const box=document.getElementById('chatAnexoChip'); if(!box) return;
  if(!_chatAnexoPendente){ box.innerHTML=''; return; }
  box.innerHTML='<span class="reg-badge" style="display:inline-block;margin-bottom:6px">📎 '+esc(_chatAnexoPendente.nome)+' <a href="#" onclick="event.preventDefault();removerAnexoChat()" style="margin-left:4px;color:inherit">✕</a></span>';

/* ---------- Confirmação obrigatória antes de qualquer ferramenta de
   escrita (criar/editar/apagar compromisso) — pedido explícito: nunca
   sobrescrever nada sem perguntar antes. Ferramentas de leitura e de

const FERRAMENTAS_ESCRITA=new Set(['criar_compromisso','editar_compromisso','criar_tema','criar_tema_livre','criar_aula_avulsa','atualizar_aula_avulsa']);
let _chatConfirmResolve=null;
function aguardarConfirmacaoLote(chamadas){

    _chatConfirmResolve=resolve;

    renderChat();

}
function responderConfirmacaoChat(i, ok){
  const m=_chatMsgs[i]; if(!m || m.role!=='confirm' || m.respondido) return;

}

  const sys='Você é o assistente pessoal de uma professora de História/Filosofia/Sociologia na educação básica brasileira (SEDUC-GO), com lente decolonial e pan-africanista — isso descreve quem ela é, não um limite do que você pode responder. Ajude com QUALQUER pergunta que ela fizer, mesmo sem relação óbvia com essas disciplinas ou com o Leciona (dúvida pessoal, outra matéria, assunto administrativo da escola, o que for) — nunca recuse ou diga que algo "foge do escopo"; se não tiver certeza, ajude com o que souber e seja honesta sobre a incerteza, ou busque na web se a busca estiver disponível. '+hoje+' '+contexto+' Você pode usar ferramentas pra: mexer na Agenda do Leciona (criar/editar/apagar compromissos, criar/mover/apagar/marcar-executada aula avulsa, consultar tudo isso por período — inclui aulas avulsas agora); anexar uma anotação a um tema de aula ou ao bloco de notas geral da Agenda; consultar o progresso do bimestre de uma turma (aulas previstas x dadas, temas aplicados) via listar_progresso_bimestre; sugerir o que dar a seguir via sugerir_conteudos_pendentes (conteúdos da matriz com material pronto que ainda não viraram tema); e criar um tema a partir de um desses conteúdos sugeridos via criar_tema (só funciona com nome/dcgo exatos vindos de sugerir_conteudos_pendentes — não invente nome/dcgo pra essa ferramenta). Quando ela pedir um tema que NÃO vem da matriz oficial — projeto, atividade especial, aula fora do currículo padrão, qualquer coisa que ela descrever livremente — use criar_tema_livre em vez de criar_tema; essa ferramenta existe exatamente pra criar um tema original do zero, com o nome e resumo que ela descrever. Quando a usuária anexar uma foto ou PDF (ex.: calendário de atividades da escola, foto de aviso, planilha impressa), leia com atenção e, se houver datas/eventos claros, liste o que você identificou e use a ferramenta certa pra cada um (compromisso, aula avulsa etc.) — a interface já pede confirmação da usuária antes de qualquer ferramenta de escrita executar de verdade, então pode propor com confiança. Só chame uma ferramenta quando o pedido realmente exigir a ação — pra perguntas e conversa normal, responda só em texto. Seja direto, útil e não invente referências bibliográficas ou dados que não tenha certeza.';

        const leitura=chamadas.filter(c=>!FERRAMENTAS_ESCRITA.has(c.name));

/* Lista achatada de temas com conteúdo, percorrendo TODAS as turmas da mesma disciplina/bimestre — permite circular entre turmas sem sair da projeção */
function projListaGlobal(){
  const d=scope.disc, b=scope.bim, s=scope.serie;
  // Filtra por MESMA disciplina E MESMA série — evita pular de 9º ano para EM durante a projeção
  const turmasList=Object.values(turmas).filter(t=>t.disciplina===d && t.serie===s).sort((a,c)=>turmaNome(a).localeCompare(turmaNome(c)));
  let flat=[];
  turmasList.forEach(tu=>{
    const conts=Object.values(conteudos).filter(c=>c.turmaId===tu.id && c.bimestre===b).sort((a,c)=>(a.ordem||0)-(c.ordem||0));
    conts.forEach(c=>{
      temasDoConteudo(c.id).filter(t=>PROJ_ORDER.some(k=>isFilled(t,k))).forEach(t=>flat.push({turmaId:tu.id, temaId:t.id}));
    });
  });
  return flat;
}
function projProximaTurma(dir){
  const flat=projListaGlobal();
  if(!flat.length){ toast('Nenhum outro tema com conteúdo para projetar.',''); return; }
  const curIdx=flat.findIndex(x=>x.temaId===(proj.tema&&proj.tema.id));
  const next=flat[(curIdx===-1?0:(curIdx+dir+flat.length)%flat.length)];
  scope.turma=next.turmaId; saveScope();
  try{ const sel=document.getElementById('selTurma'); if(sel) sel.value=scope.turma; }catch(e){}
  proj.tema=temas[next.temaId]; proj.idx=0; proj.flip=false; proj.imgMode=false;
  proj.obj=PROJ_ORDER.find(k=>isFilled(proj.tema,k))||'quadro';
  applyProjVars(); renderProjSwitch(); renderProj(); renderProjAdaptPanel();
  toast('Turma '+turmaNome(turmas[next.turmaId])+' · '+proj.tema.nome,'');
}
/* Deslizar (swipe) para navegar — útil sobretudo nos slides, sem precisar dos botões */
function initProjSwipe(){
  const stage=document.getElementById('projStage');
  if(!stage || stage.__swipeInit) return; stage.__swipeInit=true;
  let x0=null,y0=null;
  stage.addEventListener('touchstart',e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; },{passive:true});
  stage.addEventListener('touchend',e=>{
    if(x0===null) return;
    const t=e.changedTouches[0]; const dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0){ if(proj.obj==='flashcards'&&!proj.flip){flipFlash();} else projNav(1); }
      else { projNav(-1); }
    }
  },{passive:true});
}

/* ---------- Busca de imagem (Wikimedia) — projeção e fixar no tema ---------- */
async function wikimediaSearch(term){
  const url='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch='+
    encodeURIComponent(term)+'&gsrlimit=40&prop=imageinfo&iiprop=url|mime|mediatype&iiurlwidth=480&format=json&origin=*';
  const r=await fetch(url); const d=await r.json();
  const pages=d.query?Object.values(d.query.pages):[];
  return pages.map(p=>p.imageinfo&&p.imageinfo[0]).filter(Boolean)
    // remove só PDFs, DjVu, TIFF e SVG (digitalizações/páginas de texto); mantém fotos/figuras
    .filter(im=>{ const u=(im.url||'').split('?')[0].toLowerCase(); if(/\.(pdf|djvu|tif|tiff|svg|ogg|ogv|webm|wav|mid)$/.test(u)) return false; if(im.mediatype && im.mediatype!=='BITMAP' && im.mediatype!=='DRAWING') return false; return !!(im.thumburl||im.url); })
    .map(im=>({thumburl:im.thumburl||im.url, url:im.url, fonte:'Wikimedia'}));
}
async function openverseSearch(term){
  try{
    const url='https://api.openverse.org/v1/images/?q='+encodeURIComponent(term)+'&page_size=30&mature=false';
    const r=await fetch(url); if(!r.ok) return []; const d=await r.json();
    return (d.results||[]).map(x=>({thumburl:x.thumbnail||x.url, url:x.url, fonte:'Openverse'})).filter(x=>x.url);
  }catch(e){ return []; }
}
async function searchImages(term){
  const [a,b]=await Promise.all([wikimediaSearch(term).catch(()=>[]), openverseSearch(term).catch(()=>[])]);
  const seen=new Set(), out=[]; const max=Math.max(a.length,b.length);
  for(let i=0;i<max;i++){ [a[i],b[i]].forEach(im=>{ if(im&&!seen.has(im.url)){ seen.add(im.url); out.push(im); } }); }
  return out;
}
async function projImagem(){
  const term=prompt('Buscar imagem no Wikimedia Commons (livre para aula):', proj.tema?proj.tema.nome:'');
  if(!term) return;
  proj.imgMode=true;
  const stage=document.getElementById('projStage');
  stage.innerHTML='<div class="proj-canvas"><span class="spin"></span> buscando imagens…</div>';
  document.getElementById('projFoot').innerHTML='<button onclick="sairImagem()">‹ voltar ao conteúdo</button>';
  try{
    const imgs=await searchImages(term);
    if(!imgs.length){ stage.innerHTML='<div class="proj-canvas">Nenhuma imagem para "'+esc(term)+'".</div>'; return; }
    stage.innerHTML='<div class="img-grid">'+imgs.map(im=>'<div class="pick"><img src="'+esc(im.thumburl)+'" data-full="'+esc(im.url)+'" onclick="ampliarImg(this)"></div>').join('')+'</div>';
  }catch(e){ stage.innerHTML='<div class="proj-canvas">Erro ao buscar (precisa de internet).</div>'; }
}

async function imgBuscar(){
  const term=document.getElementById('imgQuery').value.trim();
  if(!term){ toast('Digite um termo.','err'); return; }
  const box=document.getElementById('imgResults');
  box.innerHTML='<div class="statusdot"><span class="spin dark"></span> buscando…</div>';
  try{
    const novos=await searchImages(term);
    if(!novos.length && !imgResults.length){ box.innerHTML='<div class="statusdot">Nada encontrado para "'+esc(term)+'". Tente outro termo.</div>'; return; }
    // evita duplicar mesma URL
    const have=new Set(imgResults.map(x=>x.url));
    novos.forEach(im=>{ if(!have.has(im.url)) imgResults.push(im); });
    renderImgResults();
  }catch(e){ box.innerHTML='<div class="statusdot">Erro ao buscar (precisa de internet).</div>'; }
}
function renderImgResults(){
  const box=document.getElementById('imgResults');
  if(!imgResults.length){ box.innerHTML='<div class="statusdot">Sem resultados ainda.</div>'; }
  else box.innerHTML=imgResults.map((im,i)=>'<div class="pick'+(imgSel.has(i)?' sel':'')+'" onclick="imgToggle('+i+')"><img src="'+esc(im.thumburl)+'"></div>').join('');
  const btn=document.getElementById('imgAddBtn'); if(btn){ btn.disabled=imgSel.size===0; btn.textContent='Fixar selecionadas ('+imgSel.size+')'; }
}
function imgToggle(i){ if(imgSel.has(i))imgSel.delete(i); else imgSel.add(i); renderImgResults(); }
function imgAddSelected(){
  if(!imgSel.size) return;
  if(!editing.imagens) editing.imagens=[];
  [...imgSel].forEach(i=>{ const im=imgResults[i]; if(im) editing.imagens.push({thumburl:im.thumburl,url:im.url,titulo:''}); });
  const n=imgSel.size; imgSel=new Set();
  renderImagensEditor(); edDirty(); renderImgResults();
  toast(n+' imagem(ns) fixada(s). Pode continuar buscando.','ok');
}

  const list=Object.values(turmas).sort((a,b)=>((a.unidade||'')+a.disciplina+a.serie+(a.letra||'')).localeCompare((b.unidade||'')+b.disciplina+b.serie+(b.letra||'')));

function excluirTurma(id){
  const t=turmas[id]; if(!t) return;
  // Excluir a turma sozinha deixava conteúdo/temas/alunos/notas órfãos (existiam
  // no banco mas ficavam invisíveis, sem turma pra aparecer). Agora avisa com
  // números reais e apaga tudo que depende dela junto.
  const conts=Object.values(conteudos).filter(c=>c.turmaId===id);
  const temasDaTurma=Object.values(temas).filter(x=>x.turmaId===id);
  const alunosDaT=Object.values(alunos).filter(a=>a.turmaId===id);
  const registrosDaT=Object.values(registros).filter(r=>r.turmaId===id);
  const notasDaT=Object.values(notasCtrl).filter(n=>n.turmaId===id);
  const ativsAfetadas=Object.values(atividadesCtrl).filter(av=>(av.turmaIds||[]).includes(id));
  const ocorrDaT=Object.values(ocorrencias).filter(o=>o.turmaId===id);

  const partes=[];
  if(conts.length) partes.push(conts.length+' conteúdo(s)');
  if(temasDaTurma.length) partes.push(temasDaTurma.length+' tema(s)/aula(s)');
  if(alunosDaT.length) partes.push(alunosDaT.length+' aluno(s)');
  if(registrosDaT.length) partes.push(registrosDaT.length+' registro(s) de aplicação');
  if(notasDaT.length) partes.push(notasDaT.length+' nota(s) lançada(s)');
  if(ocorrDaT.length) partes.push(ocorrDaT.length+' ocorrência(s)');
  const aviso = partes.length
    ? 'Excluir a turma "'+turmaNome(t)+'" também vai apagar: '+partes.join(', ')+'. Não pode ser desfeito. Continuar?'
    : 'Excluir a turma "'+turmaNome(t)+'"? Não pode ser desfeito.';
  if(!confirm(aviso)) return;

  temasDaTurma.forEach(x=>removeTema(x.id)); // já limpa os registros vinculados a cada tema
  conts.forEach(c=>removeConteudo(c.id));

}

};
const FERIADOS_2026 = new Set(['2026-01-01','2026-02-04','2026-02-17','2026-03-06','2026-04-03','2026-04-05','2026-04-21','2026-05-01','2026-05-06','2026-06-04','2026-06-15','2026-09-07','2026-09-16','2026-10-12','2026-10-15','2026-10-24','2026-10-28','2026-11-02','2026-11-11','2026-11-15','2026-11-20','2026-11-30','2026-12-25']);
// Trabalho Coletivo (04/02, 06/03, 06/05, 16/09, 11/11) e Dia do Professor
