<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14201f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leciona">
<title>Leciona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14201f; --board-fg:#f3efe6; --paper:#e9ece7; --surface:#f6f8f4;
  --green:#2f6b5e; --green-d:#234f45; --ochre:#c47a3d; --line:#d2d8cf;
  --muted:#6a7370; --ink-soft:#2a3a38; --danger:#a8442f; --ok:#2f6b5e;
  --radius:10px; --shadow:0 1px 2px rgba(20,32,31,.06),0 8px 24px rgba(20,32,31,.06);
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px}
h1,h2,h3{margin:0;font-weight:600}
.hidden{display:none!important}
.serif{font-family:var(--serif)}

#app{display:flex;flex-direction:column;height:100%}
header.topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--ink);color:var(--board-fg);flex:0 0 auto;max-width:100vw}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.3px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ochre);display:inline-block;transform:translateY(-2px)}
.brand small{font-family:var(--sans);font-weight:500;font-size:11px;color:#9fb0ab;letter-spacing:.14em;text-transform:uppercase}
.topbar .spacer{flex:1}
.topbar nav{display:flex;gap:4px;background:rgba(255,255,255,.06);padding:4px;border-radius:8px}
.topbar nav button{background:transparent;border:0;color:#bcc8c4;padding:7px 14px;border-radius:6px;font-weight:500;font-size:13px}
.topbar nav button.active{background:var(--board-fg);color:var(--ink)}
.icon-btn{background:rgba(255,255,255,.06);border:0;color:var(--board-fg);width:34px;height:34px;border-radius:8px;font-size:15px}
.icon-btn:hover{background:rgba(255,255,255,.14)}
.conn{font-size:11px;color:#9fb0ab;display:flex;align-items:center;gap:6px}
.conn .led{width:8px;height:8px;border-radius:50%;background:var(--ochre)}
.conn.online .led{background:#6fcaa9}

#viewGestao{flex:1;display:flex;min-height:0}
#viewHoje{flex:1;overflow:auto}
#viewAcervo{flex:1;overflow:auto}
#viewNotas{flex:1;overflow:auto}
.notas-wrap{max-width:1100px;margin:0 auto;padding:16px}
.notas-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.notas-toolbar h3{font-family:var(--serif);font-size:17px;flex:1;margin:0}
.notas-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
.notas-table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:13px}
.notas-table th{background:var(--surface);padding:8px 10px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;font-weight:600;position:sticky;top:0;z-index:2;overflow:hidden;text-overflow:ellipsis}
.notas-table th.aluno-col{position:sticky;left:0;z-index:3;background:var(--surface)}
.notas-table td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;overflow:hidden;text-overflow:ellipsis}
.notas-table td.aluno-nome{font-weight:500;position:sticky;left:0;background:var(--card);z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notas-table tr:hover td{background:var(--hover)}
.notas-table tr:hover td.aluno-nome{background:var(--hover)}
.nota-input{width:48px;padding:3px 5px;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text);font-size:13px;text-align:center}
.nota-input:focus{border-color:var(--green);outline:none}
.nota-input.baixa{border-color:var(--err);color:var(--err)}
.nota-input.alta{border-color:var(--green)}
.nota-media{font-size:12px;font-weight:600;padding:3px 6px;border-radius:5px;background:var(--surface)}
.nota-media.aprovado{color:var(--green)}
.nota-media.reprovado{color:var(--err)}
.nota-check{width:22px;height:22px;cursor:pointer;accent-color:var(--green)}
.atv-col-header{padding:4px 2px 2px;display:block;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.atv-remover{cursor:pointer;color:var(--muted);font-size:11px;display:inline-block;padding:1px 5px;border-radius:4px}
.atv-remover:hover{background:var(--err);color:#fff}
.notas-progresso{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.notas-progresso .prog-titulo{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.prog-barra-wrap{background:var(--surface);border-radius:20px;height:8px;margin-bottom:8px;overflow:hidden}
.prog-barra{height:8px;border-radius:20px;background:var(--green);transition:.4s}
.prog-titulo-sm{font-size:11px;font-weight:400;color:var(--muted,#8a8f98);margin-bottom:3px}
.prog-barra-wrap-sm{height:4px;margin-bottom:8px}
.prog-barra-wrap-sm .prog-barra{height:4px}
.prog-objetos{display:flex;flex-wrap:wrap;gap:6px}
.prog-obj{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border)}
.prog-obj.feito{background:var(--green);color:#fff;border-color:var(--green)}
.rel-table{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px}
.rel-table th,.rel-table td{padding:7px 10px;border:1px solid var(--border);text-align:center}
.rel-table th{background:var(--surface);font-weight:600}
.rel-table td:first-child{text-align:left;font-weight:500}
.notas-stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.apl-faixa{margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.apl-faixa summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.apl-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--border);margin-top:6px}
.apl-tema{font-size:13px;flex:1;min-width:140px}
.apl-tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 16px;min-width:100px}
.stat-box strong{display:block;font-size:20px;font-weight:700;color:var(--green)}
.stat-box span{font-size:11px;color:var(--muted)}
.atv-tipo{font-size:10px;display:block;color:var(--muted);font-weight:normal}
.atv-dup-btn{border:0;background:transparent;cursor:pointer;font-size:11px;padding:0 2px;color:var(--green);vertical-align:middle}
.atv-del-btn{border:0;background:transparent;cursor:pointer;font-size:11px;padding:0 2px;color:#a8442f;vertical-align:middle}
.selo-revisa{display:inline-block;margin-left:8px;font-size:10px;font-weight:600;background:#eef4ff;color:#3a5fa8;border:1px solid #c3d4f0;border-radius:20px;padding:1px 8px;vertical-align:middle}
.lt-head{display:flex;align-items:center;gap:10px;margin:14px 0 10px;flex-wrap:wrap}
.lt-head h2{font-family:var(--serif);font-size:19px}
.lt-aulaxy{font-size:13px;color:var(--muted);font-weight:600;margin-left:auto}
.lt-strip-wrap{overflow-x:auto;padding-bottom:6px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.lt-strip{display:flex;gap:4px;padding:10px}
.lt-dia{flex:0 0 auto;width:52px;height:52px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:11px;line-height:1.3;cursor:pointer;color:var(--ink)}
.lt-dia.lt-dado{background:#e3f3ec;border-color:#8fc9ab;color:#1f5c42}
.lt-dia.lt-hoje{background:#dce9fb;border-color:#7fa8de;color:#2a4d80;font-weight:700}
.lt-dia.lt-buraco{background:#fbecdc;border-color:#e0ab6b;color:#8a5620}
.lt-dia.lt-futuro{opacity:.55}
.lt-legenda{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);margin:8px 2px}
.lt-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:middle}
.lt-dot.lt-dado{background:#8fc9ab}
.lt-dot.lt-hoje{background:#7fa8de}
.lt-dot.lt-buraco{background:#e0ab6b}
.lt-dot.lt-futuro{background:var(--line)}
.lt-planejamento{margin-top:18px}
.lt-plan-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.lt-plan-head h3{font-size:14px;margin:0}
.lt-plan-list{display:flex;flex-direction:column;gap:4px}
.lt-plan-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface);border-radius:8px;font-size:12.5px}
.lt-plan-data{flex:0 0 44px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.lt-plan-tema{flex:1;cursor:pointer;font-weight:500}
.lt-plan-tema:hover{text-decoration:underline}
.lt-plan-obj{color:var(--muted);flex:0 0 auto;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt-pendencias{margin-top:18px}
.lt-pendencias h3{font-size:14px;margin-bottom:8px}
.lt-pend-item{padding:8px 10px;background:var(--surface);border-radius:8px;margin-bottom:5px;font-size:13px;cursor:pointer}
.lt-pend-item:hover{background:var(--line)}
.lt-modal-item{padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.lt-modal-click{cursor:pointer;color:#2a4d80}
.lt-modal-click:hover{text-decoration:underline}
.chamada-wrap{max-width:640px}
.chamada-datas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.chamada-resumo{font-size:13px;color:var(--muted);margin-bottom:10px}
.chamada-lista{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.chamada-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--card);transition:background .1s}
.chamada-row:last-child{border-bottom:none}
.chamada-row:hover{background:var(--bg)}
.chamada-row.falta{background:rgba(200,60,60,.08)}
.chamada-nome{font-size:14px}
.chamada-status{font-size:12px;font-weight:600;color:var(--green)}
.chamada-row.falta .chamada-status{color:var(--err)}
.chamada-salvar{margin-top:14px}
.acervo-wrap{max-width:860px;margin:0 auto;padding:16px}
.acervo-filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.acervo-filtros input{flex:1;min-width:180px;padding:8px 14px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--text);font-size:14px;outline:none}
.acervo-filtros input:focus{border-color:var(--green)}
.acervo-filtros select{padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px}
.acervo-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;transition:.15s}
.acervo-card:hover{border-color:var(--green)}
.acervo-card h4{font-family:var(--serif);font-size:15px;margin:0 0 4px;color:var(--text)}
.acervo-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.acervo-turmas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.acervo-tu{font-size:12px;padding:3px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface)}
.acervo-tu.tem-conteudo{border-color:var(--green);color:var(--green)}
.acervo-tu.aplicado{background:var(--green);color:#fff;border-color:var(--green)}
.dup-fix{cursor:pointer;text-decoration:underline dotted}
.dup-fix:hover{opacity:.7}
.agenda-wrap{max-width:900px;margin:0 auto;padding:16px}
.agenda-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:760px){.agenda-layout{grid-template-columns:1fr}}
.agenda-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.agenda-mes-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.agenda-mes-label{font-family:var(--serif);font-size:15px;text-transform:capitalize}
.agenda-semana{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.agenda-semana span{text-align:center;font-size:10px;color:var(--muted);text-transform:uppercase}
.agenda-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.agenda-cel{aspect-ratio:1;border-radius:8px;border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.12s}
.agenda-cel:not(.vazia):hover{background:var(--surface)}
.agenda-cel.hoje{border-color:var(--ochre)}
.agenda-cel.sel{background:var(--green);border-color:var(--green)}
.agenda-cel.sel .agenda-num{color:#fff}
.agenda-num{font-size:12px;color:var(--text)}
.agenda-pontos{display:flex;gap:2px;height:5px}
.agenda-ponto{width:5px;height:5px;border-radius:50%}
.agenda-ponto.aula{background:var(--green)}
.agenda-ponto.cron{background:#6a8fbf}
.agenda-ponto.comp{background:var(--ochre)}
.agenda-ponto.avulsa{background:#7a4b8a}
.agenda-cel.sel .agenda-ponto{background:#fff}
.agenda-secao-tit{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 6px}
.agenda-secao-tit:first-of-type{margin-top:0}
.agenda-card .field{margin-bottom:10px}
.agenda-card .field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.agenda-card .field input,.agenda-card .field textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.agenda-card .field textarea{min-height:50px;resize:vertical}
.acervo-acoes{display:flex;gap:6px}
.acervo-vazio{text-align:center;color:var(--muted);padding:40px 20px}
.acervo-preprontos-head{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ochre);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--border)}
.acervo-card.pronto{border-style:dashed;display:flex;justify-content:space-between;align-items:center;gap:10px}
.acervo-badge-pronto{font-size:10px;color:var(--ochre);background:rgba(196,122,61,.12);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.obj-status-row{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.obj-dot{font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted)}
.obj-dot.feito{background:var(--green);color:#fff;border-color:var(--green)}
.hoje-wrap{max-width:760px;margin:0 auto;padding:30px 22px}
.hoje-head h2{font-family:Spectral,serif;font-size:30px;margin:0 0 4px}
.hoje-nav{display:flex;gap:8px;margin:6px 0}
.hoje-data{color:var(--muted);font-size:13px;margin-bottom:22px}
.hoje-list{display:flex;flex-direction:column;gap:10px}
.hoje-row{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.hoje-hora{flex:0 0 64px;font-weight:700;color:var(--green);font-size:16px;display:flex;flex-direction:column;line-height:1.15}
.hoje-hora small{font-weight:500;color:var(--muted);font-size:11px}
.hoje-info{flex:1;display:flex;flex-direction:column;gap:2px}
.hoje-info b{font-size:15px}
.hoje-info span{font-size:12px;color:var(--muted)}
.hoje-acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hoje-wrap .empty{text-align:center;color:var(--muted);padding:50px 0;font-size:16px}
@media(max-width:560px){.hoje-row{flex-wrap:wrap}.hoje-acoes{width:100%;justify-content:flex-start}}
.scope{flex:0 0 290px;border-right:1px solid var(--line);background:var(--surface);padding:18px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.scope .field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:600}
.scope select,.scope input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.scope .lbl-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scope .lbl-row .btn.sm{padding:2px 9px;text-transform:none;letter-spacing:0}
.scope .sep{height:1px;background:var(--line);margin:4px 0}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:8px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.12s}
.btn:hover{border-color:#b9c2b6}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-d)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:rgba(20,32,31,.05)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{color:var(--danger);border-color:transparent}
.btn.danger:hover{background:rgba(168,68,47,.08)}

.themes{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.themes-head{padding:8px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--surface)}
.themes-head h2{font-family:var(--serif);font-size:16px}
.themes-head .crumb{font-size:12px;color:var(--muted)}
.themes-body{flex:1;overflow:auto;padding:12px 22px}
#progressoBar{padding:0 22px}
#progressoBar .notas-progresso{padding:8px 14px;margin-bottom:6px}
#progressoBar:empty{display:none}

/* Conteúdo > Tema */
.conteudo{border:1px solid var(--line);background:#fff;border-radius:var(--radius);margin-bottom:14px}
.conteudo-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;position:sticky;top:0;z-index:4}
.conteudo-head .cname{font-family:var(--serif);font-size:16px;font-weight:600;flex:1;min-width:0;cursor:pointer}
.conteudo-head .ordbtns{display:flex;flex-direction:column;gap:1px}
.ordbtns button{border:1px solid var(--line);background:#fff;width:22px;height:17px;line-height:1;border-radius:4px;font-size:10px;color:var(--muted);padding:0}
.ordbtns button:hover{border-color:var(--green);color:var(--green)}
.conteudo-body{padding:10px 14px}
.selos{display:inline-flex;gap:4px;flex-wrap:wrap}
.selo{font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:2px 6px;border-radius:5px;text-transform:uppercase}
.selo.revisa{background:#e7efe9;color:#2f6b5e}
.selo.ser{background:#efe6db;color:#a06a2e}
.selo.goiastec{background:#e6e9ef;color:#3a4a8a}
.selo.adapt{background:#e7efe9;color:#2f6b5e}
.selo.casa{background:#f5ecdc;color:#7a5a2e;text-transform:none;cursor:pointer}
.selo.casa:hover{background:#eee0c5}
.selo.adapt-falta{background:#fdecea;color:#a8442f;text-transform:none;cursor:pointer;font-weight:700}
.selo.adapt-falta:hover{background:#f9d9d5}
.selo.met{background:#e3ecf7;color:#2a4d8a;text-transform:none}
.selo.met-repete{background:#fdecea;color:#a8442f;text-transform:none;font-weight:700}
.codigo-inline{font-family:'Courier New',monospace;font-size:10px;font-weight:400;color:var(--muted);background:var(--surface,#f0ead9);padding:1px 5px;border-radius:4px}

.tlist{display:grid;gap:8px}
.tcard{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 13px 11px 17px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.12s;position:relative;overflow:hidden}
.tcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.tcard.st-aplicado::before{background:var(--green)}
.tcard.st-planejado::before{background:var(--ochre)}
.tcard.st-none::before{background:var(--line)}
.tcard:hover{border-color:var(--green);box-shadow:var(--shadow)}
.tcard .tname{font-family:var(--serif);font-size:15px;font-weight:600}
.tcard .tcode{font-size:10.5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:400;letter-spacing:0;margin-right:8px}
.tcard .tsub{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.tcard .tmeta{flex:1;min-width:0}
.tcard .prog{display:flex;gap:3px}
.tcard .prog i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.tcard .prog i.on{background:var(--green)}
.statusdot{font-size:11px;color:var(--muted)}
.statusdot b{color:var(--green)}
.empty{color:var(--muted);text-align:center;padding:44px 20px;font-size:14px}
.empty p{max-width:420px;margin:8px auto}
.addrow{display:flex;gap:8px;margin-top:10px}

/* Editor */
.editor{position:fixed;inset:0;background:var(--paper);z-index:40;display:flex;flex-direction:column}
.editor-top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.editor-top input.tema-nome{font-family:var(--serif);font-size:20px;font-weight:600;border:0;background:transparent;flex:1;color:var(--ink);padding:4px}
.editor-top input.tema-nome:focus{outline:0;border-bottom:2px solid var(--green)}
.editor-body{flex:1;display:flex;min-height:0}
.meta-pane{flex:0 0 312px;border-right:1px solid var(--line);padding:18px;overflow:auto;background:var(--surface)}
.meta-pane .field{margin-bottom:14px}
.meta-pane label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
.meta-pane input,.meta-pane textarea,.meta-pane select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.meta-pane textarea{resize:vertical;min-height:60px}
.meta-pane input.meta-cod-badge{width:auto;max-width:160px;margin-top:6px;padding:2px 8px;font-size:10.5px;font-family:ui-monospace,monospace;color:#8a938c;background:rgba(127,127,127,.1);border:none;border-radius:6px}
.meta-pane input.meta-cod-badge:focus{background:#fff;border:1px solid var(--line);color:var(--ink)}
.meta-pane textarea.meta-anot{min-height:32px;font-size:12.5px;font-style:italic;color:var(--ink-soft);background:transparent;border:1px dashed var(--line)}
.meta-pane textarea.meta-anot:focus{font-style:normal;color:var(--ink);background:#fff;border-style:solid}
.meta-block{border:1px solid var(--line);border-radius:9px;background:#fff;padding:11px;margin-bottom:14px}
.meta-block h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.turma-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.turma-row .tn{font-weight:600;font-size:13px;flex:1;min-width:70px}
.turma-row select,.turma-row input{padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px}
.turma-row input.dt{width:128px}
.img-thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.img-thumbs .it{position:relative;width:74px;height:54px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.img-thumbs .it img{width:100%;height:100%;object-fit:cover}
.img-thumbs .it button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(20,32,31,.78);color:#fff;font-size:11px;line-height:1;padding:0}

.obj-pane{flex:1;display:flex;flex-direction:column;min-width:0}
.obj-tabs{display:flex;gap:2px;padding:10px 16px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface)}
.obj-tabs button{border:0;background:transparent;padding:9px 13px;border-radius:8px 8px 0 0;color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.obj-tabs button.active{color:var(--ink);border-bottom-color:var(--green)}
.obj-tabs button .badge{width:7px;height:7px;border-radius:50%;background:var(--line)}
.obj-tabs button.gerado .badge{background:var(--ochre)}
.obj-tabs button.done .badge{background:var(--green)}
.obj-content{flex:1;overflow:auto;padding:20px 24px;max-width:920px;width:100%;margin:0 auto}
.obj-actions{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.obj-actions .title{font-family:var(--serif);font-size:17px;font-weight:600;flex:1}
.obj-hint{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.45}
.aval-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.aval-tab{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-size:13px;cursor:pointer;color:var(--text);transition:.15s}
.aval-tab:hover{background:var(--hover)}
.aval-tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.reg-table{width:100%;border-collapse:collapse;font-size:13px}
.reg-table th{text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:600}
.reg-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.reg-table tr:last-child td{border-bottom:none}
.reg-table td:nth-child(3){max-width:120px;word-break:break-word}
.reg-table td:nth-child(5){max-width:140px;word-break:break-word;font-size:12px;color:var(--muted)}
.reg-table .btn{padding:2px 6px;font-size:11px}
.busca-bar{padding:6px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:var(--surface);position:sticky;top:0;z-index:5}
#buscaTemas{flex:1;padding:7px 14px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--text);font-size:14px;outline:none;transition:.15s;min-width:0}
#buscaTemas:focus{border-color:var(--green)}
.busca-count{font-size:12px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.rel-temas-list{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px;margin-top:6px}
.rel-temas-grupo{margin-bottom:10px}
.rel-temas-grupo strong{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.check.sm{font-size:13px;padding:2px 0}
@media(max-width:600px){#buscaTemas{width:140px}#buscaTemas:focus{width:160px}}
.reg-badge{display:inline-block;background:#2f6b5e;color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;margin-left:6px;font-weight:600}
.hoje-row.aplicada{border-left:3px solid var(--green);padding-left:10px}
.fmt-bar{display:flex;gap:4px;margin-bottom:6px}
textarea.big{width:100%;min-height:320px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;line-height:1.6;resize:vertical}
.card-list{display:grid;gap:12px}
.mini-card{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px}
.mini-card .row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.mini-card input,.mini-card textarea,.mini-card select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
.mini-card textarea{resize:vertical;min-height:48px}
.mini-card .num{font-family:var(--serif);font-weight:700;color:var(--green);font-size:14px;flex:0 0 auto}
.mini-card label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin:6px 0 3px}
.painel-roster{border-top:1px solid var(--line);margin-top:8px;padding-top:2px}
.painel-al-row{display:flex;align-items:center;gap:8px;padding:4px 2px;cursor:pointer;font-size:12.5px;border-radius:5px}
.painel-al-row:hover{background:var(--surface,#f4f2ea)}
.painel-al-nome{flex:1}
.painel-al-atv{color:var(--muted);font-size:11.5px}
.painel-al-med{font-weight:700;min-width:32px;text-align:right;color:var(--muted)}
.painel-al-med.ok{color:var(--green,#2f6b5e)}
.painel-al-med.baixa{color:#a8442f}

/* Projeção */
html.modo-projecao-popup header{display:none}
#viewProjecao{position:fixed;inset:0;background:var(--ink);color:var(--board-fg);z-index:50;display:flex;flex-direction:column}
#viewProjecao.theme-light{background:#faf8f2;color:#1a1a1a}
#viewProjecao.theme-contrast{background:#000;color:#fff}
.proj-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(0,0,0,.25);flex:0 0 auto}
#btnProjAdapt.active{background:#3a5f8a;color:#fff;border-color:#3a5f8a}
.proj-adapt-panel{position:fixed;top:52px;right:0;bottom:0;width:min(380px,92vw);background:rgba(20,24,22,.97);color:#eef1ee;z-index:55;display:flex;flex-direction:column;box-shadow:-4px 0 18px rgba(0,0,0,.35)}
.proj-adapt-panel.hidden{display:none!important}
#viewProjecao.theme-light .proj-adapt-panel{background:rgba(255,255,255,.98);color:#1a1a1a;box-shadow:-4px 0 18px rgba(0,0,0,.12)}
#viewProjecao.theme-contrast .proj-adapt-panel{background:#000;color:#fff;border-left:2px solid #fff}
.proj-adapt-head{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.15);flex:0 0 auto}
.proj-adapt-head select{flex:1;min-width:0}
.proj-adapt-body{flex:1 1 auto;overflow-y:auto;padding:14px 16px;font-size:15px;line-height:1.5}
.proj-adapt-body h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.proj-adapt-body h4:first-child{margin-top:0}
.theme-light .proj-bar{background:rgba(0,0,0,.05)}
.proj-bar .ptitle{font-family:var(--serif);font-weight:600;font-size:15px;opacity:.85;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-bar .spacer{flex:1}
.obj-switch{display:flex;gap:2px;background:rgba(255,255,255,.08);padding:4px;border-radius:9px;overflow-x:auto;max-width:60vw}
.theme-light .obj-switch{background:rgba(0,0,0,.06)}
.obj-switch button{border:0;background:transparent;color:inherit;opacity:.6;padding:6px 11px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
.obj-switch button.active{background:rgba(255,255,255,.16);opacity:1}
.theme-light .obj-switch button.active{background:rgba(0,0,0,.1)}
.proj-ctrl{display:flex;align-items:center;gap:4px}
.proj-ctrl button{border:0;background:rgba(255,255,255,.08);color:inherit;width:32px;height:32px;border-radius:7px;font-size:14px}
.theme-light .proj-ctrl button{background:rgba(0,0,0,.06)}
.proj-ctrl button:hover{background:rgba(255,255,255,.18)}
.proj-stage{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:5vh 6vw}
.proj-canvas{width:100%;max-width:1100px;font-size:var(--proj-fs,30px);line-height:var(--proj-lh,1.6)}
.proj-canvas h2{font-family:var(--serif);font-size:1.5em;margin-bottom:.6em;color:var(--ochre)}
mark.grifo{background:#fde68a;color:#1a1a1a;padding:.05em .15em;border-radius:2px}
.theme-contrast mark.grifo{background:#f5c344;color:#1a1a1a}
.proj-canvas h3.proj-sub{font-family:var(--serif);font-size:1.05em;margin:.9em 0 .3em;color:var(--ochre);opacity:.85;border-bottom:1px solid currentColor;border-color:rgba(127,127,127,.25);padding-bottom:.15em}
p.msh{font-weight:700;margin:.8em 0 .2em;font-size:1.05em}
.theme-contrast .proj-canvas h2{color:#ffd479}
.proj-canvas p{margin:0 0 .8em}
.proj-canvas ul{margin:0 0 .8em;padding-left:1.3em}
.proj-canvas li{margin-bottom:.4em}
.proj-canvas .q{margin-bottom:1.2em}
.proj-canvas .alt{padding:.25em .6em;border-radius:8px;margin:.2em 0}
.proj-canvas .alt.correct{background:rgba(111,202,169,.22);outline:2px solid #6fcaa9}
.theme-light .proj-canvas .alt.correct{background:rgba(47,107,94,.16);outline-color:var(--green)}
.reveal-box{margin-top:.6em;padding:.5em .8em;border-left:4px solid var(--ochre);background:rgba(255,255,255,.06);border-radius:6px;font-size:.85em}
.theme-light .reveal-box{background:rgba(0,0,0,.04)}
.flash{width:100%;max-width:820px;min-height:46vh;border-radius:18px;border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;text-align:center;padding:6vh 6vw;cursor:pointer;font-family:var(--serif);font-size:1.2em;position:relative;user-select:none}
.theme-light .flash{border-color:rgba(0,0,0,.14)}
.flash .side-label{position:absolute;top:14px;left:18px;font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.5}
.slide{width:100%;max-width:1000px;min-height:50vh;border-radius:16px;background:rgba(255,255,255,.05);padding:6vh 6vw;border:1px solid rgba(255,255,255,.1)}
.theme-light .slide{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.08)}
.slide h2{font-family:var(--serif);font-size:1.6em;margin-bottom:.7em;color:var(--ochre)}
.theme-contrast .slide h2{color:#ffd479}
.slide li{margin-bottom:.6em;font-size:clamp(15px,1em,28px)}
.slide{max-height:78vh;overflow:auto}
.slide h2{font-size:clamp(20px,1.25em,36px)}
.proj-canvas{overflow-wrap:break-word}
.foco{width:100%;margin:8px 0 2px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface,#fff);color:inherit;font-size:13px}
.foco::placeholder{color:#9aa39d}
/* status chip no card */
.stchip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:2px 9px;font-size:11px;cursor:pointer;margin-left:8px;color:var(--ink-soft);white-space:nowrap}
.stchip:hover{border-color:var(--green)}
.stchip.st-planejado{border-color:#c98a33;color:#9a6b1f;background:#fbf3e5}
.stchip.st-aplicado{border-color:#2f6b5e;color:#235247;background:#e9f3ef}
/* painel bimestre */
.bim-grade{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.bim-day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-soft)}
.bim-day input{width:52px;padding:5px;border:1px solid var(--line);border-radius:7px;text-align:center}
.bim-tot{font-size:14px;margin:6px 0}
.bim-list{display:flex;flex-direction:column;gap:5px}
.bim-row{display:flex;align-items:center;gap:10px}
.bim-faixa{flex:0 0 96px;font-size:12px;color:var(--green);font-weight:600}
.bim-tema{flex:1;font-size:13px;display:flex;flex-direction:column;gap:2px}
.bim-det{font-size:11px;color:#8a938c}
.gt-checks{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px;margin-top:6px}
.gt-checks .check{display:flex;align-items:center;gap:8px;margin:0;font-size:13px}
.gt-checks .check input{flex:0 0 auto;margin:0}
.pm-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto;padding:2px}
.pm-group{border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.pm-hab{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:13px}
.pm-cod{font-size:10px;color:#8a938c;background:rgba(127,127,127,.1);border-radius:6px;padding:1px 6px;margin-left:auto}
.pm-subs{margin:6px 0 0 24px;display:flex;flex-direction:column;gap:4px}
.pm-sub{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:12.5px;color:var(--ink-soft)}
.pm-existe{font-size:10px;color:var(--green);background:rgba(47,107,94,.1);border-radius:6px;padding:1px 6px;white-space:nowrap}
.pm-pronto{font-size:10px;color:var(--ochre);background:rgba(196,122,61,.12);border-radius:6px;padding:1px 6px;white-space:nowrap}
.bim-n{width:54px;padding:5px;border:1px solid var(--line);border-radius:7px;text-align:center}
.bim-saldo{margin-top:10px;font-size:13px}
/* editor de ordem do PDF */
.rel-list{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow:auto;padding:2px}
.rel-row{display:flex;align-items:center;gap:8px}
.rel-row .rel-up{display:flex;gap:3px;flex:0 0 auto}
.rel-row .rel-up button{padding:2px 8px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--ink)}
.rel-row .rel-up button:disabled{opacity:.3;cursor:default}
.rel-lbl{flex:1;padding:5px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px}
/* mapa mental interativo na projeção */
.mmint{width:100%;max-width:1100px;text-align:left;font-size:calc(var(--proj-fs,30px)*0.62);line-height:1.35}
.mm-radial{width:100%;max-width:1200px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mm-center{display:inline-block;font-weight:bold;font-size:calc(var(--proj-fs,30px)*0.7);padding:.5em 1em;border:2px solid currentColor;border-radius:999px;margin-bottom:0}
.mm-center::after{content:'';display:block;width:2px;height:22px;background:currentColor;opacity:.5;margin:0 auto}
.mm-branches{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;border-top:2px solid currentColor;border-color:rgba(128,128,128,.4);padding-top:0;position:relative;width:100%}
.mm-branch{display:flex;flex-direction:column;align-items:center;flex:1 1 180px;max-width:260px;padding-top:18px;position:relative}
.mm-branch::before{content:'';position:absolute;top:-2px;left:50%;width:2px;height:18px;background:currentColor;opacity:.5}
.mm-branch-h{font-weight:bold;font-size:calc(var(--proj-fs,30px)*0.5);margin-bottom:6px}
.mm-leaves{list-style:none;margin:0;padding:0;font-size:calc(var(--proj-fs,30px)*0.4);opacity:.9}
.mm-leaves li{margin-bottom:4px}
.dash-empty{opacity:.6}
.mmi-node{margin:2px 0}
.mmi-head{display:flex;gap:10px;align-items:flex-start;padding:6px 12px;border-radius:9px}
.mmi-head.has{cursor:pointer}
.mmi-head.has:hover{background:rgba(127,127,127,.16)}
.mmi-tg{opacity:.65;width:1em;flex:0 0 auto}
.mmi-dot{opacity:.45;flex:0 0 auto}
.mmi-kids{margin-left:1.3em;border-left:2px solid rgba(127,127,127,.32);padding-left:.7em;margin-top:2px}
.mmi-d0>.mmi-head{font-weight:700;font-size:1.25em;color:var(--ochre)}
.theme-contrast .mmi-d0>.mmi-head{color:#ffd479}
.mmi-d1>.mmi-head{font-weight:600}
table.md{border-collapse:collapse;margin:10px 0;font-size:.8em}
table.md th,table.md td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
table.md th{background:rgba(127,127,127,.12);font-weight:600}
.proj-canvas table.md{font-size:.62em}
.proj-canvas table.md th,.proj-canvas table.md td{border-color:rgba(255,255,255,.32)}
.proj-canvas table.md th{background:rgba(255,255,255,.10)}
.theme-light .proj-canvas table.md th,.theme-light .proj-canvas table.md td{border-color:rgba(0,0,0,.25)}
.nav-dots{display:flex;gap:8px;justify-content:center;margin-top:20px}
.nav-dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}
.nav-dots i.on{background:var(--ochre)}
.proj-foot{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px;font-size:13px;opacity:.6;flex:0 0 auto}
.proj-foot button{border:0;background:transparent;color:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;width:100%;max-width:1000px}
.img-grid img{width:100%;border-radius:10px;cursor:pointer;border:2px solid transparent}
.img-grid img:hover{border-color:var(--ochre)}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:14px;padding:3px 10px;font-size:12px;margin:2px 2px;display:inline-block;cursor:pointer}
.chip:hover{border-color:var(--green);color:var(--green)}
.img-grid .pick{position:relative;cursor:pointer}
.img-grid .pick img{width:100%;border-radius:8px;display:block}
.img-grid .pick.sel img{outline:3px solid var(--green);outline-offset:-1px}
.img-grid .pick.sel::after{content:"\2713";position:absolute;top:6px;right:6px;background:var(--green);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.img-grid .pick{position:relative}
.img-grid .pick .fix{position:absolute;bottom:8px;right:8px}
.img-big{max-width:90vw;max-height:74vh;border-radius:12px}

/* Modais / toast */
.modal-bg{position:fixed;inset:0;background:rgba(20,32,31,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-h h3{font-family:var(--serif);font-size:18px;flex:1}
.modal-b{padding:20px 22px}
.modal-b .field{margin-bottom:14px}
.modal-b label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.modal-b label.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.modal-b label.check input{width:auto}
.modal-b input,.modal-b textarea,.modal-b select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px}
.modal-b textarea.mono{min-height:90px;font-family:ui-monospace,monospace;font-size:12px;resize:vertical}
.modal-b small{color:var(--muted);font-size:12px;display:block;margin-top:5px;line-height:1.4}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:7px}
.turma-list .tl{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.turma-list .tl b{flex:1}
.turma-list .tl span{font-size:12px;color:var(--muted)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--board-fg);padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);max-width:80vw}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--green)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.spin.dark{border-color:rgba(20,32,31,.25);border-top-color:var(--green)}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:820px){
  #viewGestao{flex-direction:column}
  .scope{flex:0 0 auto;width:100%;max-height:none;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px;gap:8px}
  .scope .field{margin:0}
  .scope .field label{font-size:11px}
  .themes{width:100%;min-height:50vh;flex:1}
  .tlist{max-height:none}
  .tcard{padding:12px 10px}
  .tcard .tname{font-size:15px}
  .ordbtns button{min-width:34px;min-height:34px;font-size:15px}
  .tcard .btn.ghost.sm{min-width:38px;min-height:38px;font-size:15px}
  .meta-pane{display:none}
  .topbar nav button{padding:7px 10px}
  /* Cabeçalho de conteúdo (Matriz — Bimestre, selos, renomear/→turma/excluir):
     numa linha só isso nunca cabe num celular — quebra pra não cortar botão
     nem apertar o título a ponto de não dar pra ler. */
  .conteudo-head{flex-wrap:wrap;position:static}
  .conteudo-head .cname{flex:1 1 100%;order:1}
  .conteudo-head .ordbtns{order:0}
  .conteudo-head .selos{order:2}
  .conteudo-head .btn.ghost.sm{order:3;font-size:12px;padding:5px 8px}
  /* Topbar: com Hoje/Notas/Gestão/Projetar/Painel/Agenda/Planejamento +
     ícones de ação, nunca cabe tudo — deixa rolar de lado em vez de sumir
     botão (principalmente o de Configurações, que é o último da fila). */
  header.topbar{overflow-x:auto;-webkit-overflow-scrolling:touch;gap:8px;padding:8px 10px}
  header.topbar::-webkit-scrollbar{display:none}
  .topbar .brand{flex:0 0 auto}
  .topbar .brand small{display:none}
  .topbar nav{flex:0 0 auto}
  .topbar .icon-btn{flex:0 0 auto}
  .topbar .spacer{flex:0 0 12px}
}

/* Ranking — pra projetar no fim da aula */
#viewRanking{position:fixed;inset:0;background:var(--ink);color:var(--board-fg);z-index:60;display:flex;flex-direction:column}
.rk-top-bar{display:flex;align-items:center;gap:12px;padding:14px 60px 14px 24px;background:rgba(0,0,0,.25);flex:0 0 auto;position:relative}

.rk-top-bar button{border:0;background:rgba(255,255,255,.08);color:inherit;width:36px;height:36px;border-radius:8px;font-size:16px}

.rk-stage{flex:1;overflow:auto;display:flex;flex-wrap:wrap;gap:36px;justify-content:center;padding:5vh 6vw}
.rk-section{flex:1 1 380px;max-width:480px}

<script>
/* =========================================================
   LECIONA — lógica (v2: Conteúdo→Tema, turmas, ordem, selos, PDF)
   ========================================================= */

/* ---------- Disciplinas / séries / bimestres ---------- */
const SERIES_BY_DISC = {
  'História':   ['6º ano','7º ano','8º ano','9º ano','1ª série EM','2ª série EM','3ª série EM'],
  'Filosofia':  ['1ª série EM','2ª série EM','3ª série EM'],
  'Sociologia': ['1ª série EM','2ª série EM','3ª série EM'],
  'Eletiva':    ['1ª série EM','2ª série EM','3ª série EM','6º ano','7º ano','8º ano','9º ano','—'],
  'Estudo Orientado': ['1ª série EM','2ª série EM','3ª série EM'],
};
const UNIDADES = ['EFG','CEPI Marajó'];
const LETRAS = ['A','B','C','D','E'];
function serieCurta(s){ return ({'1ª série EM':'1ª','2ª série EM':'2ª','3ª série EM':'3ª','6º ano':'6º','7º ano':'7º','8º ano':'8º','9º ano':'9º','—':'—'})[s] || s; }
function turmaNome(t){
  if(!t) return '—';
  if(t.disciplina==='Eletiva') return 'Eletiva'+(t.letra?(' '+t.letra):'');
  if(t.letra) return serieCurta(t.serie||'')+t.letra;          // modelo novo: 9ºA
  if(t.nome && t.nome.trim()) return t.nome.trim();             // turma antiga: nome digitado (ex.: '9º A')
  return serieCurta(t.serie||'')||'(turma)';
}
/* turmaNome() sozinho não basta pra escolher — "1ªA" pode ser a de EFG OU a
   de CEPI Marajó, duas turmas diferentes com o mesmo nome curto. Sempre
   mostra a escola junto pra não ter ambiguidade nos seletores. */
function turmaNomeEscola(t){ return turmaNome(t)+' — '+(t.unidade||'?'); }
/* turmaNome() dá só "1ªA" — em listas com várias disciplinas/escolas juntas
   (ex.: seletor de turma na aula avulsa) isso aparece repetido e ambíguo.
   Esta versão junta disciplina + turma + escola pra nunca confundir. */
function turmaNomeCompleto(t){ return (t.disciplina||'')+' · '+turmaNome(t)+' — '+(t.unidade||'?'); }
/* Nome curto pra tabela de Notas apertada (muitas colunas de atividade):
   últimos 2 sobrenomes em vez do nome completo. O nome completo continua
   no title do texto pra conferir na dúvida. */
function nomeSobrenome(nome){
  const partes=(nome||'').trim().split(/\s+/);
  return partes.length>2 ? partes.slice(-2).join(' ') : (nome||'');
}
/* <option>s agrupadas por disciplina, com a escola sempre visível — usado
   tanto em Notas quanto em Gestão, pra trocar de turma com um só seletor
   em vez dos 4 em cascata (disciplina/unidade/série/turma). */
function turmaOptionsHtml(selectedId){
  const todas=Object.values(turmas).filter(Boolean).sort((a,b)=>turmaNomeEscola(a).localeCompare(turmaNomeEscola(b)));
  return Object.keys(SERIES_BY_DISC).map(d=>{
    const opts=todas.filter(t=>t.disciplina===d);
    if(!opts.length) return '';
    return '<optgroup label="'+esc(d)+'">'+opts.map(t=>'<option value="'+t.id+'"'+(t.id===selectedId?' selected':'')+'>'+esc(turmaNomeEscola(t))+'</option>').join('')+'</optgroup>';
  }).join('');
}
/* Turmas pré-carregadas: [disciplina, série, letra, unidade] */
const SEED_TURMAS = [
  ['História','1ª série EM','A','EFG'],['História','1ª série EM','B','EFG'],
  ['Sociologia','1ª série EM','A','EFG'],['Sociologia','1ª série EM','B','EFG'],
  ['Filosofia','1ª série EM','A','EFG'],['Filosofia','1ª série EM','B','EFG'],

/* Migra temas antigos (9 objetos) para nova estrutura (5 objetos) */
function migrarObjTema(t){
  if(!t||!t.obj||t._objV===2) return false;
  const o=t.obj;
  let changed=false;
  // textoQuadro → quadro
  if(o.textoQuadro!==undefined && o.quadro===undefined){ o.quadro=o.textoQuadro; delete o.textoQuadro; changed=true; }
  // textoAluno → estudo
  if(o.textoAluno!==undefined && o.estudo===undefined){ o.estudo=o.textoAluno; delete o.textoAluno; changed=true; }
  // planejamento → drop (era só metadado interno)
  if(o.planejamento!==undefined){ delete o.planejamento; changed=true; }
  // atividade + gabarito + questoes + flashcards → avaliacao{}
  const avalFields=['questoes','flashcards','atividade','gabarito'];
  const hasOldAval=avalFields.some(k=>o[k]!==undefined);
  if(hasOldAval && !o.avaliacao){
    o.avaliacao={};
    avalFields.forEach(k=>{ if(o[k]!==undefined){ o.avaliacao[k]=o[k]; delete o[k]; } });
    changed=true;
  }
  if(changed) t._objV=2;
  return changed;
}

/* Reparo estrutural: garante que TODO tema tem os 5 campos de obj com o
   tipo certo (quadro/estudo/mapaMental=string, slides=array,
   avaliacao=objeto com 4 sub-arrays). Roda sempre (idempotente), mesmo em
   temas já "migrados" — corrige temas antigos que nunca tiveram slides/
   avaliacao gerados e que travavam a edição/projeção por causa disso.
   Não grava sozinho — só muda em memória (ver migrateAndRender). */
function repararObjTema(t){
  if(!t) return false;
  if(!t.obj) t.obj={};
  const o=t.obj;
  let changed=false;
  if(o.quadro==null){ o.quadro=''; changed=true; }
  if(o.estudo==null){ o.estudo=''; changed=true; }
  if(o.mapaMental==null){ o.mapaMental=''; changed=true; }
  if(!Array.isArray(o.slides)){ o.slides=[]; changed=true; }
  if(!o.avaliacao || typeof o.avaliacao!=='object' || Array.isArray(o.avaliacao)){
    o.avaliacao={questoes:[],flashcards:[],atividade:[],gabarito:[]}; changed=true;
  } else {
    ['questoes','flashcards','atividade','gabarito'].forEach(k=>{
      if(!Array.isArray(o.avaliacao[k])){ o.avaliacao[k]=[]; changed=true; }
    });
  }
  return changed;
}

/* ---------- Firebase / localStorage ---------- */
/* Um item que existe só localmente e não no servidor foi APAGADO no servidor
   (por este ou outro aparelho) — nunca ressuscita. Toda gravação real (criar/
   editar tema, turma, conteúdo) já grava no Firebase na hora via persistX();
   a única forma de "só existir local" é uma exclusão que aconteceu em outro
   lugar enquanto este aparelho estava com cache desatualizado (ex.: reabrir o
   app depois de uma limpeza de duplicatas feita alhures) — nesse caso, o
   certo é respeitar a exclusão, não reenviar. (Bug real encontrado em
   produção: um aparelho com cache velho "trazia de volta" temas já apagados
   por outro aparelho/sessão a cada reload.) */
function mergeRemote(local, remote){
  remote = remote||{}; local = local||{};
  const out = Object.assign({}, remote); const pushBack=[];
  for(const id in local){ const l=local[id], r=remote[id];
    if(!r) continue; // só existe local: foi apagado no servidor — respeita, não ressuscita
    if((l.updatedAt||0) > (r.updatedAt||0)){ out[id]=l; pushBack.push(id); } // mesma id, local mais novo: mantém
  }
  return {merged:out, pushBack};
}
let _pushBackCount=0, _pushBackWindowStart=0;
function pushBackSeguro(path, upd){
  const agora=Date.now();
  if(agora-_pushBackWindowStart>10000){ _pushBackWindowStart=agora; _pushBackCount=0; }
  _pushBackCount++;
  if(_pushBackCount>8){
    toast('⚠ Sincronização com o Firebase pausada automaticamente (muitas gravações repetidas em pouco tempo). Recarregue a página quando puder.','err');
    return;
  }
  DB.ref().update(upd).catch(e=>console.warn('pushBack '+path+':',e));
}

function _escutar(path, cb){
  if(_modoSeguro){ DB.ref(path).once('value').then(cb).catch(e=>console.error(path,e)); }
  else { DB.ref(path).on('value', cb); }
}

/* Cria (se ainda não existir) uma coluna de nota para a Avaliação de um tema
   aplicado numa turma. Idempotente: registrar o mesmo tema de novo não duplica. */
function criarColunaAvaliacao(temaId, turmaId){
  const tema=temas[temaId]; if(!tema) return;
  const marca='aval:'+temaId; // marcador único por tema
  const jaExiste=Object.values(atividadesCtrl).find(av=>av.origem===marca && (av.turmaIds||[]).includes(turmaId));
  if(jaExiste) return;
  // se existe a atividade para outra turma, só adiciona esta turma à lista
  const daMesmaOrigem=Object.values(atividadesCtrl).find(av=>av.origem===marca);
  if(daMesmaOrigem){
    if(!daMesmaOrigem.turmaIds.includes(turmaId)){ daMesmaOrigem.turmaIds.push(turmaId); persistAtivCtrl(daMesmaOrigem); }
    return;
  }
  const nomeCurto=(tema.tituloExibicao||tema.nome||'Avaliação').slice(0,28);
  const av={
    id:uid(),
    nome:'Aval. — '+nomeCurto,
    tipo:'atividade',          // herda cor rosa de ATIV_TIPOS.atividade
    data:isoLocal(new Date()),
    peso:1,
    valorMax:10,
    checklist:true,
    turmaIds:[turmaId],
    disciplina:tema.disciplina||scope.disc,
    bimestre:tema.bimestre||scope.bim,
    origem:marca               // liga a coluna ao tema de origem
  };
  persistAtivCtrl(av);
  if(!document.getElementById('viewNotas').classList.contains('hidden')) renderNotas();
}

/* Aula de recuperação: condensa 2 temas num quadro só, via IA, pra turma que
   ficou pra trás (passeio/palestra/dispensa) não atrasar em relação às

function abrirRecuperacao(){
  if(!scope.turma){ toast('Selecione uma turma.','err'); return; }

  conts.forEach(c=>temasDoConteudo(c.id).forEach(t=>todosTemas.push(t)));
  if(todosTemas.length<2){ toast('Essa turma precisa de pelo menos 2 temas cadastrados pra condensar.','err'); return; }
  const naoAplicados=todosTemas.filter(t=>!registrosDoTema(t.id).some(r=>r.turmaId===scope.turma));
  const sugestao=(naoAplicados.length>=2?naoAplicados:todosTemas).slice(0,2);
  const opts=(sel)=>todosTemas.map(t=>'<option value="'+t.id+'"'+(sel&&sel.id===t.id?' selected':'')+'>'+esc((t.nome||'(sem nome)').slice(0,60))+'</option>').join('');
  const html='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:480px">'+
    '<div class="modal-h"><h3>⚡ Aula de recuperação — '+esc(turmaNome(tu))+'</h3></div>'+
    '<div class="modal-b">'+
      '<small>A IA condensa os dois temas escolhidos num quadro só, enxuto o bastante pra dar numa aula, pra essa turma não ficar pra trás das outras.</small>'+
      '<div class="field" style="margin-top:10px"><label>Tema que ficou pra trás</label><select id="recTema1">'+opts(sugestao[0])+'</select></div>'+
      '<div class="field"><label>Próximo tema planejado</label><select id="recTema2">'+opts(sugestao[1])+'</select></div>'+
      '<div class="field"><label>Foco opcional</label><input id="recFoco" placeholder="ex.: priorizar o essencial de cada um"></div>'+
      '<div id="recProg" class="statusdot"></div>'+
    '</div>'+
    '<div class="modal-f"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" id="recBtn" onclick="gerarRecuperacao()">Gerar</button></div></div></div>';
  const w=document.createElement('div'); w.id='modalWrap'; w.innerHTML=html; document.body.appendChild(w);
}

/* Prepara um valor para célula CSV com segurança:
   - escapa aspas, vírgulas e quebras de linha (senão quebram as colunas);
   - neutraliza "CSV injection": valores iniciados por = + - @ podem ser
     executados como fórmula ao abrir no Excel/Sheets. Prefixamos com ' para
     desativar isso sem alterar o texto visível. */
function csvCell(v){
  let s=(v==null?'':String(v));
  if(/^[=+\-@\t\r]/.test(s)) s="'"+s;
  if(/[",\n\r]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';
  return s;
}
function registrosTodosCSV(){
  const header='Data,Turma,Disciplina,Série,Unidade,Tema,Objetos,Entrega,Nota';
  const rows=Object.values(registros).sort((a,b)=>b.data.localeCompare(a.data)).map(r=>{
    const t=temas[r.temaId]||{}, tu=turmas[r.turmaId]||{};
    return [r.data, turmaNome(tu), tu.disciplina||'', tu.serie||'', tu.unidade||'', t.nome||'', (r.objetos||[]).join(';'), r.entrega, r.nota||''].map(csvCell).join(',');
  });
  return header+'\n'+rows.join('\n');
}
function exportarRegistrosCSV(){
  const csv=registrosTodosCSV();
  const a=document.createElement('a');

/* ---------- Migração: garante turma + conteúdo para tudo ---------- */
let migrated=false;
function autoTurma(d,s){
  let tu=Object.values(turmas).find(x=>x.disciplina===d&&x.serie===s&&x._auto);
  if(!tu){ tu={id:uid(),nome:'Geral — '+s,disciplina:d,serie:s,letra:'',unidade:(scope.unidade||UNIDADES[0]),_auto:true,updatedAt:Date.now()}; persistTurma(tu); }
  return tu.id;
}
/* Popula PREBUILT em todos os temas vazios que têm conteúdo disponível.
   Roda no boot — silencioso, só escreve se o tema está realmente vazio. */
function seedAllPrebuilt(){
  const tocados=[];
  Object.values(temas).forEach(t=>{
    if(t && t.nome && typeof applyPrebuiltIfEmptySilent!=='undefined' && applyPrebuiltIfEmptySilent(t)) tocados.push(t);
  });
  if(tocados.length) console.log('[Leciona] PREBUILT aplicado a '+tocados.length+' tema(s).');
  return tocados;
}
let _ultimoMigrate=0;
let _migrateAgendado=false;
function migrateAndRender(){
  const agora=Date.now();
  if(agora-_ultimoMigrate<1500){
    // chamada rápida demais depois da última — provavelmente eco da nossa
    // própria gravação disparando o listener do Firebase de novo. Em vez
    // de reprocessar tudo na hora (o que pode virar um loop sem fim),
    // agenda UMA única checagem mais adiante e ignora o resto.
    if(!_migrateAgendado){
      _migrateAgendado=true;
      setTimeout(()=>{ _migrateAgendado=false; migrateAndRender(); }, 1600);
    }
    return;
  }
  _ultimoMigrate=agora;
  _migrateAndRenderReal();
}
function _migrateAndRenderReal(){
  const contsTocados=[], temasTocados=[];
  // temas/conteúdos sem turma -> turma automática (planos por turma)
  Object.values(conteudos).forEach(c=>{ if(c && !c.turmaId){ c.turmaId=autoTurma(c.disciplina,c.serie); contsTocados.push(c); } });
  Object.values(temas).forEach(t=>{
    if(!t) return;
    let tocou=false;
    if(t.conteudoId && !t.turmaId){ const c=conteudos[t.conteudoId]; t.turmaId=c?c.turmaId:autoTurma(t.disciplina,t.serie); tocou=true; }
    // Migra estrutura de 9 objetos → 5 objetos (roda uma vez, idempotente)
    if(migrarObjTema(t)) tocou=true;
    // Repara obj incompleto (slides/avaliação ausentes) — roda sempre
    if(repararObjTema(t)) tocou=true;
    if(tocou) temasTocados.push(t);
  });
  const orphans = Object.values(temas).filter(t=>t && !t.conteudoId);
  if(orphans.length){
    // agrupa por disciplina|serie|bimestre, cria conteúdo "Conteúdos avulsos"
    const groups={};
    orphans.forEach(t=>{ const k=t.disciplina+'|'+t.serie+'|'+(t.bimestre||'3º Bimestre'); (groups[k]=groups[k]||[]).push(t); });
    Object.keys(groups).forEach(k=>{
      const [d,s,b]=k.split('|');
      let cont = Object.values(conteudos).find(c=>c.disciplina===d&&c.serie===s&&c.bimestre===b&&c._avulsos);
      if(!cont){
        cont={id:uid(),disciplina:d,serie:s,bimestre:b,turmaId:autoTurma(d,s),nome:'Conteúdos avulsos',resumo:'',ordem:0,_avulsos:true,updatedAt:Date.now()};
        conteudos[cont.id]=cont; contsTocados.push(cont);
      }
      groups[k].forEach((t,i)=>{ t.conteudoId=cont.id; if(t.ordem==null) t.ordem=i; temasTocados.push(t); });
    });
    if(!migrated){ migrated=true; toast('Temas da versão anterior reorganizados em "Conteúdos avulsos".','ok'); }
  }
  seedAllPrebuilt().forEach(t=>temasTocados.push(t));

  // grava tudo de uma vez só (nunca tema por tema — é isso que trava o
  // navegador quando há muitos temas para migrar/reparar de uma vez,
  // como na primeira conexão com um Firebase cheio de conteúdo)
  if(contsTocados.length || temasTocados.length){
    _temaIdx=null;
    if(contsTocados.length) lsSet(LS_CONT, JSON.stringify(conteudos));
    if(temasTocados.length) lsSet(LS_TEMAS, JSON.stringify(temas));
    if(DB){
      const updates={};
      contsTocados.forEach(c=>updates['leciona/conteudos/'+c.id]=c);
      // Nunca reenvia um tema cujo turmaId não aponta pra uma turma real —
      // bug real encontrado em produção: se o cache local deste aparelho
      // ainda tiver um tema órfão (turma apagada em outro lugar/aparelho,
      // ou numa limpeza anterior), "reparar" e regravar ele aqui mesmo
      // ressuscitava a referência morta, mesmo com mergeRemote() já corrigido
      // (esse bug era num caminho DIFERENTE: reparo+regravação, não merge).
      temasTocados.forEach(t=>{
        if(!t.turmaId || !turmas[t.turmaId]) return;
        t._ts=Date.now(); t.updatedAt=t._ts; updates['leciona/temas/'+t.id]=t;
      });
      if(Object.keys(updates).length) DB.ref().update(updates).catch(e=>toast('⚠ Falha ao sincronizar com o Firebase (mantido localmente). '+e.message,'err'));
    }
  }
  renderThemes();
}

function boot(){

  checarSchema();

  Object.keys(SERIES_BY_DISC).forEach(x=>d.add(new Option(x,x)));

  d.value = (SERIES_BY_DISC[scope.disc]?scope.disc:'História');
  us.value = scope.unidade||UNIDADES[0];
  refreshSeries();
  if((SERIES_BY_DISC[scope.disc]||[]).includes(scope.serie)) document.getElementById('selSerie').value=scope.serie;
  document.getElementById('selBim').value = scope.bim;

  try{ viewSalva=localStorage.getItem('leciona_lastview')||'hoje'; offsetSalvo=parseInt(localStorage.getItem('leciona_hojeoffset'),10)||0; }catch(e){}

function refreshSeries(){
  const s=document.getElementById('selSerie'); s.innerHTML='';
  (SERIES_BY_DISC[document.getElementById('selDisc').value]||[]).forEach(x=>s.add(new Option(x,x)));
}
function refreshTurmas(preferId){
  const sel=document.getElementById('selTurma'); if(!sel) return;
  const d=document.getElementById('selDisc').value, s=document.getElementById('selSerie').value;
  const u=(document.getElementById('selUnidade')||{}).value || scope.unidade;
  const list=turmasAtivas().filter(t=>t.disciplina===d && t.serie===s && (t.unidade? t.unidade===u : true)).sort((a,b)=>turmaNome(a).localeCompare(turmaNome(b)));
  sel.innerHTML='';
  if(!list.length){ sel.add(new Option('— sem turma (cadastre em + turmas) —','')); }
  list.forEach(t=>sel.add(new Option(turmaNome(t),t.id)));
  // Prioridade: 1) o que o usuário acabou de escolher no <select> (preferId) 2) scope.turma 3) primeira da lista
  const want = (preferId && list.find(t=>t.id===preferId)) ? preferId
             : (list.find(t=>t.id===scope.turma) ? scope.turma : (list.length?list[0].id:''));
  scope.turma = want; sel.value = want;
  const selUnica=document.getElementById('selTurmaUnica');
  if(selUnica){ selUnica.innerHTML=turmaOptionsHtml(want); selUnica.value=want; }
}
/* Seletor único de turma em Gestão (mesmo padrão de Notas) — troca a turma
   direto, sincronizando os 4 selects antigos (escondidos, ainda usados por
   onScopeChange/refreshTurmas por baixo dos panos) e recarregando o resto. */
function trocarTurmaGestao(turmaId){
  const t=turmas[turmaId]; if(!t) return;
  // onScopeChange() só reconstrói #selSerie de novo (e perde o valor que a
  // gente acabou de setar) se achar que scope.disc ainda está desatualizado
  // — por isso já deixa certo aqui antes de chamar.
  scope.disc=t.disciplina;
  document.getElementById('selDisc').value=t.disciplina;
  refreshSeries();
  document.getElementById('selUnidade').value=t.unidade||scope.unidade;
  document.getElementById('selSerie').value=t.serie;
  refreshTurmas(turmaId);
  onScopeChange();
}
function onScopeChange(){
  try{ const ed=document.getElementById('editor'); if(editing && ed && !ed.classList.contains('hidden')) flushEditor(); }catch(e){}
  const dv=document.getElementById('selDisc').value;
  const turmaEscolhidaPeloUsuario = document.getElementById('selTurma').value; // captura ANTES de reconstruir a lista
  if(scope.disc!==dv){ scope.disc=dv; refreshSeries(); }
  scope.disc=dv;
  scope.unidade=(document.getElementById('selUnidade')||{}).value||scope.unidade;
  scope.serie=document.getElementById('selSerie').value;
  refreshTurmas(turmaEscolhidaPeloUsuario);
  scope.bim=document.getElementById('selBim').value;
  setBusca(''); // garantir busca limpa na troca de turma/bimestre
  saveScope();
  renderThemes();
}

   diferente do selo "Adaptado" de renderPreProntosDoScope(), que só mostra
   o catálogo estático (PREBUILT_ADAPT) pra temas que ainda nem existem.
   Antes desse selo, uma adaptação gerada (t.adaptado[perfil], custou
   crédito de IA de verdade) não aparecia em lugar nenhum da lista de
   Gestão — só dentro do editor, tema por tema. */
function adaptSeloHtml(t){
  if(!t) return '';
  const ad=t.adaptado||{};
  const gerados=ADAPT_PERFIS.filter(pf=>{
    const v=ad[pf.k];
    return v && (typeof v==='object' ? Object.keys(v).length>0 : String(v).trim());
  });
  const necessarios=perfisNecessariosDaTurma(t.turmaId);
  const faltando=ADAPT_PERFIS.filter(pf=>necessarios.includes(pf.k) && !gerados.some(g=>g.k===pf.k));
  let h='';
  if(gerados.length) h+='<span class="selo adapt" title="Material adaptado já gerado: '+esc(gerados.map(p=>p.label).join(', '))+'">🧩 '+esc(gerados.map(p=>p.label).join(', '))+'</span>';
  if(faltando.length) h+='<span class="selo adapt-falta" title="Turma tem aluno(s) que precisam desta adaptação, e este tema ainda não tem — clique em Material adaptado no editor" onclick="event.stopPropagation();abrirEditor(\''+t.id+'\');openAdaptar()">⚠ falta '+esc(faltando.map(p=>p.label).join(', '))+'</span>';
  return h;
}

/* Um código DC-GO/BNCC aparece em VÁRIAS linhas do mapeamento (o mesmo
   código cobre trechos diferentes do livro, em capítulos diferentes) — só
   filtrar por código junta páginas de temas completamente diferentes numa
   aula só. Desempata pela proximidade de texto entre o nome do tema e o
   "tema" de cada linha do mapeamento; se não achar nenhuma linha com
   palavra em comum, não mostra selo (melhor nada do que página errada). */
function paginasDoLivro(dcgo, nomeTema){
  // 1ª tentativa: nomeChave — vem de um doc que já mapeia direto pelo nome
  // real do tema no Leciona (não pelo código), então é a fonte mais confiável
  // quando existe.
  const nomeNorm=_normBuscaTexto(nomeTema||'');
  if(nomeNorm){
    // startsWith, não includes: "Iluminismo" não pode casar com "Direitos
    // naturais (Iluminismo)" só porque a palavra aparece dentro — são temas
    // (e páginas) diferentes, mesmo mencionando o mesmo movimento filosófico.
    const porNome=LIVRO_PAGINAS_LINHAS.find(l=>l.nomeChave && nomeNorm.startsWith(_normBuscaTexto(l.nomeChave)));
    if(porNome) return porNome.pag;
  }
  if(!dcgo) return null;
  const code=dcgo.trim().toUpperCase();
  const linhas=LIVRO_PAGINAS_LINHAS.filter(l=>l.cods.includes(code));
  if(!linhas.length) return null;
  if(linhas.length===1) return linhas[0].pag;
  const palavrasTema=new Set(_normBuscaTexto(nomeTema||'').split(/\s+/).filter(p=>p.length>=4));
  const pontuadas=linhas.map(l=>{
    const palavrasLinha=_normBuscaTexto(l.tema||'').split(/\s+/).filter(Boolean);
    const score=palavrasLinha.filter(p=>palavrasTema.has(p)).length;
    return {l, score};
  }).sort((a,b)=>b.score-a.score);
  if(pontuadas[0].score===0) return null; // ambíguo — várias páginas, nenhuma bate com o nome do tema
  const melhor=pontuadas[0].score;
  return pontuadas.filter(p=>p.score===melhor).map(p=>p.l.pag).join(', ');
}

function conteudosDoScope(){

    .filter(c=>c.turmaId===scope.turma && c.bimestre===scope.bim)
    .sort((a,b)=>(a.ordem||0)-(b.ordem||0));

/* Normaliza pra busca flexível: minúsculas + sem acento (ç, ã, é... viram
   c, a, e...) — assim "revolucao russa" acha "Revolução Russa" mesmo sem
   digitar o acento. */
function _normBuscaTexto(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}
function _buildTemasIdx(){
  _temaIdx={};
  Object.values(temas).forEach(t=>{ if(!t||!t.conteudoId) return; (_temaIdx[t.conteudoId]||(_temaIdx[t.conteudoId]=[])).push(t); });
}
function temasDoConteudo(cid){
  if(!_temaIdx) _buildTemasIdx();
  return (_temaIdx[cid]||[]).slice().sort((a,b)=>{
    const ca=(a.dcgo||'').trim(), cb=(b.dcgo||'').trim();
    if(ca&&cb) return ca.localeCompare(cb,'pt-BR',{numeric:true,sensitivity:'base'});
    if(ca&&!cb) return -1;
    if(!ca&&cb) return 1;
    return (a.ordem||0)-(b.ordem||0);
  });
}

function nextOrdemTema(cid){
  const arr=temasDoConteudo(cid);

/* Pré-prontos da matriz que ainda não viraram tema nesta turma/bimestre —
   sempre visíveis na Gestão, sem precisar de "Puxar temas da matriz"
   manualmente a cada turma/aula. Mesmo padrão assíncrono do Acervo
   (candidatosPreProntoDoRecorte / ensurePrebuiltDiscLoaded), mas escopado
   à turma atual em vez de todas as disciplinas. */
async function renderPreProntosDoScope(){
  const box=document.getElementById('preprontosScope'); if(!box) return;
  if(!scope.turma || !scope.disc || !scope.serie || !scope.bim) return;
  await ensurePrebuiltDiscLoaded(scope.disc);
  const existentesKeys=new Set();
  conteudosDoScope().forEach(c=>temasDoConteudo(c.id).forEach(t=>existentesKeys.add((t.dcgo||'')+'::'+(t.nome||''))));
  let candidatos=candidatosPreProntoDoRecorte(scope.disc, scope.serie, scope.bim).filter(c=>!existentesKeys.has(c.dcgo+'::'+c.nome));
  const vistos=new Set();
  candidatos=candidatos.filter(c=>{ const k=c.dcgo+'::'+c.nome; if(vistos.has(k)) return false; vistos.add(k); return true; });
  _gestaoPreProntoAtual=candidatos;
  const boxAtual=document.getElementById('preprontosScope'); if(!boxAtual) return;
  if(!candidatos.length){ boxAtual.innerHTML=''; return; }
  boxAtual.innerHTML='<div class="conteudo"><div class="conteudo-head"><div class="cname">📦 Pré-prontos disponíveis para esta turma/bimestre ('+candidatos.length+')</div></div>'+
    '<div class="conteudo-body"><div class="tlist">'+
    candidatos.map((c,i)=>{
      const adapts=(typeof PREBUILT_ADAPT!=='undefined' && PREBUILT_ADAPT[c.nome]) ? ADAPT_PERFIS.filter(pf=>PREBUILT_ADAPT[c.nome][pf.k]) : [];
      const adaptsHtml=adapts.length ? '<div class="selos">'+adapts.map(pf=>'<span class="selo adapt" title="Adaptação pronta: '+esc(pf.label)+'">'+esc(pf.label)+'</span>').join('')+'</div>' : '';
      return '<div class="tcard">'+
        '<div class="tmeta">'+
          '<div><span class="tcode">'+esc(c.dcgo||'')+'</span><span class="tname">'+esc(c.nome)+'</span></div>'+
          '<div class="tsub">pré-pronto, ainda não criado nesta turma'+adaptsHtml+'</div>'+
        '</div>'+
        '<button class="btn sm" onclick="usarPreProntoGestao('+i+')">criar tema</button>'+
      '</div>';
    }).join('')+
    '</div></div></div>';

function cycleStatus(tid){
  const t=temas[tid]; if(!t) return;
  const cur=(t.status&&t.status.estado)||'';
  const nxt = cur==='' ? 'planejado' : cur==='planejado' ? 'aplicado' : '';
  t.status={estado:nxt, data: nxt==='aplicado'? isoLocal(new Date()) : ''};
  persistTema(t);
  if(!DB) renderThemes();
  toast(nxt? ('Marcado como '+nxt+'.') : 'Status removido.','ok');
}
function isFilled(t,k){
  if(!t||!t.obj) return false;
  if(k==='avaliacao'){
    const av=t.obj.avaliacao||{};
    return Object.values(av).some(v=>Array.isArray(v)?v.length>0:String(v||'').trim().length>0);
  }
  const v=t.obj&&t.obj[k];
  if(v==null) return false;
  if(Array.isArray(v)) return v.length>0;

        if(prog) prog.innerHTML='<span class="spin dark"></span> <b>'+pct+'%</b> · '+esc(tema.nome)+' — '+k+(rest?(' · ~'+rest+'s restantes'):'')+'…';

        catch(e){ falhaObj++; ultimoErro=e.message; }

  } else { closeModal(); }

}
function sugerirNoConteudo(cid){
